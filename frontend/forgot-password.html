<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbf5ec" />
  <title>Reelday — Forgot Password</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
  <link rel="shortcut icon" href="/favicon.ico?v=3" />
  <link rel="stylesheet" href="/css/shared.css" />
  <style>
    body { min-height: 100dvh; display: flex; flex-direction: column; }
    .page-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }

    .auth-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-card);
      padding: clamp(1.75rem, 5vw, 2.5rem);
      width: 100%; max-width: 420px;
    }

    .auth-brand { display: block; text-align: center; margin-bottom: 2rem; }

    h1 { font-family: var(--display); font-size: 1.6rem; text-align: center; margin-bottom: .4rem; color: var(--ink); }
    .sub { text-align: center; color: var(--ink-soft); font-size: .9rem; margin-bottom: 2rem; }

    .field { margin-bottom: 1.1rem; }
    label { display: block; font-size: .82rem; font-weight: 600; color: var(--ink-soft); margin-bottom: .4rem; }

    input {
      width: 100%; padding: .75rem 1rem; background: #fff;
      border: 1.5px solid var(--line-2); border-radius: var(--r);
      color: var(--ink); font-family: inherit; font-size: .95rem;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(196,90,58,.12); }

    .btn-submit { width: 100%; margin-top: .5rem; min-height: 50px; display: flex; align-items: center; justify-content: center; gap: .5rem; }

    .msg { border-radius: var(--r); padding: .65rem .9rem; font-size: .85rem; margin-top: .75rem; display: none; }
    .msg-error { background: rgba(196,90,58,.08); border: 1px solid rgba(196,90,58,.25); color: var(--accent-deep); }
    .msg-success { background: rgba(45,106,74,.08); border: 1px solid rgba(45,106,74,.25); color: #2d6a4a; }

    .back-link { display: block; text-align: center; font-size: .85rem; color: var(--ink-faint); margin-top: 1.25rem; text-decoration: none; }
    .back-link:hover { color: var(--accent); }

    .inline-spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="page-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <a class="brand" href="/">REELDAY<sup>★</sup></a>
    </div>
    <h1>Forgot password?</h1>
    <p class="sub">Enter your email and we'll send you a reset link.</p>

    <form id="forgot-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com" autocomplete="email" required />
      </div>
      <button class="btn btn-accent btn-submit" id="btn-submit" type="submit">
        <div class="inline-spinner" id="spinner"></div>
        <span id="btn-text">Send reset link</span>
      </button>
      <div class="msg msg-error" id="error-msg"></div>
      <div class="msg msg-success" id="success-msg"></div>
    </form>

    <a class="back-link" href="/login">← Back to login</a>
  </div>
</div>

<script>
  const form    = document.getElementById('forgot-form');
  const btn     = document.getElementById('btn-submit');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btn-text');
  const errMsg  = document.getElementById('error-msg');
  const okMsg   = document.getElementById('success-msg');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errMsg.style.display = 'none';
    okMsg.style.display  = 'none';

    const email = document.getElementById('email').value.trim();
    if (!email) { errMsg.textContent = 'Please enter your email.'; errMsg.style.display = 'block'; return; }

    btn.disabled          = true;
    spinner.style.display = 'block';
    btnText.textContent   = 'Sending…';

    try {
      const res  = await fetch('/api/auth/forgot-password', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Something went wrong.');

      form.querySelector('.field').style.display = 'none';
      btn.style.display      = 'none';
      okMsg.textContent      = data.message || 'If that email exists, a reset link has been sent.';
      okMsg.style.display    = 'block';
    } catch (err) {
      errMsg.textContent    = err.message;
      errMsg.style.display  = 'block';
      btn.disabled          = false;
      spinner.style.display = 'none';
      btnText.textContent   = 'Send reset link';
    }
  });
</script>
</body>
</html>
