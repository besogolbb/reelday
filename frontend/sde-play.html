<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reelday — Same Day Edit</title>
<!--
  Minimal isolated SDE player. Loaded in an <iframe> by wall.html when
  the host taps "Play on wall". The whole point is ISOLATION: this page
  has its own JS context, its own network connection pool, and its own
  decoder slot — none of the wall's 1Hz polling, gallery videos, music
  subsystem, emoji animations, or giant DOM compete with playback.

  Inputs (query string):
    src    — the rendered reel mp4 URL (required)
    poster — poster JPEG URL (optional)

  No polling here. The PARENT wall owns the takeover lifecycle: it
  creates this iframe on play, and tears it down (src=about:blank) on
  stop. This page just plays.
-->
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  #v {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  #loading, #sound {
    position: fixed; left: 50%;
    color: #fff; background: rgba(0,0,0,.7);
    border: 1px solid rgba(255,255,255,.18);
    padding: 16px 30px; border-radius: 999px;
    font: 14px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .16em; text-transform: uppercase;
    display: none; align-items: center; gap: 12px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  #loading { top: 50%; transform: translate(-50%, -50%); }
  #sound   { bottom: 9vh; transform: translateX(-50%); cursor: pointer; }
  #loading.on, #sound.on { display: inline-flex; }
  .spin {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
    border-radius: 50%; animation: s .9s linear infinite;
  }
  @keyframes s { to { transform: rotate(360deg); } }
  /* Thin "how-much-left" line pinned to the very bottom. No transition
     on the fill so the loop wrap (currentTime → 0) snaps back instantly
     instead of reverse-animating across the screen. timeupdate fires
     ~4×/sec which is smooth enough for a 4-min reel. */
  #progress {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 6px; background: rgba(255,255,255,.22);
    /* z-index above the <video> in case a browser stacks fixed siblings
       weirdly; the video is at z:auto so any positive value wins. */
    z-index: 5;
    pointer-events: none;
  }
  #progress > #progressFill {
    height: 100%; width: 0%;
    background: #ffffff;
    /* Subtle glow so the fill reads at a distance on a venue TV. */
    box-shadow: 0 0 6px rgba(255,255,255,.55);
  }
  /* Small one-tap fullscreen icon, top-right. Hides instantly on
     click — the wall is meant to live in fullscreen the rest of the
     reel; the icon's only job is "get me in". Re-appears if the user
     exits fullscreen (Esc) so they can tap back in. */
  #fsBtn {
    /* Bottom-right, lifted just above the progress bar (6 px tall)
       so the button doesn't sit on top of the fill. */
    position: fixed; right: 14px; bottom: 18px;
    width: 44px; height: 44px;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: background .12s ease;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  #fsBtn:hover { background: rgba(0,0,0,.78); }
  #fsBtn svg   { width: 20px; height: 20px; }
  #fsBtn.hidden { display: none; }
</style>
</head>
<body>
  <!-- NB: no `loop` attribute — parent wall owns one-play lifecycle.
       (Kept in JS too: v.loop = false, belt + suspenders.) -->
  <video id="v" playsinline preload="auto" muted></video>
  <div id="loading"><span class="spin"></span><span>Loading reel</span></div>
  <div id="sound" role="button" tabindex="0">🔊 Tap for sound</div>
  <div id="progress"><div id="progressFill"></div></div>
  <button id="fsBtn" type="button" aria-label="Toggle fullscreen" title="Fullscreen (F · Space · double-click)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
    </svg>
  </button>
<script>
  (function () {
    var qs      = new URLSearchParams(location.search);
    var src     = qs.get('src');
    var poster  = qs.get('poster');
    var v       = document.getElementById('v');
    var loading = document.getElementById('loading');
    var sound   = document.getElementById('sound');
    var fill    = document.getElementById('progressFill');
    var fsBtn   = document.getElementById('fsBtn');

    if (!src) { document.body.textContent = ''; return; }

    console.info('[sde-play] init, src=', src);

    if (poster) v.poster = poster;
    v.muted = true;   // muted autoplay is universally permitted
    v.loop  = false;  // play ONCE; parent wall tears us down on `ended`
                      // (it then resumes the live gallery)
    v.src   = src;
    try { v.load(); } catch (e) {}

    // When the reel finishes, hold on the last frame (typically the
    // endcard — "Thank you for celebrating") for END_HOLD_MS before
    // signaling the parent to return to gallery. Without a hold, the
    // wall snaps to live thumbnails the instant the reel ends and the
    // closing moment doesn't land. 10s lets the room read the endcard.
    var END_HOLD_MS = 10000;
    var endedFired  = false;
    function signalEnded(reason) {
      if (endedFired) return;
      endedFired = true;
      console.info('[sde-play] reel ended (' + reason + '), holding ' +
                   (END_HOLD_MS / 1000) + 's then signaling parent');
      setTimeout(function () {
        try {
          parent.postMessage({ type: 'sde-play-ended' }, window.location.origin);
        } catch (e) {
          console.warn('[sde-play] postMessage failed:', e && e.message);
        }
      }, END_HOLD_MS);
    }
    v.addEventListener('ended', function () { signalEnded('ended-event'); });
    // Belt + suspenders fallback. The `ended` event is *supposed* to
    // fire when currentTime hits duration, but some browser + mp4
    // combinations don't reliably emit it (esp. R2-served files whose
    // duration metadata is just shy of the actual last frame). If we
    // get within 0.3s of duration without firing, treat it as ended.
    v.addEventListener('timeupdate', function () {
      if (endedFired) return;
      if (!isFinite(v.duration) || v.duration <= 0) return;
      if (v.currentTime >= v.duration - 0.3) signalEnded('timeupdate-fallback');
    });

    loading.classList.add('on');

    var started = false;
    function start(reason) {
      if (started) return;
      started = true;
      loading.classList.remove('on');
      console.info('[sde-play] starting (' + reason + ')');
      var p = v.play();
      if (p && p.then) {
        p.then(function () {
          // Do NOT auto-unmute: browsers PAUSE the video if an unmute
          // is rejected without a user gesture (https://goo.gl/xX8pDD).
          // The sound hint is the gesture path. A tap anywhere in this
          // iframe counts as activation for this iframe's context.
          sound.classList.add('on');
        }).catch(function (err) {
          console.warn('[sde-play] play() failed:', err && err.message);
        });
      } else {
        sound.classList.add('on');
      }
    }

    // Prefer canplaythrough (browser thinks it can sustain playback).
    // Fallbacks so a slow connection can't trap a black screen forever.
    v.addEventListener('canplaythrough', function () { start('canplaythrough'); }, { once: true });
    setTimeout(function () { if (!started && v.readyState >= 3) start('canplay-fallback'); }, 8000);
    setTimeout(function () { start('hard-fallback'); }, 18000);

    // Drive the progress fill from the video's own clock. Guard NaN
     // duration (fires before metadata loads).
    v.addEventListener('timeupdate', function () {
      if (isFinite(v.duration) && v.duration > 0) {
        fill.style.width = (v.currentTime / v.duration * 100) + '%';
      }
    });

    function unmute() {
      v.muted = false;
      if (!v.muted) sound.classList.remove('on');
    }
    sound.addEventListener('click', unmute);
    sound.addEventListener('keydown', function (e) {
      // Enter still unmutes (a11y). Space is handled at the document
      // level for fullscreen — DON'T also unmute on space here, or
      // pressing Space would simultaneously unmute + toggle fullscreen.
      if (e.key === 'Enter') unmute();
    });

    // Fullscreen shortcuts — F key, Space, double-click. While the
    // takeover is up, focus is inside this iframe so the wall's own
    // handlers don't fire. The iframe is `allow="fullscreen"` so
    // requesting fullscreen on our documentElement works the same as
    // it would on the parent (visually identical — the iframe is
    // already 100% × 100% of the takeover overlay).
    function toggleFs() {
      try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          var req = document.documentElement.requestFullscreen ||
                    document.documentElement.webkitRequestFullscreen;
          if (req) req.call(document.documentElement);
        } else {
          var exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
        }
      } catch (e) {
        console.warn('[sde-play] fullscreen failed:', e && e.message);
      }
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'f' || e.key === 'F' || e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        toggleFs();
      }
    });
    document.addEventListener('dblclick', function () { toggleFs(); });

    // Icon click → hide instantly, then toggle fullscreen. The hide is
    // optimistic (before fullscreen actually engages) so the button
    // doesn't linger for a frame; if the fullscreen request fails for
    // some reason, fullscreenchange won't fire and the button stays
    // hidden — that's fine, the user still has F/Space/dblclick.
    if (fsBtn) {
      fsBtn.addEventListener('click', function () {
        fsBtn.classList.add('hidden');
        toggleFs();
      });
    }
    // Re-show the icon if the user exits fullscreen (Esc), so they
    // can tap back in without remembering a keyboard shortcut.
    function syncFsBtnVisibility() {
      if (!fsBtn) return;
      var inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (inFs) fsBtn.classList.add('hidden');
      else      fsBtn.classList.remove('hidden');
    }
    document.addEventListener('fullscreenchange',       syncFsBtnVisibility);
    document.addEventListener('webkitfullscreenchange', syncFsBtnVisibility);
  })();
</script>
</body>
</html>
