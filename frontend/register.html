<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbf5ec" />
  <title>Reelday — Sign Up</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
  <link rel="shortcut icon" href="/favicon.ico?v=3" />
  <link rel="stylesheet" href="/css/shared.css" />
  <style>
    body { min-height: 100dvh; display: flex; flex-direction: column; }

    .page-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }

    .auth-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-card);
      padding: clamp(1.75rem, 5vw, 2.5rem);
      width: 100%; max-width: 420px;
    }

    .auth-brand { display: block; text-align: center; margin-bottom: 2rem; }

    h1 { font-family: var(--display); font-size: 1.7rem; text-align: center; margin-bottom: .4rem; color: var(--ink); }

    .sub { text-align: center; color: var(--ink-soft); font-size: .9rem; margin-bottom: 2rem; }

    .field { margin-bottom: 1rem; }

    label { display: block; font-size: .82rem; font-weight: 600; color: var(--ink-soft); margin-bottom: .4rem; }

    input {
      width: 100%; padding: .75rem 1rem; background: #fff;
      border: 1.5px solid var(--line-2); border-radius: var(--r);
      color: var(--ink); font-family: inherit; font-size: .95rem;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196,90,58,.12);
    }

    .btn-submit {
      width: 100%; margin-top: .5rem;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      min-height: 50px;
    }

    .error-msg {
      background: rgba(196,90,58,.08);
      border: 1px solid rgba(196,90,58,.25);
      color: var(--accent-deep);
      border-radius: var(--r);
      padding: .65rem .9rem;
      font-size: .85rem; margin-top: .75rem; display: none;
    }

    .success-state { text-align: center; padding: 1rem 0; display: none; }
    .success-icon { font-size: 3rem; margin-bottom: 1rem; }
    .success-state h2 { font-family: var(--display); color: #2d6a4a; margin-bottom: .5rem; }
    .success-state p { color: var(--ink-soft); font-size: .9rem; line-height: 1.6; }

    .login-link { text-align: center; font-size: .88rem; color: var(--ink-soft); margin-top: 1.25rem; }
    .login-link a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }

    .divider {
      text-align: center; color: var(--ink-faint);
      margin: 1.25rem 0; font-size: .85rem; position: relative;
    }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%;
      width: 42%; height: 1px; background: var(--line);
    }
    .divider::before { left: 0; } .divider::after { right: 0; }

    #google-btn { display: flex; justify-content: center; margin-bottom: .5rem; }

    .inline-spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="page-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <a class="brand" href="/">REELDAY<sup>★</sup></a>
    </div>
    <h1>Create account</h1>
    <p class="sub">Start capturing your special moments</p>

    <form id="reg-form" novalidate>
      <div class="field">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" placeholder="Juan dela Cruz" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="phone">Phone (optional)</label>
        <input type="tel" id="phone" placeholder="+63 912 345 6789" autocomplete="tel" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password" required />
      </div>
      <button class="btn btn-accent btn-submit" id="btn-submit" type="submit">
        <div class="inline-spinner" id="spinner"></div>
        <span id="btn-text">Create account</span>
      </button>
      <div class="error-msg" id="error-msg"></div>
    </form>

    <div class="success-state" id="success-state">
      <div class="success-icon">📬</div>
      <h2>Check your email!</h2>
      <p>We sent a verification link to <strong id="success-email"></strong>. Click it to activate your account.</p>
    </div>

    <div class="divider">or</div>
    <div id="google-btn"></div>
    <div class="login-link">Already have an account? <a href="/login">Log in</a></div>
  </div>
</div>

<script type="module">
  import { getToken, saveAuth } from '/js/auth.js';
  if (getToken()) location.href = '/my-events';
  const nextUrl = new URLSearchParams(location.search).get('next') || '/create';

  const form    = document.getElementById('reg-form');
  const btn     = document.getElementById('btn-submit');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btn-text');
  const errMsg  = document.getElementById('error-msg');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errMsg.style.display = 'none';
    btn.disabled         = true;
    spinner.style.display = 'block';
    btnText.textContent  = 'Creating…';

    try {
      const email = document.getElementById('email').value.trim();
      const res   = await fetch('/api/auth/register', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          email,
          password:  document.getElementById('password').value,
          full_name: document.getElementById('full_name').value.trim(),
          phone:     document.getElementById('phone').value.trim() || undefined,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Registration failed');

      if (data.token) {
        saveAuth(data.token, data.user);
        location.href = nextUrl;
      } else {
        form.style.display = 'none';
        document.getElementById('success-email').textContent = email;
        document.getElementById('success-state').style.display = 'block';
      }
    } catch (err) {
      errMsg.textContent    = err.message;
      errMsg.style.display  = 'block';
      btn.disabled          = false;
      spinner.style.display = 'none';
      btnText.textContent   = 'Create account';
    }
  });

  // ── Google Sign-In ────────────────────────────────────
  async function handleGoogleCredential(response) {
    try {
      const res  = await fetch('/api/auth/google', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ credential: response.credential }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Google sign-in failed');
      saveAuth(data.token, data.user);
      location.href = '/my-events';
    } catch (err) {
      errMsg.textContent   = err.message;
      errMsg.style.display = 'block';
    }
  }

  const { google_client_id } = await fetch('/api/auth/config').then(r => r.json()).catch(() => ({}));
  if (google_client_id) {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = () => {
      google.accounts.id.initialize({ client_id: google_client_id, callback: handleGoogleCredential });
      google.accounts.id.renderButton(document.getElementById('google-btn'), {
        theme: 'outline', size: 'large', width: 368, text: 'signup_with', shape: 'rectangular',
      });
    };
    document.head.appendChild(s);
  }
</script>
</body>
</html>
