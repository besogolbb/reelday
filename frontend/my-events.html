<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbf5ec" />
  <title>Reelday — My Events</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=5" />
  <link rel="shortcut icon" href="/favicon.ico?v=5" />
  <link rel="stylesheet" href="/css/shared.css" />
  <style>
    body { min-height: 100dvh; }

    /* ── Page header ── */
    .page-header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 2.5rem 1.5rem;
    }
    .page-header-inner { max-width: 900px; margin-inline: auto; }
    .page-title {
      font-family: var(--display);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      color: var(--ink);
      margin-bottom: .3rem;
    }
    .page-sub { color: var(--ink-faint); font-size: .9rem; }

    /* ── Main ── */
    .main { max-width: 900px; margin-inline: auto; padding: 2rem 1.5rem 4rem; }

    /* ── Event cards ── */
    .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }

    .event-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-soft);
      transition: transform .2s ease, box-shadow .2s ease;
      display: flex; flex-direction: column; gap: .75rem;
    }
    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lift);
    }

    .ec-top { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; }
    .ec-names { font-family: var(--display); font-size: 1.1rem; line-height: 1.3; flex: 1; color: var(--ink); }

    .ec-badge {
      font-family: var(--mono);
      font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      padding: .3rem .7rem; border-radius: 999px; white-space: nowrap;
      display: inline-flex; align-items: center; gap: .35rem;
    }
    /* Per-tier palette — keyed off the 2026 tier ids (tala/sinag/dalisay/hiraya).
       Tala (free)        : neutral paper chip
       Sinag (₱1,490)     : warm amber
       Dalisay (★ featured): brand accent
       Hiraya (₱9,990/yr) : deep ink with paper text — the premium signal */
    .badge-tala     { background: var(--paper-2);          color: var(--ink-soft); }
    .badge-sinag    { background: rgba(216,160,90,.18);    color: #7a5a20; }
    .badge-dalisay  { background: rgba(196,90,58,.14);     color: var(--accent-deep); border: 1px solid rgba(196,90,58,.25); }
    .badge-hiraya   { background: var(--ink);              color: var(--paper); }
    /* Pending (unpaid paid-tier) overlays the tier chip with a dot. */
    .badge-pending  { background: rgba(216,160,90,.15);    color: #7a5a20; }
    .badge-dot {
      width: 6px; height: 6px; border-radius: 999px; background: currentColor;
      opacity: .65; flex-shrink: 0;
    }

    /* Legacy aliases — older event rows may still carry libre /
       selebrasyon / pro plan values. Keep the visual mapping so the
       chip never silently disappears. */
    .badge-libre       { background: var(--paper-2);             color: var(--ink-soft); }
    .badge-selebrasyon { background: rgba(216,160,90,.18);       color: #7a5a20; }
    .badge-pro         { background: var(--ink);                 color: var(--paper); }

    .ec-meta { font-size: .8rem; color: var(--ink-faint); display: flex; gap: 1rem; flex-wrap: wrap; }
    .ec-type { text-transform: capitalize; }

    .ec-actions { display: flex; gap: .65rem; margin-top: .25rem; }
    .ec-link {
      flex: 1; padding: .55rem; text-align: center; border-radius: var(--r);
      font-size: .83rem; font-weight: 600; text-decoration: none; transition: all .15s;
    }
    .ec-link-primary { background: var(--accent); color: #fff; }
    .ec-link-primary:hover { background: var(--accent-deep); }
    .ec-link-ghost {
      background: transparent;
      border: 1px solid var(--line-2);
      color: var(--ink-soft);
    }
    .ec-link-ghost:hover { background: var(--paper-2); color: var(--ink); }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 5rem 2rem; color: var(--ink-faint); }
    .empty-icon { font-size: 3.5rem; margin-bottom: 1rem; }
    .empty h2 { font-family: var(--display); font-size: 1.4rem; color: var(--ink-soft); margin-bottom: .5rem; }
    .empty p { font-size: .9rem; margin-bottom: 1.5rem; line-height: 1.6; }

    /* ── Loading ── */
    .loading { display: flex; align-items: center; justify-content: center; padding: 5rem; }

    /* Lapsed-Hiraya banner — amber, dismissible by acting on the CTA.
       Shown at the top of /my-events when a user's subscription_tier is
       still 'hiraya' but subscription_expires_at has passed. The CTA
       fires /api/payments/create with success_path='renew' so they drop
       back here with ?renewed=1 after PayMongo. */
    .lapsed-banner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-left: 4px solid #d97706;
      border-radius: var(--r);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    .lapsed-banner-copy { flex: 1; min-width: 220px; }
    .lapsed-banner-title { font-weight: 700; color: #78350f; margin-bottom: .15rem; font-size: .95rem; }
    .lapsed-banner-sub { font-size: .85rem; color: #92400e; line-height: 1.5; }
    .lapsed-banner-cta {
      background: #d97706; color: #fff;
      padding: .6rem 1.25rem;
      border: none; border-radius: var(--r);
      font-weight: 700; font-size: .9rem; cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    .lapsed-banner-cta:hover { background: #b45309; }
    .lapsed-banner-cta:disabled { opacity: .6; cursor: wait; }

    /* "Renewed!" success flash — green, auto-hides. */
    .renewed-flash {
      background: #dcfce7;
      border: 1px solid #4ade80;
      color: #166534;
      padding: .75rem 1.25rem;
      border-radius: var(--r);
      margin-bottom: 1.5rem;
      font-size: .9rem;
    }

    @media (max-width: 600px) {
      .main { padding-inline: 1rem; }
      .site-header-inner { padding-inline: 1rem; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a class="brand brand-lockup" href="/" aria-label="Reelday.ph — home"><img src="/images/LOGO.png?v=2" alt="Reelday.ph" class="brand-img" /></a>
    <div class="site-actions">
      <span style="font-size:.85rem;color:var(--ink-soft)" id="nav-user"></span>
      <button class="btn btn-ghost" id="btn-logout" style="padding:10px 16px;font-size:.85rem">Logout</button>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="page-header-inner">
    <h1 class="page-title">My Events</h1>
    <p class="page-sub" id="page-sub">Loading…</p>
  </div>
</div>

<main class="main">
  <div id="sub-status"></div>
  <a class="btn btn-accent" href="/start" id="new-event-link" style="margin-bottom:2rem;display:inline-flex">+ New Event</a>

  <div class="loading" id="loading"><div class="spinner"></div></div>
  <div id="events-container" style="display:none"></div>
</main>

<script type="module">
  import { getToken, getUser, authHeaders, requireAuth, logout } from '/js/auth.js';
  import { captureCouponFromUrl, renderCouponBanner } from '/js/coupon.js';
  captureCouponFromUrl();
  renderCouponBanner();

  if (!requireAuth()) throw new Error('redirect');

  const user = getUser();
  document.getElementById('nav-user').textContent = user?.full_name ?? '';
  document.getElementById('btn-logout').onclick = logout;

  // 2026 tier ids first, legacy aliases below for any rows still
  // carrying the pre-rename plan column values. Display strings keep
  // the Filipino tier names (per project-plan-tiers-event-scoped).
  const PLAN_LABELS = {
    tala:        ['badge-tala',        'Tala'],
    sinag:       ['badge-sinag',       'Sinag'],
    dalisay:     ['badge-dalisay',     '★ Dalisay'],
    hiraya:      ['badge-hiraya',      'Hiraya'],
    // Legacy plan ids — keep working for old event rows.
    libre:       ['badge-libre',       'Tala'],
    selebrasyon: ['badge-sinag',       'Sinag'],
    pro:         ['badge-hiraya',      'Hiraya'],
  };

  const TYPE_MAP = {
    wedding: '💍 Kasalan', debut: '👑 Debut', birthday: '🎂 Birthday',
    seventh_birthday: '🌟 7th Birthday', baptism: '🕊️ Baptism',
    reunion: '🎉 General Event', corporate: '🏢 Corporate', memorial: '🕯️ Memorial',
  };

  const FIL_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function fmtDate(d) {
    if (!d) return '';
    const dt = new Date(d);
    return `${FIL_MONTHS[dt.getUTCMonth()]} ${dt.getUTCDate()}, ${dt.getUTCFullYear()}`;
  }

  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── Subscription status helpers ──
  // Renders the lapsed-Hiraya banner (or the "Renewed!" success flash)
  // above the events grid. Reads ?renewed=1 and ?renew=1 from the URL —
  // the former clears after surfacing the flash, the latter auto-starts
  // a Hiraya renewal checkout (used by the reminder-email CTA so the
  // user doesn't have to find the renew button themselves).
  function renderSubStatus(user) {
    const slot = document.getElementById('sub-status');
    if (!slot) return;

    const params = new URLSearchParams(location.search);
    if (params.get('renewed') === '1') {
      slot.innerHTML = `<div class="renewed-flash">Renewed! Your Hiraya year starts now. 🎉</div>`;
      // Strip the query so a refresh doesn't re-flash.
      history.replaceState({}, '', location.pathname);
      setTimeout(() => { slot.innerHTML = ''; }, 6000);
      return;
    }

    const isHiraya  = user?.subscription_tier === 'hiraya';
    const expiresAt = user?.subscription_expires_at;
    const lapsed    = isHiraya && expiresAt && new Date(expiresAt) < new Date();
    if (!lapsed) return;

    const daysAgo = Math.floor((Date.now() - new Date(expiresAt).getTime()) / 86_400_000);
    slot.innerHTML = `
      <div class="lapsed-banner">
        <div class="lapsed-banner-copy">
          <div class="lapsed-banner-title">Hiraya expired ${daysAgo === 0 ? 'today' : daysAgo + ' day' + (daysAgo === 1 ? '' : 's') + ' ago'}</div>
          <div class="lapsed-banner-sub">Your existing events are unaffected — galleries stay open. Renew to create new Hiraya events again.</div>
        </div>
        <button type="button" class="lapsed-banner-cta" data-renew-hiraya>Renew — ₱9,990</button>
      </div>
    `;
    slot.querySelector('[data-renew-hiraya]').addEventListener('click', startRenewCheckout);
  }

  async function startRenewCheckout(evt) {
    const btn = evt?.currentTarget;
    if (btn) {
      // Stash original label so a BFCache restore (back-from-PayMongo)
      // can put the button back to a clickable state.
      if (!btn.dataset.originalText) btn.dataset.originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Opening checkout…';
      btn.dataset.checkoutLoading = '1';
    }
    try {
      const res = await fetch('/api/payments/create', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ tier: 'hiraya', success_path: 'renew' }),
      });
      const data = await res.json();
      if (!res.ok || !data.checkout_url) {
        throw new Error(data.message || 'Could not start renewal checkout.');
      }
      location.href = data.checkout_url;
    } catch (err) {
      if (btn) {
        btn.disabled = false;
        btn.textContent = btn.dataset.originalText || 'Renew — ₱9,990';
        delete btn.dataset.checkoutLoading;
      }
      alert(err.message);
    }
  }

  // BFCache restore: if the user opened PayMongo then hit Back, unfreeze
  // any checkout button we locked on the way out.
  window.addEventListener('pageshow', (e) => {
    if (!e.persisted) return;
    document.querySelectorAll('button[data-checkout-loading]').forEach((b) => {
      b.disabled = false;
      if (b.dataset.originalText) b.textContent = b.dataset.originalText;
      delete b.dataset.checkoutLoading;
    });
  });

  // ?renew=1 deep link (from reminder emails): auto-fire the checkout
  // once the page is authed. Strip the query first so a back-navigation
  // doesn't re-trigger.
  function maybeAutoRenew() {
    const params = new URLSearchParams(location.search);
    if (params.get('renew') !== '1') return;
    history.replaceState({}, '', location.pathname);
    // No event arg — startRenewCheckout handles a null button gracefully.
    startRenewCheckout();
  }

  async function load() {
    try {
      const res  = await fetch('/api/auth/me', { headers: authHeaders() });
      if (res.status === 401) { logout(); return; }
      const { user: u, events } = await res.json();

      renderSubStatus(u);
      maybeAutoRenew();

      document.getElementById('page-sub').textContent =
        `${events.length} event${events.length !== 1 ? 's' : ''} · ${u.email}`;

      document.getElementById('loading').style.display = 'none';
      const container = document.getElementById('events-container');
      container.style.display = 'block';

      if (!events.length) {
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🎉</div>
            <h2>No events yet</h2>
            <p>Create your first event and start collecting<br>photos and videos from your guests.</p>
            <a class="btn btn-accent" href="/start">+ Create Event</a>
          </div>`;
        return;
      }

      container.innerHTML = `<div class="events-grid">${events.map(ev => {
        // Free tiers don't have a payment to be "pending" on — only
        // paid tiers (sinag/dalisay/hiraya, plus legacy aliases) can
        // sit in the pending state if checkout never completed.
        const PAID_PLANS = new Set(['sinag','dalisay','hiraya','selebrasyon','pro']);
        const isPending = PAID_PLANS.has(ev.plan) && !ev.is_paid;
        const [badgeClass, badgeText] = PLAN_LABELS[ev.plan] || PLAN_LABELS.tala;
        const typeLabel = TYPE_MAP[ev.event_type] || ev.event_type;
        const dateStr   = fmtDate(ev.event_date);
        const badgeHtml = isPending
          ? `<span class="ec-badge badge-pending" title="Awaiting payment"><span class="badge-dot"></span>${badgeText} · Pending</span>`
          : `<span class="ec-badge ${badgeClass}">${badgeText}</span>`;
        return `
          <div class="event-card">
            <div class="ec-top">
              <div class="ec-names">${esc(ev.couple_names)}</div>
              ${badgeHtml}
            </div>
            <div class="ec-meta">
              <span class="ec-type">${typeLabel}</span>
              ${dateStr ? `<span>${dateStr}</span>` : ''}
            </div>
            <div class="ec-actions">
              <a class="ec-link ec-link-primary" href="/dashboard?slug=${esc(ev.slug)}">Dashboard</a>
              <a class="ec-link ec-link-ghost" href="/wall/${esc(ev.slug)}" target="_blank">Live Wall</a>
            </div>
          </div>`;
      }).join('')}</div>`;
    } catch {
      document.getElementById('loading').innerHTML = '<p style="color:var(--ink-faint)">Failed to load events.</p>';
    }
  }

  load();
</script>
</body>
</html>
