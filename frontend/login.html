<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbf5ec" />
  <title>Reelday — Login</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=5" />
  <link rel="shortcut icon" href="/favicon.ico?v=5" />
  <link rel="stylesheet" href="/css/shared.css" />
  <style>
    body { min-height: 100dvh; display: flex; flex-direction: column; }

    .page-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }

    .auth-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-card);
      padding: clamp(1.75rem, 5vw, 2.5rem);
      width: 100%; max-width: 420px;
    }

    .auth-brand {
      display: block; text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-family: var(--display);
      font-size: 1.7rem;
      text-align: center;
      margin-bottom: .4rem;
      color: var(--ink);
    }

    .sub { text-align: center; color: var(--ink-soft); font-size: .9rem; margin-bottom: 2rem; }

    .field { margin-bottom: 1.1rem; }

    label {
      display: block; font-size: .82rem; font-weight: 600;
      color: var(--ink-soft); margin-bottom: .4rem;
    }

    input {
      width: 100%; padding: .75rem 1rem;
      background: #fff;
      border: 1.5px solid var(--line-2);
      border-radius: var(--r);
      color: var(--ink); font-family: inherit; font-size: .95rem;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196,90,58,.12);
    }

    .forgot {
      display: block; text-align: right; font-size: .8rem;
      color: var(--ink-faint); text-decoration: none; margin-top: .3rem;
    }
    .forgot:hover { color: var(--accent); }

    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 2.75rem; }
    .pw-toggle {
      position: absolute; top: 50%; right: .55rem;
      transform: translateY(-50%);
      width: 36px; height: 36px; border: 0; background: transparent;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--ink-faint); cursor: pointer; border-radius: 8px;
      transition: color .15s, background .15s;
    }
    .pw-toggle:hover { color: var(--ink); background: rgba(0,0,0,.04); }
    .pw-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .pw-toggle svg { width: 20px; height: 20px; }

    .btn-submit {
      width: 100%; margin-top: .5rem;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      min-height: 50px;
    }

    .error-msg {
      background: rgba(196,90,58,.08);
      border: 1px solid rgba(196,90,58,.25);
      color: var(--accent-deep);
      border-radius: var(--r);
      padding: .65rem .9rem;
      font-size: .85rem;
      margin-top: .75rem;
      display: none;
    }

    .divider {
      text-align: center; color: var(--ink-faint);
      margin: 1.25rem 0; font-size: .85rem;
      position: relative;
    }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%;
      width: 42%; height: 1px; background: var(--line);
    }
    .divider::before { left: 0; } .divider::after { right: 0; }

    #google-btn { display: flex; justify-content: center; margin-bottom: .5rem; }

    .signup-link { text-align: center; font-size: .88rem; color: var(--ink-soft); }
    .signup-link a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .signup-link a:hover { text-decoration: underline; }

    .inline-spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="page-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <a class="brand brand-lockup" href="/" aria-label="Reelday.ph — home"><img src="/images/LOGO.png?v=2" alt="Reelday.ph" class="brand-img" /></a>
    </div>
    <h1>Welcome back</h1>
    <p class="sub">Log in to manage your events</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@email.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false">
            <svg id="pw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <a class="forgot" href="/forgot-password">Forgot password?</a>
      </div>
      <button class="btn btn-accent btn-submit" id="btn-submit" type="submit">
        <div class="inline-spinner" id="spinner"></div>
        <span id="btn-text">Log in</span>
      </button>
      <div class="error-msg" id="error-msg"></div>
    </form>

    <div class="divider">or</div>
    <div id="google-btn"></div>
    <div class="signup-link">Don't have an account? <a href="/register">Sign up free</a></div>
  </div>
</div>

<script type="module">
  import { saveAuth, getToken } from '/js/auth.js';

  // Redirect if already logged in
  if (getToken()) location.href = '/my-events';

  const form    = document.getElementById('login-form');
  const btn     = document.getElementById('btn-submit');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btn-text');
  const errMsg  = document.getElementById('error-msg');

  // Show / hide password toggle
  const pwInput  = document.getElementById('password');
  const pwToggle = document.getElementById('pw-toggle');
  const pwIcon   = document.getElementById('pw-icon');
  const ICON_EYE     = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
  const ICON_EYE_OFF = '<path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-7 0-11-7-11-7a18.4 18.4 0 0 1 5.06-5.94M9.9 4.24A10.5 10.5 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  pwToggle.addEventListener('click', () => {
    const showing = pwInput.type === 'text';
    pwInput.type = showing ? 'password' : 'text';
    pwToggle.setAttribute('aria-pressed', String(!showing));
    pwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    pwIcon.innerHTML = showing ? ICON_EYE : ICON_EYE_OFF;
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errMsg.style.display = 'none';
    btn.disabled  = true;
    spinner.style.display = 'block';
    btnText.textContent   = 'Logging in…';

    try {
      const res = await fetch('/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          email:    document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.message || 'Login failed');

      saveAuth(data.token, data.user);

      location.href = safeNext();
    } catch (err) {
      errMsg.textContent   = err.message;
      errMsg.style.display = 'block';
      btn.disabled         = false;
      spinner.style.display = 'none';
      btnText.textContent  = 'Log in';
    }
  });

  // Open-redirect guard. Without this, ?next=https://evil.com would
  // happily send a freshly-authenticated user to an attacker page that
  // mimics the reelday dashboard — classic phishing helper. Accept only
  // same-origin paths: must start with a single "/" (rejects protocol-
  // relative "//evil.com") and contain no scheme. Anything else falls
  // back to the default landing.
  function safeNext() {
    const raw = new URLSearchParams(location.search).get('next') || '';
    if (raw.startsWith('/') && !raw.startsWith('//') && !/^\/[^/]*:/.test(raw)) {
      return raw;
    }
    return '/my-events';
  }

  // ── Google Sign-In ────────────────────────────────────
  async function handleGoogleCredential(response) {
    try {
      const res  = await fetch('/api/auth/google', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ credential: response.credential }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Google sign-in failed');
      saveAuth(data.token, data.user);
      location.href = safeNext();
    } catch (err) {
      errMsg.textContent   = err.message;
      errMsg.style.display = 'block';
    }
  }

  const { google_client_id } = await fetch('/api/auth/config').then(r => r.json()).catch(() => ({}));
  if (google_client_id) {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = () => {
      google.accounts.id.initialize({ client_id: google_client_id, callback: handleGoogleCredential });
      google.accounts.id.renderButton(document.getElementById('google-btn'), {
        theme: 'outline', size: 'large', width: 352, text: 'continue_with', shape: 'rectangular',
      });
    };
    document.head.appendChild(s);
  }
</script>
</body>
</html>
