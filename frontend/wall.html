<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a0f0a" />
  <title>Reelday Live Wall</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
  <link rel="shortcut icon" href="/favicon.ico?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --mono: 'JetBrains Mono', 'DM Mono', monospace;
      --display: 'Fraunces', 'Playfair Display', Georgia, serif;
      --gold: #f0a37a;
      --ink: #2a1a14;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #1a0f0a; color: #fff;
    }

    /* ── Photo layers (Ken Burns) ──────────────────────────── */
    .layer {
      position: fixed; inset: 0;
      transition: opacity 1.6s ease;
      pointer-events: none;
      z-index: 1;
    }
    .layer.out { opacity: 0; }

    /* Blurred backdrop — fills letterbox area with a soft, scaled copy */
    .layer .backdrop {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      filter: blur(40px) brightness(.55) saturate(1.2);
      transform: scale(1.15);
    }

    /* Foreground photo — full image visible, no cropping */
    .layer .pic {
      position: absolute; inset: 0;
      background-size: contain; background-position: center;
      background-repeat: no-repeat;
      will-change: transform;
      image-rendering: -webkit-optimize-contrast;
    }

    /* Foreground video — same fitting as the photo layer */
    .layer .vid {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
    }
    .layer.has-video .pic { display: none; }
    .layer.has-video .vid { display: block; }

    /* Ken Burns — very gentle, mostly pan; the image stays fully visible */
    @keyframes kb1 {
      from { transform: scale(1)    translate(0, 0); }
      to   { transform: scale(1.02) translate(-0.5%, -0.4%); }
    }
    @keyframes kb2 {
      from { transform: scale(1)    translate(-0.4%, 0); }
      to   { transform: scale(1.02) translate(0.4%, 0.5%); }
    }
    @keyframes kb3 {
      from { transform: scale(1.01) translate(0.5%, 0.5%); }
      to   { transform: scale(1.03) translate(-0.5%, -0.5%); }
    }
    @keyframes kb4 {
      from { transform: scale(1)    translate(0.4%, -0.4%); }
      to   { transform: scale(1.02) translate(-0.5%, 0.5%); }
    }

    .layer .vignette {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.55) 100%),
        linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 25%, transparent 55%, rgba(0,0,0,.75) 100%);
    }

    /* ── Top ticker ─────────────────────────────────────────── */
    .ticker {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      height: 60px;
      background: linear-gradient(180deg, rgba(0,0,0,.65), transparent);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 36px;
    }

    .ticker .live {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--mono); font-size: 12px;
      letter-spacing: .2em; text-transform: uppercase;
    }

    .ticker .live .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--gold); box-shadow: 0 0 0 4px rgba(240,163,122,.3);
      animation: pulse 1.5s ease infinite; flex-shrink: 0;
    }

    @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(240,163,122,0); } }

    .ticker .stats {
      font-family: var(--mono); font-size: 12px;
      letter-spacing: .16em; text-transform: uppercase;
      opacity: .85; display: flex; gap: 28px;
    }

    .ticker .stats em { color: var(--gold); font-style: normal; font-weight: 600; }

    /* ── QR badge ────────────────────────────────────────────── */
    .qr-badge {
      position: fixed; top: 76px; right: 32px; z-index: 10;
      background: rgba(255,255,255,.96); color: var(--ink);
      border-radius: 14px; padding: 14px;
      display: none; gap: 12px; align-items: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      transition: opacity .4s ease;
    }

    .qr-badge .qr {
      width: 60px; height: 60px; flex-shrink: 0;
      border-radius: 6px; overflow: hidden;
      background: repeating-conic-gradient(var(--ink) 0% 25%, #fff 0% 50%) 0 0 / 8px 8px;
    }

    .qr-badge .qr img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .qr-badge .text {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: .12em; text-transform: uppercase; color: var(--ink);
    }

    .qr-badge .text b {
      font-family: var(--display); font-style: italic;
      font-size: 14px; font-weight: 500;
      text-transform: none; letter-spacing: 0;
      display: block; margin-bottom: 2px; color: var(--ink);
    }

    /* ── Upcoming thumbnails ────────────────────────────────── */
    .upcoming {
      position: fixed; right: 36px; top: 50%; transform: translateY(-50%);
      z-index: 10; display: flex; flex-direction: column; gap: 8px;
    }

    .upcoming-thumb {
      width: 76px; aspect-ratio: 1; border-radius: 10px;
      border: 2px solid rgba(255,255,255,.2);
      overflow: hidden; background-size: cover; background-position: center;
      cursor: pointer; transition: border-color .25s, transform .25s;
      flex-shrink: 0;
    }

    .upcoming-thumb:hover { transform: scale(1.06); }

    .upcoming-thumb.next {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(240,163,122,.25);
    }

    /* ── Caption frame ──────────────────────────────────────── */
    .frame {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      padding: 0 64px 56px;
      display: none; justify-content: space-between; align-items: flex-end; gap: 32px;
      pointer-events: none;
    }

    .caption { flex: 1 1 auto; min-width: 0; max-width: none; padding-right: 24px; }

    .caption .uploader {
      font-family: var(--mono); font-size: clamp(16px, 1.4vw, 22px);
      font-weight: 600;
      letter-spacing: .22em; text-transform: uppercase;
      color: #fff; margin-bottom: 22px;
      text-shadow: 0 4px 24px rgba(0,0,0,.55);
      transition: opacity .5s ease;
    }

    .caption blockquote {
      font-family: var(--display); font-style: italic; font-weight: 400;
      font-size: clamp(40px, 5vw, 72px); line-height: 1.25;
      letter-spacing: -.02em;
      text-shadow: 0 4px 24px rgba(0,0,0,.55);
      margin: 0; padding-bottom: .15em;
      transition: opacity .5s ease;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .caption.fade .uploader,
    .caption.fade blockquote { opacity: 0; }

    .corner {
      text-align: right; font-family: var(--mono); font-size: 11px;
      letter-spacing: .2em; text-transform: uppercase;
      color: rgba(255,255,255,.6); flex-shrink: 0;
    }

    .corner .names {
      font-family: var(--display); font-style: italic; font-weight: 400;
      font-size: clamp(36px, 3.2vw, 56px); color: #fff; text-transform: none;
      letter-spacing: -.015em; margin-bottom: 8px; line-height: 1;
    }

    .corner .names em { color: var(--gold); font-style: normal; }

    /* ── Progress bar ───────────────────────────────────────── */
    .slide-progress {
      position: fixed; bottom: 0; left: 0; right: 0; height: 3px; z-index: 20;
      background: rgba(255,255,255,.1); pointer-events: none;
    }

    .slide-progress .fill {
      height: 100%; background: rgba(240,163,122,.8); width: 0;
    }

    /* ── Bottom-right control cluster (sound + fullscreen) ────── */
    .controls-tray {
      position: fixed; bottom: 18px; right: 18px; z-index: 25;
      display: flex; align-items: center; gap: 10px;
      opacity: 0; transition: opacity .3s;
    }
    body:hover .controls-tray,
    .controls-tray:focus-within,
    .controls-tray.always-visible { opacity: 1; }

    .fs-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(0,0,0,.55); color: #fff;
      border: 1px solid rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .2s, transform .2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .fs-btn:hover { background: rgba(0,0,0,.78); transform: scale(1.08); }
    .fs-btn svg { width: 20px; height: 20px; }

    /* ── Pause overlay ──────────────────────────────────────── */
    .pause-btn {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 15; opacity: 0; pointer-events: none;
      font-family: var(--mono); font-size: 13px; letter-spacing: .3em;
      text-transform: uppercase; background: rgba(0,0,0,.5); border-radius: 999px;
      padding: 14px 28px; transition: opacity .3s ease;
      backdrop-filter: blur(8px); white-space: nowrap;
    }

    .pause-btn.visible { opacity: 1; pointer-events: auto; }

    /* ── Unmute toggle (only shows while a video slide is on screen) ──
       Lives in the .controls-tray so it sits next to fullscreen. When
       a video starts playing muted, the button pulses in the accent
       colour to draw the eye. */
    .sound-btn {
      display: none;
      align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .18em;
      text-transform: uppercase;
      background: rgba(0,0,0,.55); color: #fff;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      padding: 11px 18px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      transition: background .15s, transform .15s, box-shadow .25s;
    }
    .sound-btn:hover { background: rgba(0,0,0,.75); transform: translateY(-1px); }
    .sound-btn.visible { display: inline-flex; }
    .sound-btn .icon { font-size: 16px; }
    /* Loud-button state: when a video is playing AND we're still muted,
       pulse to make the unmute action obvious — guests miss the small
       icon otherwise. Drops the moment the user taps it. */
    .sound-btn.attention {
      background: var(--accent, #c45a3a);
      border-color: rgba(255,255,255,.35);
      animation: soundPulse 1.6s ease-in-out infinite;
    }
    @keyframes soundPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(196,90,58,.6),  0 4px 12px rgba(0,0,0,.4); }
      50%      { box-shadow: 0 0 0 10px rgba(196,90,58,0), 0 4px 16px rgba(0,0,0,.5); }
    }

    /* ── Live poll overlay ──────────────────────────────────
       Full-screen takeover that pauses the photo slideshow when the
       host runs a poll. Slideshow + emoji + caption all stay alive
       behind it, just hidden by .poll-active on the body. */
    .poll-overlay {
      position: fixed; inset: 0; z-index: 30;
      background:
        radial-gradient(circle at 30% 20%, rgba(196,90,58,.22), transparent 60%),
        linear-gradient(180deg, rgba(15,7,3,.92), rgba(15,7,3,.96));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 6vh 6vw;
      color: #fff;
      animation: pollIn .55s cubic-bezier(.2,.8,.2,1);
    }
    .poll-overlay.visible { display: flex; }
    .poll-overlay.ending  { animation: pollOut .5s ease both; }
    @keyframes pollIn  { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes pollOut { to   { opacity: 0; transform: scale(1.04); } }

    .poll-overlay .poll-tag {
      font-family: var(--mono); font-size: clamp(11px, 1vw, 14px);
      letter-spacing: .32em; text-transform: uppercase;
      color: var(--accent-soft);
      margin-bottom: 24px;
      display: flex; align-items: center; gap: 14px;
    }
    .poll-overlay .poll-tag .ring {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(196,90,58,.5);
      animation: pollRing 1.6s ease infinite;
    }
    @keyframes pollRing { 50% { box-shadow: 0 0 0 14px rgba(196,90,58,0); } }

    .poll-overlay h1 {
      font-family: var(--display); font-style: italic; font-weight: 500;
      font-size: clamp(56px, 8.5vw, 140px); line-height: 1.1;
      text-align: center; max-width: 18ch;
      text-shadow: 0 8px 30px rgba(0,0,0,.6);
      margin-bottom: 48px;
    }

    .poll-overlay .poll-bars {
      display: flex; flex-direction: column; gap: 18px;
      width: min(1200px, 94vw);
    }
    .poll-overlay .poll-bar {
      position: relative; overflow: hidden;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      padding: 28px 36px;
      font-size: clamp(34px, 4.2vw, 72px);
      font-weight: 500;
      backdrop-filter: blur(6px);
    }
    .poll-overlay .poll-bar .fill {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      transition: width .8s cubic-bezier(.2,.8,.2,1);
      z-index: 0;
    }
    .poll-overlay .poll-bar .row {
      position: relative; z-index: 1;
      display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
    }
    .poll-overlay .poll-bar .label { letter-spacing: .01em; }
    .poll-overlay .poll-bar .stats {
      font-family: var(--mono); font-size: clamp(28px, 3vw, 56px); font-weight: 700;
      letter-spacing: .08em; opacity: .95; font-variant-numeric: tabular-nums;
    }
    .poll-overlay .poll-bar.leader .fill { background: linear-gradient(90deg, var(--gold), #f5d089); }
    .poll-overlay .poll-bar.leader { border-color: rgba(216,160,90,.55); box-shadow: 0 0 0 2px rgba(216,160,90,.25); }

    /* While voting: hide percentages + bar fills so guests can't peek
       at the running tally — only the option labels are visible. */
    .poll-overlay.live-state .poll-bar .stats,
    .poll-overlay.live-state .poll-bar .fill { display: none; }

    /* Final-results state: bigger labels, prominent stats. */
    .poll-overlay.results-state .poll-bar { padding: 32px 40px; }

    .poll-overlay .poll-fastest {
      margin-top: 32px; padding: 18px 32px;
      border-radius: 20px;
      background: rgba(216,160,90,.14);
      border: 1px solid rgba(216,160,90,.45);
      font-family: var(--display); font-style: italic;
      font-size: clamp(28px, 3.4vw, 56px); font-weight: 500;
      color: #f5d089; text-align: center;
      width: min(1200px, 94vw);
    }
    .poll-overlay .poll-fastest b { color: #fff; font-style: normal; font-weight: 600; }
    .poll-overlay .poll-fastest .secs {
      font-family: var(--mono); font-size: .7em; letter-spacing: .08em;
      opacity: .85; margin-left: 12px;
    }

    .poll-overlay .poll-foot {
      margin-top: 40px;
      font-family: var(--mono); font-size: clamp(20px, 2.2vw, 36px);
      letter-spacing: .26em; text-transform: uppercase;
      opacity: .9; font-weight: 700;
    }
    .poll-overlay .poll-countdown {
      color: var(--gold);
      font-size: clamp(36px, 4vw, 72px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin-left: 10px;
    }
    body.poll-active .frame,
    body.poll-active .ticker .stats,
    body.poll-active .upcoming { opacity: 0; transition: opacity .4s ease; }

    /* ── Burst (now playing video message) banner ──────────── */
    .burst-banner {
      position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
      z-index: 14;
      display: none; align-items: center; gap: 14px;
      background: linear-gradient(90deg, rgba(0,0,0,.65), rgba(60,30,18,.65));
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(10px);
      padding: 12px 22px;
      border-radius: 999px;
      color: #fff;
      font-family: var(--mono); font-size: 11px; letter-spacing: .22em;
      text-transform: uppercase;
      animation: bbDrop .35s cubic-bezier(.2,.8,.2,1.05) both;
    }
    .burst-banner.visible { display: inline-flex; }
    .burst-banner .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ff5757; box-shadow: 0 0 0 4px rgba(255,87,87,.3);
      animation: pulse 1.2s ease infinite;
    }
    .burst-banner .from {
      font-family: var(--display); font-style: italic;
      letter-spacing: -.01em; text-transform: none;
      font-size: 16px;
      color: rgba(255,255,255,.95);
    }
    @keyframes bbDrop {
      from { opacity: 0; transform: translate(-50%, -16px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    /* ── Floating emojis ────────────────────────────────────── */
    #emoji-container {
      position: fixed; inset: 0; z-index: 60;
      pointer-events: none; overflow: hidden;
    }

    .float-emoji {
      position: absolute; bottom: 0; line-height: 1;
      animation: floatUp linear forwards;
      pointer-events: none; user-select: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0)     scale(1);   opacity: 1; }
      70%  { opacity: 1; }
      100% { transform: translateY(-95vh) scale(1.6); opacity: 0; }
    }

    /* ── Upload toast ───────────────────────────────────────── */
    .upload-toast {
      position: fixed; bottom: 4rem; left: 50%; transform: translateX(-50%) translateY(8px);
      background: rgba(10,10,10,.9); border: 1px solid rgba(240,163,122,.4);
      color: #fff; padding: .9rem 1.6rem; border-radius: 999px;
      font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      z-index: 200; opacity: 0; transition: opacity .4s, transform .4s;
      pointer-events: none; white-space: nowrap;
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
    }

    .upload-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Keyboard hint ──────────────────────────────────────── */
    .kb-hint {
      position: fixed; bottom: 1rem; left: 1.5rem;
      font-family: var(--mono); font-size: .6rem;
      color: rgba(255,255,255,.25); letter-spacing: .1em;
      z-index: 200; pointer-events: none;
      opacity: 0; transition: opacity .3s;
    }

    body:hover .kb-hint { opacity: 1; }

    /* ── Empty state ────────────────────────────────────────── */
    .empty-state {
      display: none; position: fixed; inset: 0; z-index: 2;
      background: linear-gradient(135deg, #3d1f2d 0%, #5c3048 50%, #c45a3a 100%);
      background-size: 400% 400%; animation: gradShift 8s ease infinite;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }

    .empty-state.visible { display: flex; }

    @keyframes gradShift {
      0%   { background-position: 0%   50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0%   50%; }
    }

    .empty-event-name {
      font-family: var(--display); font-style: italic;
      font-size: clamp(2.5rem, 7vw, 5rem); font-weight: 400;
      margin-bottom: 1rem; text-shadow: 0 4px 20px rgba(0,0,0,.4);
    }

    .empty-tagline {
      font-family: var(--mono); font-size: clamp(.85rem, 2vw, 1.1rem);
      letter-spacing: .1em; text-transform: uppercase;
      opacity: .8; margin-bottom: 2.5rem;
    }

    .empty-qr-wrap {
      background: #fff; border-radius: 20px; padding: 1.25rem;
      margin-bottom: 1.5rem; box-shadow: 0 8px 40px rgba(0,0,0,.3);
      position: relative;
    }

    .empty-qr-wrap::before {
      content: ''; position: absolute; inset: -12px;
      border-radius: 28px; border: 2px solid rgba(255,255,255,.3);
      animation: ringPulse 2.5s ease-in-out infinite;
    }

    @keyframes ringPulse {
      0%,100% { opacity: .3; transform: scale(1); }
      50%     { opacity: .7; transform: scale(1.03); }
    }

    #empty-qr {
      display: block;
      width: clamp(160px, 20vw, 240px); height: clamp(160px, 20vw, 240px);
      border-radius: 10px;
    }

    .empty-scan-label {
      font-family: var(--mono); font-size: clamp(.85rem, 2vw, 1rem);
      letter-spacing: .1em; text-transform: uppercase; opacity: .9;
    }

    /* ── Portrait phone fallback ──────────────────────────────
       The wall is built for landscape TVs. On a portrait phone the
       upcoming-thumbnails column was eating half the screen, the
       caption blockquote ended up squeezed into a 100px column and
       wrapped to one character per line, and the ticker overlapped
       the QR badge. Hide the chrome that doesn't fit and reflow the
       caption to use the full width. */
    @media (max-width: 640px) and (orientation: portrait) {
      .upcoming { display: none; }
      .ticker {
        height: 48px;
        padding: 0 16px;
      }
      .ticker .stats { gap: 14px; font-size: 10px; letter-spacing: .1em; }
      .ticker .live { font-size: 10px; letter-spacing: .14em; }
      .qr-badge {
        right: 14px !important;
        max-width: calc(100vw - 28px);
        padding: 10px 12px;
      }
      .qr-badge .qr { width: 48px; height: 48px; }
      .qr-badge .text { font-size: 9px; }
      .qr-badge .text b { font-size: 12px; }

      .frame {
        padding: 0 18px 24px;
        gap: 12px;
        flex-direction: column;
        align-items: stretch;
      }
      .caption { padding-right: 0; }
      .caption .uploader {
        font-size: 12px !important;
        letter-spacing: .18em;
        margin-bottom: 10px;
      }
      .caption blockquote {
        font-size: clamp(20px, 6vw, 28px) !important;
        line-height: 1.25;
        -webkit-line-clamp: 4;
      }

      /* Bottom-right tray sits low enough that on a portrait phone it
         covered the caption text. Lift it just above the caption. */
      .controls-tray {
        bottom: auto !important;
        top: 64px !important;
        right: 14px !important;
      }
    }
  </style>
</head>

<script type="module">
  /* ══════════════════════════════════════════════════════════
     iOS bfcache / app-switch recovery
     The wall is often left running on a phone propped against a TV.
     iOS pauses JS aggressively when the screen sleeps or the user
     app-switches; the slideshow timers stop and the wall freezes.
     Force a fresh boot whenever the page is restored from bfcache,
     or when it becomes visible after >2 minutes hidden.
  ══════════════════════════════════════════════════════════ */
  window.addEventListener('pageshow', (ev) => {
    if (ev.persisted) location.reload();
  });
  let __wallHiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      __wallHiddenAt = Date.now();
    } else if (document.visibilityState === 'visible' && __wallHiddenAt) {
      const away = Date.now() - __wallHiddenAt;
      __wallHiddenAt = 0;
      if (away > 2 * 60 * 1000) location.reload();
    }
  });

  /* ══════════════════════════════════════════════════════════
     CONFIG
  ══════════════════════════════════════════════════════════ */
  const SLIDE_DURATION   = 8000;  // ms per slide
  const FADE_DURATION    = 1600;  // ms for crossfade (matches CSS 1.6s)
  const KB_DURATION      = 14;    // seconds for Ken Burns
  const KB_ANIMS         = ['kb1', 'kb2', 'kb3', 'kb4'];
  const POLL_INTERVAL    = 2000;  // ms between upload polls — short so host approvals jump to the wall fast
  const QR_HIDE_AFTER    = 20000; // ms before QR badge auto-hides

  const THEME_META = {
    wedding:          { emoji: ['💗','🎉','✨','🥂','💍','🌸','💒'], cornerSuffix: '' },
    debut:            { emoji: ['👑','💗','✨','🌹','💃','🎀','⭐'], cornerSuffix: '' },
    birthday:         { emoji: ['🎂','🎉','🎊','🎈','✨','💫','🥳'], cornerSuffix: '' },
    seventh_birthday: { emoji: ['🌟','🎊','🎈','⭐','✨','🎉','🎀'], cornerSuffix: '' },
    baptism:          { emoji: ['🕊️','✨','💙','🌊','🙏','🌿','🤍'], cornerSuffix: '' },
    reunion:          { emoji: ['🎉','🥂','💗','✨','🎊','🤗','🍻'], cornerSuffix: '' },
    corporate:        { emoji: ['👏','✨','🎉','⭐','🏆','💼','🎯'], cornerSuffix: '' },
    memorial:         { emoji: ['🕯️','🌹','💙','✨','🙏','🍃','🌿'], cornerSuffix: '' },
  };

  /* ══════════════════════════════════════════════════════════
     STATE
  ══════════════════════════════════════════════════════════ */
  const slug = (() => {
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts[0] === 'wall' && parts[1]) return parts[1];
    return new URLSearchParams(location.search).get('slug') || parts.pop() || null;
  })();

  /* Read uploads saved by upload.html into localStorage (same-origin) */
  function readLocalUploads() {
    if (!slug) return [];
    try {
      const raw = JSON.parse(localStorage.getItem(`reelday_uploads_${slug}`) || '[]');
      return raw.map(u => ({
        id:             u.id,
        uploader_name:  u.uploader_name,
        message:        u.message,
        // Wall uses file_url; fall back to thumb data URL
        file_url:       u.file_url || u.thumb || null,
        file_type:      u.file_type || 'photo',
        is_video_message: u.is_video_message || false,
        is_approved:    u.status !== 'hidden',
        created_at:     u.created_at || u.timestamp || null,
      })).filter(u => u.file_url); // skip entries that haven't finished compressing
    } catch { return []; }
  }

  function mergeUploads(apiUploads) {
    // The wall must reflect the host's approval decisions. The backend
    // already filters out is_approved=false rows, so we trust that list as
    // the source of truth. We do NOT merge in localStorage entries here:
    // those are written by upload.html on the same browser and would
    // otherwise bypass the host's auto-approve setting.
    return apiUploads;
  }

  // Wrap an R2 image URL with Cloudflare's free /cdn-cgi/image/ transform
  // so the wall pulls a 1920px JPEG/AVIF/WebP instead of a 10MB original.
  // Videos and data: URLs (local-only previews) are returned untouched.
  function cdnImage(url, width) {
    if (!url) return url;
    if (url.startsWith('data:') || url.startsWith('blob:')) return url;
    if (/\.(mp4|webm|mov|m4v|ogg)(\?|$)/i.test(url)) return url;
    try {
      const u = new URL(url, location.href);
      // Only apply to URLs we control (the R2 public host). Falling back to
      // the raw URL keeps demo/external assets working.
      if (!/(^|\.)reelday\.ph$/.test(u.hostname)) return url;
      // Already wrapped? Don't double-wrap.
      if (u.pathname.startsWith('/cdn-cgi/image/')) return url;
      const opts = `width=${width},quality=82,format=auto,fit=scale-down`;
      return `${u.origin}/cdn-cgi/image/${opts}${u.pathname}${u.search}`;
    } catch {
      return url;
    }
  }

  function wallMediaUrl(upload) {
    if (!upload) return null;
    if (isVideoItem(upload)) {
      // Prefer the server-transcoded 720p MP4 with faststart when ready.
      // Falls back to the original until the background ffmpeg job lands.
      return upload.web_url || upload.file_url || upload.thumb || null;
    }
    const raw = upload.file_url || upload.thumb || null;
    if (!raw) return null;
    // 1920 covers any reasonable TV; format=auto picks AVIF/WebP per browser.
    return cdnImage(raw, 1920);
  }

  let items      = [];
  let allUploads = [];
  let knownIds   = new Set();
  let currentIdx = 0;
  let activeLayer = 'A';   // 'A' or 'B'
  let isPaused   = false;
  let isRunning  = false;
  let slideTimer = null;
  let qrTimer    = null;
  let eventData  = null;
  let themeMeta  = THEME_META.wedding;

  /* ══════════════════════════════════════════════════════════
     DOM REFS
  ══════════════════════════════════════════════════════════ */
  const layerA      = document.getElementById('layer-a');
  const layerB      = document.getElementById('layer-b');
  const picA        = document.getElementById('pic-a');
  const picB        = document.getElementById('pic-b');
  const backdropA   = document.getElementById('backdrop-a');
  const backdropB   = document.getElementById('backdrop-b');
  const vidA        = document.getElementById('vid-a');
  const vidB        = document.getElementById('vid-b');
  const soundBtn    = document.getElementById('sound-btn');
  const soundIcon   = document.getElementById('sound-icon');
  const soundLabel  = document.getElementById('sound-label');

  // Persist sound choice per browser so the host doesn't have to retap each refresh.
  let wallSoundOn = localStorage.getItem('reelday_wall_sound') === 'on';

  function applySoundState() {
    soundIcon.textContent  = wallSoundOn ? '🔊' : '🔇';
    soundLabel.textContent = wallSoundOn ? 'Sound on' : 'Tap for sound';
    [vidA, vidB].forEach(v => { if (v) v.muted = !wallSoundOn; });
    // Sound is on now → drop the attention pulse (no need to nag).
    if (wallSoundOn) soundBtn?.classList.remove('attention');
  }
  applySoundState();

  soundBtn?.addEventListener('click', () => {
    wallSoundOn = !wallSoundOn;
    localStorage.setItem('reelday_wall_sound', wallSoundOn ? 'on' : 'off');
    applySoundState();
    // Nudge the active video so the audio actually starts/stops immediately.
    const activeVid = activeLayer === 'A' ? vidA : vidB;
    if (activeVid && items.__currentIsVideo) {
      try { activeVid.play(); } catch {}
    }
  });

  function isVideoItem(u) {
    if (u?.file_type === 'video') return true;
    if (typeof u?.file_url === 'string' && /\.(mp4|webm|mov|m4v|ogg)$/i.test(u.file_url)) return true;
    return false;
  }
  const frame       = document.getElementById('frame');
  const caption     = document.getElementById('caption');
  const capUploader = document.getElementById('caption-uploader');
  const capQuote    = document.getElementById('caption-quote');
  const cornerNames = document.getElementById('corner-names');
  const tickerName  = document.getElementById('ticker-name');
  const tickerStats = document.getElementById('ticker-stats');
  const qrBadge     = document.getElementById('qr-badge');
  const qrImgWrap   = document.getElementById('qr-img-wrap');
  const qrUrlEl     = document.getElementById('qr-url');
  const upcomingCol = document.getElementById('upcoming-col');
  const progressFill= document.getElementById('progress-fill');
  const pauseBtn    = document.getElementById('pause-btn');
  const uploadToast = document.getElementById('upload-toast');
  const emptyState  = document.getElementById('empty-state');
  const emptyName   = document.getElementById('empty-event-name');
  const emptyQr     = document.getElementById('empty-qr');
  const emojiBox    = document.getElementById('emoji-container');

  /* ══════════════════════════════════════════════════════════
     PROGRESS BAR
  ══════════════════════════════════════════════════════════ */
  function startProgress() {
    progressFill.style.transition = 'none';
    progressFill.style.width = '0%';
    void progressFill.offsetWidth;
    // Match the bar's fill time to whatever the current slide's duration is.
    progressFill.style.transition = `width ${currentSlideDuration()}ms linear`;
    progressFill.style.width = '100%';
  }

  function stopProgress() {
    const computed = getComputedStyle(progressFill).width;
    progressFill.style.transition = 'none';
    progressFill.style.width = computed;
  }

  /* ══════════════════════════════════════════════════════════
     SLIDE ENGINE
  ══════════════════════════════════════════════════════════ */
  function showSlide(idx) {
    if (items.length === 0) return;
    const item  = items[idx % items.length];
    const kbAnim = KB_ANIMS[idx % KB_ANIMS.length];

    // Determine in/out layers
    const inLayer    = activeLayer === 'A' ? layerB : layerA;
    const outLayer   = activeLayer === 'A' ? layerA : layerB;
    const inPic      = activeLayer === 'A' ? picB   : picA;
    const inBackdrop = activeLayer === 'A' ? backdropB : backdropA;
    const inVid      = activeLayer === 'A' ? vidB    : vidA;
    const outVid     = activeLayer === 'A' ? vidA    : vidB;

    // Fully release the outgoing video so the browser can free its decoder
    // and stop streaming bytes for a clip nobody is watching anymore. This
    // is the single biggest contributor to wall lag during video playback.
    if (outVid) {
      try {
        outVid.pause();
        outVid.removeAttribute('src');
        outVid.load();
      } catch {}
    }
    // Make the incoming layer the bandwidth-priority one; the other can
    // stay on metadata-only until it becomes active again.
    if (inVid)  inVid.preload  = 'auto';
    if (outVid) outVid.preload = 'metadata';

    const mediaUrl = wallMediaUrl(item);
    const itemIsVideo = isVideoItem(item) && !!mediaUrl;

    if (itemIsVideo) {
      // Backdrop falls back to a flat dark wash for videos
      inBackdrop.style.backgroundImage = 'none';
      inPic.style.backgroundImage      = 'none';
      inPic.style.animation            = 'none';

      inLayer.classList.add('has-video');

      // Show the server-generated poster (first frame of the clip) on the
      // backdrop while the MP4 streams in. The wall paints something the
      // moment the slide enters instead of a black rectangle for ~1s.
      if (item.poster_url) {
        const posterUrl = cdnImage(item.poster_url, 1280);
        inBackdrop.style.backgroundImage = `url('${posterUrl}')`;
        inVid.setAttribute('poster', posterUrl);
      } else {
        inVid.removeAttribute('poster');
      }

      // Reset and (re)load the source. Always call load() so a fresh stream
      // gets requested — especially important for the proxied
      // /api/uploads/file/:id endpoint that supports Range.
      inVid.muted    = !wallSoundOn;
      inVid.playsInline = true;
      inVid.autoplay = true;
      try { inVid.pause(); } catch {}
      const absoluteUrl = new URL(mediaUrl, location.href).toString();
      if (inVid.src !== absoluteUrl) {
        inVid.src = mediaUrl;
        inVid.load();
      }
      try { inVid.currentTime = 0; } catch {}
      const playPromise = inVid.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(err => {
          // If unmuted autoplay was blocked (no user gesture yet), retry muted
          // so the visuals at least play. The Tap-for-sound button stays visible.
          if (!inVid.muted) {
            console.warn('wall video unmuted autoplay blocked — falling back to muted', err);
            inVid.muted = true;
            inVid.play().catch(e => console.warn('wall video muted play() failed', e));
          } else {
            console.warn('wall video play() failed', err);
          }
        });
      }
    } else {
      inLayer.classList.remove('has-video');
      // Load photo into both layers — pic shows whole image, backdrop fills letterbox
      const url = mediaUrl ? `url('${mediaUrl}')` : 'none';
      inPic.style.backgroundImage      = url;
      inBackdrop.style.backgroundImage = url;

      // Restart Ken Burns animation cleanly
      inPic.style.animation = 'none';
      void inPic.offsetWidth; // force reflow
      inPic.style.animation = `${kbAnim} ${KB_DURATION}s ease-out forwards`;
    }

    // Stash so advance()/goTo() know whether this slide is a video.
    items.__currentIsVideo = itemIsVideo;

    // Show the unmute toggle only when there's a video on screen.
    // Pulse it (the .attention class) whenever the video is muted so
    // guests notice the unmute action — small icon was easy to miss.
    soundBtn?.classList.toggle('visible', itemIsVideo);
    soundBtn?.classList.toggle('attention', itemIsVideo && !wallSoundOn);

    // Crossfade layers
    inLayer.classList.remove('out');
    outLayer.classList.add('out');
    activeLayer = activeLayer === 'A' ? 'B' : 'A';

    // Fade caption out, swap text, fade in
    caption.classList.add('fade');
    setTimeout(() => {
      updateCaption(item);
      caption.classList.remove('fade');
    }, 500);

    // Update upcoming strip
    updateUpcoming(idx);

    // Show frame
    frame.style.display = 'flex';
  }

  // Slide duration policy:
  //   Photos: fixed SLIDE_DURATION.
  //   Videos: timer is REARMED inside scheduleAdvance() once the video's
  //           own metadata loads, so we play the full clip (capped at
  //           MAX_VIDEO_DURATION to defend against runaway streams).
  //           A short bootstrap timer fires only if metadata never arrives.
  const MAX_VIDEO_DURATION = 60000;
  const VIDEO_BOOT_TIMEOUT = 12000; // give the video a chance to load metadata
  function currentSlideDuration() {
    if (!items.__currentIsVideo) return SLIDE_DURATION;
    const activeVid = activeLayer === 'A' ? vidA : vidB;
    const secs = Number.isFinite(activeVid?.duration) ? activeVid.duration : 0;
    if (secs > 0) return Math.min(secs * 1000 + 500, MAX_VIDEO_DURATION);
    return VIDEO_BOOT_TIMEOUT;
  }

  // Schedule the next advance. For videos we wait for `loadedmetadata`
  // before locking in the real duration, and rely on `ended` to actually
  // advance most of the time — the timer is just a safety net.
  function scheduleAdvance() {
    clearTimeout(slideTimer);
    if (isPaused || items.length < 2) return;

    if (!items.__currentIsVideo) {
      slideTimer = setTimeout(advance, SLIDE_DURATION);
      return;
    }

    const activeVid = activeLayer === 'A' ? vidA : vidB;
    if (!activeVid) {
      slideTimer = setTimeout(advance, VIDEO_BOOT_TIMEOUT);
      return;
    }

    const arm = () => {
      clearTimeout(slideTimer);
      const secs = Number.isFinite(activeVid.duration) ? activeVid.duration : 0;
      const ms   = secs > 0
        ? Math.min(secs * 1000 + 500, MAX_VIDEO_DURATION)
        : VIDEO_BOOT_TIMEOUT;
      slideTimer = setTimeout(advance, ms);
    };

    if (Number.isFinite(activeVid.duration) && activeVid.duration > 0) {
      arm();
    } else {
      // Bootstrap timer in case metadata never loads (broken stream).
      slideTimer = setTimeout(advance, VIDEO_BOOT_TIMEOUT);
      activeVid.addEventListener('loadedmetadata', arm, { once: true });
    }
  }

  function advance() {
    if (isPaused || items.length === 0) return;

    const nextIdx = items.length === 1 ? 0 : (currentIdx + 1) % items.length;
    currentIdx = nextIdx;
    showSlide(currentIdx);
    startProgress();
    prewarmNext();
    scheduleAdvance();
  }

  function startSlideshow() {
    if (isRunning || items.length === 0) return;
    isRunning = true;

    currentIdx = 0;
    showSlide(0);
    startProgress();
    emptyState.classList.remove('visible');
    prewarmNext();
    scheduleAdvance();
  }

  function goTo(idx) {
    clearTimeout(slideTimer);
    currentIdx = ((idx % items.length) + items.length) % items.length;
    showSlide(currentIdx);
    startProgress();
    prewarmNext();
    if (!isPaused && items.length > 1) scheduleAdvance();
  }

  // Pre-warm the next slide so the cross-fade is snappy. For photos this
  // gets the bytes into the HTTP cache; for videos we hand it to a hidden
  // <video> with preload="metadata" so the browser opens a Range request
  // early but doesn't fully buffer (avoids fighting the active stream).
  const prewarmImg = new Image();
  const prewarmVid = document.createElement('video');
  prewarmVid.preload = 'metadata';
  prewarmVid.muted = true;
  prewarmVid.playsInline = true;
  function prewarmNext() {
    if (items.length < 2) return;
    const next = items[(currentIdx + 1) % items.length];
    const url  = wallMediaUrl(next);
    if (!url) return;
    if (isVideoItem(next)) {
      try {
        if (prewarmVid.src !== new URL(url, location.href).toString()) {
          prewarmVid.src = url;
          // load() kicks off the Range request without committing to full buffer
          prewarmVid.load();
        }
      } catch { /* ignore */ }
    } else {
      try { prewarmImg.src = url; } catch { /* ignore */ }
    }
  }

  // When a video finishes naturally, jump ahead. Both regular slideshow
  // and burst (video-messages playback) rely on this since we no longer
  // set the `loop` attribute on the <video> elements.
  [vidA, vidB].forEach(v => {
    v?.addEventListener('ended', () => {
      if (!isRunning || isPaused) return;
      const activeVid = activeLayer === 'A' ? vidA : vidB;
      if (v !== activeVid) return;
      clearTimeout(slideTimer);
      if (inBurst) advanceBurstOrEnd();
      else        advance();
    });
  });

  /* ══════════════════════════════════════════════════════════
     PAUSE / RESUME
  ══════════════════════════════════════════════════════════ */
  function togglePause() {
    isPaused = !isPaused;
    pauseBtn.classList.toggle('visible', isPaused);
    const activeVid = activeLayer === 'A' ? vidA : vidB;
    if (isPaused) {
      clearTimeout(slideTimer);
      stopProgress();
      if (items.__currentIsVideo && activeVid) try { activeVid.pause(); } catch {}
    } else {
      startProgress();
      if (items.__currentIsVideo && activeVid) {
        const p = activeVid.play(); if (p?.catch) p.catch(() => {});
      }
      scheduleAdvance();
    }
  }

  /* ══════════════════════════════════════════════════════════
     CAPTION & CORNER
  ══════════════════════════════════════════════════════════ */
  function formatTime(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      return d.toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();
    } catch { return ''; }
  }

  function updateCaption(item) {
    const name = item.uploader_name || 'Panauhin';
    const time = formatTime(item.created_at);
    capUploader.textContent = `— ${name}${time ? ' · ' + time : ''}`;
    capQuote.textContent    = item.message || '';
  }

  function updateCorner() {
    if (!eventData) return;
    // Split at " & " or " and " to wrap the ampersand in <em>
    const raw = eventData.couple_names || '';
    const parts = raw.split(/\s+(?:&|and)\s+/i);
    if (parts.length === 2) {
      cornerNames.innerHTML = `${parts[0]} <em>&amp;</em> ${parts[1]}`;
    } else {
      cornerNames.textContent = raw;
    }
  }

  /* ══════════════════════════════════════════════════════════
     TICKER
  ══════════════════════════════════════════════════════════ */
  function updateTicker(uploads) {
    // Live segment: event name
    if (eventData) tickerName.textContent = eventData.couple_names || '';

    // Stats: moments · guests · date
    const guestSet   = new Set(uploads.map(u => u.uploader_name).filter(Boolean));
    let dateStr = '';
    if (eventData && eventData.event_date) {
      try {
        const d  = new Date(eventData.event_date);
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        dateStr  = `${dd}·${mm}·${d.getFullYear()}`;
      } catch { /* skip */ }
    }

    tickerStats.innerHTML =
      `<span><em>${uploads.length}</em> moments</span>` +
      `<span><em>${guestSet.size}</em> guests sharing</span>` +
      (dateStr ? `<span>${dateStr}</span>` : '');
  }

  /* ══════════════════════════════════════════════════════════
     UPCOMING STRIP
  ══════════════════════════════════════════════════════════ */
  function updateUpcoming(idx) {
    if (items.length < 2) { upcomingCol.innerHTML = ''; return; }

    const count = Math.min(4, items.length - 1);
    upcomingCol.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const item = items[(idx + 1 + i) % items.length];
      const div  = document.createElement('div');
      div.className = 'upcoming-thumb' + (i === 0 ? ' next' : '');
      const mediaUrl = wallMediaUrl(item);
      div.style.backgroundImage = mediaUrl ? `url('${mediaUrl}')` : 'none';
      const target = idx + 1 + i;
      div.onclick = () => goTo(target);
      upcomingCol.appendChild(div);
    }
  }

  /* ══════════════════════════════════════════════════════════
     QR BADGE
  ══════════════════════════════════════════════════════════ */
  async function initQrBadge(eventSlug) {
    qrUrlEl.textContent = `reelday.ph/upload/${eventSlug}`;
    qrBadge.style.display = 'flex';
    resetQrTimer();

    try {
      const res = await fetch(`/api/events/${eventSlug}/qr`);
      if (!res.ok) return;
      const { qr_code } = await res.json();
      if (qr_code) {
        qrImgWrap.style.background = 'none';
        const img = document.createElement('img');
        img.src = qr_code; img.alt = 'QR Code';
        qrImgWrap.appendChild(img);
      }
    } catch { /* checkerboard fallback stays */ }
  }

  function resetQrTimer() {
    clearTimeout(qrTimer);
    qrBadge.style.opacity = '1';
    qrTimer = setTimeout(() => { qrBadge.style.opacity = '0'; }, QR_HIDE_AFTER);
  }

  /* ══════════════════════════════════════════════════════════
     FLOATING EMOJIS — driven by guest reactions only.
     The previous random/scheduled emoji storm is gone; every
     floating emoji on the wall now corresponds to a real tap from
     a real guest via /api/reactions/:slug.
  ══════════════════════════════════════════════════════════ */
  function spawnEmoji(emoji) {
    if (!emoji) return;
    const el = document.createElement('div');
    el.className  = 'float-emoji';
    el.textContent = emoji;
    el.style.left = `${5 + Math.random() * 88}%`;
    el.style.fontSize = `${1.6 + Math.random() * 1.8}rem`;
    el.style.animationDuration = `${3.5 + Math.random() * 2.5}s`;
    emojiBox.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  /* ══════════════════════════════════════════════════════════
     TOAST
  ══════════════════════════════════════════════════════════ */
  let toastTimer;
  function showToast(msg) {
    clearTimeout(toastTimer);
    uploadToast.textContent = msg;
    uploadToast.classList.add('show');
    toastTimer = setTimeout(() => uploadToast.classList.remove('show'), 3500);
  }

  /* ══════════════════════════════════════════════════════════
     BURST MODE — host-triggered "play video messages" takeover
  ══════════════════════════════════════════════════════════ */
  const burstBanner  = document.getElementById('burst-banner');
  const burstFrom    = document.getElementById('burst-from');
  const burstCounter = document.getElementById('burst-counter');

  let lastBurstId      = null;     // last burst_id seen from the API
  let inBurst          = false;
  let burstQueue       = [];       // upload objects to play, in order
  let burstIdx         = 0;
  let savedItems       = null;     // photo/video stream prior to burst
  let savedIdx         = 0;

  function enterBurstMode(uploadIds) {
    if (!Array.isArray(uploadIds) || !uploadIds.length) return;
    // Resolve ids → upload objects from the cache
    const byId = new Map(allUploads.map(u => [String(u.id), u]));
    const queue = uploadIds.map(id => byId.get(String(id))).filter(Boolean);
    if (!queue.length) return;

    // Save current state so we can resume photos afterwards
    savedItems = items.slice();
    savedIdx   = currentIdx;
    inBurst    = true;
    burstQueue = queue;
    burstIdx   = 0;

    items = queue;
    currentIdx = 0;
    clearTimeout(slideTimer);

    burstBanner.classList.add('visible');
    updateBurstBanner();

    // The host clicked Play in the dashboard, which counts as a user gesture
    // *for that tab*. The wall is on a different page so audio may still be
    // gated — that's why the sound toggle is shown. If the host has already
    // tapped it, audio plays.

    if (!isRunning) {
      isRunning = true;
      emptyState.classList.remove('visible');
    }
    showSlide(0);
    startProgress();
    slideTimer = setTimeout(advanceBurstOrEnd, currentSlideDuration());
  }

  function updateBurstBanner() {
    const item = burstQueue[burstIdx];
    burstFrom.textContent = item?.uploader_name
      ? `from ${item.uploader_name}`
      : 'a video message';
    burstCounter.textContent = `${burstIdx + 1} / ${burstQueue.length}`;
  }

  function advanceBurstOrEnd() {
    if (!inBurst) return advance();
    burstIdx += 1;
    if (burstIdx >= burstQueue.length) {
      exitBurstMode();
      return;
    }
    currentIdx = burstIdx;
    showSlide(currentIdx);
    startProgress();
    updateBurstBanner();
    slideTimer = setTimeout(advanceBurstOrEnd, currentSlideDuration());
  }

  function exitBurstMode() {
    inBurst = false;
    burstQueue = [];
    burstBanner.classList.remove('visible');

    // Restore the photo/video stream and continue from where we left off + 1
    if (savedItems && savedItems.length) {
      items = savedItems;
      const next = (savedIdx + 1) % items.length;
      currentIdx = next;
      showSlide(currentIdx);
      startProgress();
      slideTimer = setTimeout(advance, currentSlideDuration());
    }
    savedItems = null;
  }

  // When a video ends naturally during a burst, jump to the next item
  // immediately rather than waiting for the timer.
  [vidA, vidB].forEach(v => {
    v?.addEventListener('ended', () => {
      if (!inBurst) return;
      // Only react to the active layer's video.
      const activeVid = activeLayer === 'A' ? vidA : vidB;
      if (v !== activeVid) return;
      clearTimeout(slideTimer);
      advanceBurstOrEnd();
    });
  });

  // ── Live poll polling ────────────────────────────────────
  // The host runs a poll from the dashboard; the wall pauses photos and
  // shows a full-screen takeover. Slideshow timers stay paused while
  // the overlay is active so we don't advance behind the scenes.
  const pollOverlay   = document.getElementById('poll-overlay');
  const pollQuestion  = document.getElementById('poll-question');
  const pollBars      = document.getElementById('poll-bars');
  const pollCountdown = document.getElementById('poll-countdown');
  const pollFootStat  = document.getElementById('poll-foot-status');
  let activePollId    = null;
  let pollCountdownTimer = null;
  let pollSlideshowResumeAt = 0;

  function pausePollSlideshow() {
    if (!isRunning) return;
    isPaused = true;
    clearTimeout(slideTimer);
    document.body.classList.add('poll-active');
  }
  function resumePollSlideshow() {
    if (isRunning) {
      isPaused = false;
      scheduleAdvance();
    }
    document.body.classList.remove('poll-active');
  }

  function renderPollBars(poll, opts = {}) {
    const tally = new Map((poll.tally || []).map(t => [t.key, t.count]));
    const total = poll.total_votes || 0;
    const max   = Math.max(1, ...Array.from(tally.values()));
    pollQuestion.textContent = poll.question;

    pollBars.innerHTML = (poll.options || []).map(opt => {
      const count = tally.get(opt.key) || 0;
      const pct   = total ? Math.round((count / total) * 100) : 0;
      const fill  = total ? Math.round((count / max)   * 100) : 0;
      const isLeader = opts.leaderHighlight && count > 0 && count === max && total > 0;
      return `
        <div class="poll-bar ${isLeader ? 'leader' : ''}">
          <span class="fill" style="width:${fill}%"></span>
          <span class="row">
            <span class="label">${escapeWallHtml(opt.label)}</span>
            <span class="stats">${pct}% · ${count}</span>
          </span>
        </div>`;
    }).join('');
  }

  // Tiny local escape — wall.html doesn't import the upload-page helper.
  function escapeWallHtml(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function showPollOverlay(poll) {
    pollOverlay.classList.add('visible', 'live-state');
    pollOverlay.classList.remove('ending', 'results-state');
    pollOverlay.setAttribute('aria-hidden', 'false');
    const fastestEl = document.getElementById('poll-fastest');
    if (fastestEl) { fastestEl.style.display = 'none'; fastestEl.innerHTML = ''; }
    pausePollSlideshow();
    renderPollBars(poll);

    // Countdown ticker — server is the source of truth; this is purely
    // cosmetic so the displayed seconds-left feels live between polls.
    if (pollCountdownTimer) clearInterval(pollCountdownTimer);
    let secondsLeft = Math.max(0, Number(poll.seconds_left) || 0);
    pollCountdown.textContent = `${secondsLeft}s`;
    pollFootStat.innerHTML = `VOTING ENDS IN <span class="poll-countdown" id="poll-countdown">${secondsLeft}s</span>`;
    pollCountdownTimer = setInterval(() => {
      secondsLeft = Math.max(0, secondsLeft - 1);
      const el = document.getElementById('poll-countdown');
      if (el) el.textContent = `${secondsLeft}s`;
      if (secondsLeft === 0) clearInterval(pollCountdownTimer);
    }, 1000);
  }

  function showPollResultsThenHide(poll) {
    // Announce results state visually so the room can see the final
    // tally + the fastest responder before photos resume.
    if (pollCountdownTimer) clearInterval(pollCountdownTimer);
    pollOverlay.classList.remove('live-state');
    pollOverlay.classList.add('results-state');
    pollFootStat.textContent = 'FINAL RESULTS';
    renderPollBars(poll, { leaderHighlight: true });

    const fastestEl = document.getElementById('poll-fastest');
    const fv = poll.fastest_voter;
    if (fastestEl) {
      if (fv && fv.guest_name) {
        const secs = Number(fv.response_seconds);
        const secsLabel = Number.isFinite(secs)
          ? `<span class="secs">${secs.toFixed(1)}s</span>` : '';
        fastestEl.innerHTML = `⚡ Fastest answer · <b>${escapeWallHtml(fv.guest_name)}</b>${secsLabel}`;
        fastestEl.style.display = '';
      } else {
        fastestEl.style.display = 'none';
        fastestEl.innerHTML = '';
      }
    }

    pollSlideshowResumeAt = Date.now() + 10000;
    setTimeout(() => {
      // Only hide if no NEW poll has started in the meantime.
      if (Date.now() >= pollSlideshowResumeAt - 50) hidePollOverlay();
    }, 10000);
  }

  function hidePollOverlay() {
    if (!pollOverlay.classList.contains('visible')) return;
    pollOverlay.classList.add('ending');
    setTimeout(() => {
      pollOverlay.classList.remove('visible', 'ending');
      pollOverlay.setAttribute('aria-hidden', 'true');
      pollBars.innerHTML = '';
      pollQuestion.textContent = '';
      pollOverlay.classList.remove('live-state', 'results-state');
      const fastestEl = document.getElementById('poll-fastest');
      if (fastestEl) { fastestEl.style.display = 'none'; fastestEl.innerHTML = ''; }
      activePollId = null;
      resumePollSlideshow();
    }, 500);
  }

  let lastSeenPollId = null;
  let lastSeenPollStatus = null;
  async function pollPolls() {
    try {
      const res = await fetch(`/api/events/${slug}/polls/active`, { cache: 'no-store' });
      if (!res.ok) return;
      const { poll } = await res.json();

      // No poll on the server side.
      if (!poll) {
        if (lastSeenPollStatus === 'live' && activePollId) {
          // Was live, now gone — show "ended" results briefly. The
          // server already auto-ends; we have the last tally cached
          // in the DOM, so just transition to results state.
          pollFootStat.textContent = 'FINAL RESULTS';
          pollOverlay.classList.remove('live-state');
          pollOverlay.classList.add('results-state');
          if (pollCountdownTimer) clearInterval(pollCountdownTimer);
          // Hide after a short grace.
          setTimeout(hidePollOverlay, 4000);
        } else if (!activePollId) {
          // Already idle — nothing to do.
        }
        lastSeenPollId = null;
        lastSeenPollStatus = null;
        return;
      }

      // New poll arrived.
      if (poll.id !== lastSeenPollId) {
        activePollId = poll.id;
        lastSeenPollId = poll.id;
        lastSeenPollStatus = poll.status;
        showPollOverlay(poll);
        return;
      }

      // Same poll, still live — refresh the tally.
      if (poll.status === 'live') {
        renderPollBars(poll);
      } else if (poll.status === 'ended' && lastSeenPollStatus === 'live') {
        // Transition: live -> ended -> results -> hide.
        lastSeenPollStatus = 'ended';
        showPollResultsThenHide(poll);
      }
    } catch { /* network blip */ }
  }

  // ── Reactions polling ────────────────────────────────────
  // The endpoint returns { reactions:[…], server_time } where
  // server_time lets us pin the next ?since to the SERVER clock, not
  // the wall's (avoids drift if the wall TV's clock is off). We start
  // at "now" so old reactions aren't replayed on page load.
  let reactionsSince = new Date().toISOString();
  let reactionDropFrame = false;
  async function pollReactions() {
    try {
      const url = `/api/reactions/${slug}?since=${encodeURIComponent(reactionsSince)}`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      const list = Array.isArray(data.reactions) ? data.reactions : [];
      if (data.server_time) reactionsSince = data.server_time;

      // Soft cap: at very high tap rates spawn one frame per emoji but
      // skip every other frame so the GPU + DOM don't churn. Drops to
      // normal cadence when the storm subsides.
      const heavy = list.length > 12;
      list.forEach((r, i) => {
        if (heavy) {
          reactionDropFrame = !reactionDropFrame;
          if (reactionDropFrame) return;
        }
        // Stagger spawns slightly so even a batched poll feels like a
        // continuous trickle rather than a thunderclap.
        setTimeout(() => spawnEmoji(r.emoji), i * 90);
      });

      // Caption banner for the FIRST reaction in this batch only.
      // During a storm, names would just blur past unreadably.
      if (list.length && !heavy) {
        const r = list[0];
        showToast(`${r.emoji} ${r.guest_name || 'Panauhin'}`);
      }
    } catch { /* network blip — try again next tick */ }
  }

  async function pollBurst() {
    try {
      const res = await fetch(`/api/events/${slug}`);
      if (!res.ok) return;
      const data  = await res.json();
      const event = data.event || {};
      const id    = event.playback_burst_id ?? 0;
      const queue = Array.isArray(event.playback_burst_queue) ? event.playback_burst_queue : [];

      // First poll establishes the baseline so old bursts don't fire on refresh.
      if (lastBurstId === null) {
        lastBurstId = id;
        return;
      }
      if (id === lastBurstId) return;
      lastBurstId = id;

      if (queue.length === 0) {
        // Empty queue → host hit Stop. Cut the burst short if one is running.
        if (inBurst) {
          clearTimeout(slideTimer);
          exitBurstMode();
        }
        return;
      }

      enterBurstMode(queue);
    } catch { /* network blip — try again next tick */ }
  }

  /* ══════════════════════════════════════════════════════════
     POLL FOR NEW UPLOADS
  ══════════════════════════════════════════════════════════ */
  async function refreshUploads() {
    let apiUploads = [];
    try {
      const res = await fetch(`/api/uploads/${slug}`);
      if (res.ok) apiUploads = (await res.json()).uploads || [];
    } catch { /* fall through to local-only */ }

    const merged = mergeUploads(apiUploads);
    allUploads = merged;

    const slideable = merged;
    const prevCount = items.length;
    const newOnes   = slideable.filter(u => !knownIds.has(u.id));

    if (newOnes.length > 0 && isRunning && prevCount > 0 && !inBurst) {
      // Slideshow is running — splice new approvals in right after the
      // current slide and jump straight to the first new one so the host
      // sees their approval reach the wall immediately. Older items keep
      // their relative order so the cycle resumes naturally afterwards.
      newOnes.forEach(u => knownIds.add(u.id));
      const safeIdx = Math.min(currentIdx, items.length - 1);
      const head    = items.slice(0, safeIdx + 1);
      const tail    = items.slice(safeIdx + 1).filter(u => !newOnes.some(n => n.id === u.id));
      items = [...head, ...newOnes, ...tail];
      const name = newOnes[0].uploader_name || 'Panauhin';
      showToast(`✨ ${name} just shared a moment!`);
      // Jump now — clears the pending slideTimer and shows the new one.
      goTo(safeIdx + 1);
    } else {
      // Not running yet, or empty — replace the deck wholesale.
      items = slideable;
      slideable.forEach(u => knownIds.add(u.id));
    }

    if (!isRunning && slideable.length > 0) {
      emptyState.classList.remove('visible');
      startSlideshow();
    } else if (isRunning && prevCount === 0 && slideable.length > 0) {
      emptyState.classList.remove('visible');
      startSlideshow();
    }

    updateTicker(merged);
  }

  /* ══════════════════════════════════════════════════════════
     EMPTY STATE
  ══════════════════════════════════════════════════════════ */
  async function showEmptyState(event) {
    emptyName.textContent = event.couple_names || 'Reelday';
    emptyState.classList.add('visible');

    try {
      const res = await fetch(`/api/events/${slug}/qr`);
      if (res.ok) {
        const { qr_code } = await res.json();
        if (qr_code) emptyQr.src = qr_code;
      }
    } catch { /* QR optional */ }
  }

  /* ══════════════════════════════════════════════════════════
     KEYBOARD + MOUSE
  ══════════════════════════════════════════════════════════ */
  document.addEventListener('keydown', e => {
    switch (e.key) {
      case ' ':
      case 'ArrowRight':
        e.preventDefault();
        if (isRunning) goTo(currentIdx + 1);
        break;
      case 'ArrowLeft':
        e.preventDefault();
        if (isRunning) goTo(currentIdx - 1);
        break;
      case 'f': case 'F':
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen();
        }
        break;
      case 'p': case 'P':
        if (isRunning) togglePause();
        break;
      case 'q': case 'Q':
        qrBadge.style.opacity = qrBadge.style.opacity === '0' ? '1' : '0';
        break;
    }
  });

  document.addEventListener('mousemove', resetQrTimer);

  // Note: we intentionally do NOT listen for `storage` events from
  // upload.html. localStorage entries are written before the host has had
  // a chance to approve, so trusting them would briefly flash unapproved
  // content on the wall (same-browser scenario). The wall is now
  // server-driven only — the next refreshUploads() poll picks up new
  // approvals.

  /* ══════════════════════════════════════════════════════════
     FULLSCREEN
     iOS Safari does NOT support requestFullscreen() on arbitrary
     elements — only on <video>. Detect and route accordingly:
       * desktop / Android: standard requestFullscreen on <html>
       * iOS Safari: webkitEnterFullscreen on the active <video>
         (only works while a video slide is playing — guests get
         fullscreen video for the message; photos can't go FS on iOS)
  ══════════════════════════════════════════════════════════ */
  const fsBtn  = document.getElementById('fs-btn');
  const fsIcon = document.getElementById('fs-icon');
  const ICON_ENTER = '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>';
  const ICON_EXIT  = '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>';

  const isIOS = /iPad|iPhone|iPod/.test(navigator.platform) ||
                (navigator.userAgent.includes('Mac') && 'ontouchend' in document);
  const docFsSupported =
    document.documentElement.requestFullscreen ||
    document.documentElement.webkitRequestFullscreen;

  function activeWallVideo() {
    return activeLayer === 'A' ? vidA : vidB;
  }

  function toggleFullscreen() {
    // Standard path: works on desktop Chrome/Firefox/Edge/Safari + Android.
    if (!isIOS && docFsSupported) {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const req = document.documentElement.requestFullscreen ||
                    document.documentElement.webkitRequestFullscreen;
        try { req.call(document.documentElement); } catch {}
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        try { exit.call(document); } catch {}
      }
      return;
    }
    // iOS Safari: only the <video> element can go fullscreen.
    const v = activeWallVideo();
    if (v && typeof v.webkitEnterFullscreen === 'function' && items.__currentIsVideo) {
      // Audio defaults to on inside iOS native player, so we can also flip
      // the wall's mute state to match what the guest is about to see.
      v.muted = false;
      try { v.webkitEnterFullscreen(); }
      catch { /* swallow — user can tap Tap-for-sound instead */ }
    } else {
      // No active video to fullscreen on iOS — let the guest know.
      showToast?.('On iPhone, tap a video slide to go fullscreen.');
    }
  }

  if (fsBtn) fsBtn.addEventListener('click', toggleFullscreen);

  document.addEventListener('fullscreenchange', () => {
    fsIcon.innerHTML = (document.fullscreenElement || document.webkitFullscreenElement) ? ICON_EXIT : ICON_ENTER;
  });
  document.addEventListener('webkitfullscreenchange', () => {
    fsIcon.innerHTML = (document.fullscreenElement || document.webkitFullscreenElement) ? ICON_EXIT : ICON_ENTER;
  });

  document.body.addEventListener('click', e => {
    if (e.target.closest('.qr-badge') ||
        e.target.closest('.upcoming') ||
        e.target.closest('.pause-btn') ||
        e.target.closest('.controls-tray')) return;
    if (isRunning) goTo(currentIdx + 1);
  });

  /* ══════════════════════════════════════════════════════════
     INIT
  ══════════════════════════════════════════════════════════ */
  async function init() {
    if (!slug) {
      emptyName.textContent = 'Reelday';
      emptyState.classList.add('visible');
      return;
    }

    // Try the API for event metadata + uploads
    let apiEvent = null;
    let apiUploads = [];
    let apiLocks = null;
    try {
      const [eventRes, uploadsRes] = await Promise.all([
        fetch(`/api/events/${slug}`),
        fetch(`/api/uploads/${slug}`),
      ]);
      if (eventRes.ok) {
        const ej = await eventRes.json();
        apiEvent = ej.event;
        apiLocks = ej.locks || null;
      }
      if (uploadsRes.ok) apiUploads = (await uploadsRes.json()).uploads || [];
    } catch { /* offline / demo mode — fall back to localStorage */ }

    // Read URL query params as a fallback for event metadata (matches dashboard demo mode)
    const qs = new URLSearchParams(location.search);
    eventData = apiEvent || {
      slug,
      couple_names: qs.get('name')  || slug,
      event_type:   qs.get('theme') || 'wedding',
      event_date:   qs.get('date')  || '',
      venue:        qs.get('venue') || '',
    };

    // Phase 4: archived badge if the gallery expiry has passed
    if (apiLocks?.gallery_locked) {
      const badge = document.createElement('div');
      badge.style.cssText =
        'position:fixed;top:18px;right:18px;z-index:11;' +
        'padding:6px 14px;border-radius:999px;' +
        'background:rgba(0,0,0,.55);backdrop-filter:blur(8px);' +
        '-webkit-backdrop-filter:blur(8px);' +
        'font-family:var(--mono);font-size:11px;letter-spacing:.2em;' +
        'text-transform:uppercase;color:rgba(255,255,255,.85);' +
        'border:1px solid rgba(255,255,255,.18);';
      badge.textContent = '◆ Archived';
      document.body.appendChild(badge);
    }

    // Apply event theme
    const themeKey = Object.keys(THEME_META).includes(eventData.event_type) ? eventData.event_type : 'wedding';
    themeMeta = THEME_META[themeKey];
    document.body.setAttribute('data-theme', themeKey);

    document.title = `Live Wall — ${eventData.couple_names}`;

    // Merge API + localStorage uploads
    const merged = mergeUploads(apiUploads);
    allUploads = merged;

    updateCorner();
    updateTicker(merged);
    await initQrBadge(slug);

    // Include every approved upload — photos, picked videos, and recorded
    // video messages. The slide engine knows how to play videos.
    const slideable = merged;
    slideable.forEach(u => knownIds.add(u.id));
    items = slideable;

    if (items.length > 0) {
      startSlideshow();
    } else {
      await showEmptyState(eventData);
    }

    setInterval(refreshUploads, POLL_INTERVAL);

    // Poll the event endpoint a bit more frequently so a host clicking
    // "Play video messages" sees the wall react within a few seconds.
    pollBurst();
    setInterval(pollBurst, 3000);

    // Reactions: poll every second for new emoji taps from guests.
    // The endpoint is keyset-style (?since=<iso>) so only the deltas
    // ship; empty calls cost ~zero.
    pollReactions();
    setInterval(pollReactions, 1000);

    // Live polls: 2s cadence. Snappy enough that the wall takes over
    // within ~2s of the host hitting "Run on wall" and updates the
    // tally as votes arrive.
    pollPolls();
    setInterval(pollPolls, 2000);
  }

  init();
</script>
</body>
</html>
