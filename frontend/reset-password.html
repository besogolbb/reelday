<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080808" />
  <title>Reelday — Reset Password</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080808; color: #f0ebe4; font-family: 'DM Sans', sans-serif; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card { background: #111; border: 1px solid rgba(255,255,255,.08); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 400px; }
    .logo { display: block; text-align: center; font-family: 'Playfair Display', serif; font-size: 1rem; letter-spacing: .14em; text-transform: uppercase; color: #e8735a; text-decoration: none; margin-bottom: 2rem; opacity: .8; }
    h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; text-align: center; margin-bottom: .4rem; }
    .sub { text-align: center; color: rgba(240,235,228,.5); font-size: .9rem; margin-bottom: 2rem; }
    .field { margin-bottom: 1.1rem; }
    label { display: block; font-size: .82rem; font-weight: 600; color: rgba(240,235,228,.6); margin-bottom: .4rem; }
    input { width: 100%; padding: .75rem 1rem; background: #1a1a1a; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; color: #f0ebe4; font-family: inherit; font-size: .95rem; outline: none; transition: border-color .15s; }
    input:focus { border-color: #e8735a; }
    .btn-submit { width: 100%; padding: .9rem; background: #e8735a; color: #fff; border: none; border-radius: 12px; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity .15s; margin-top: .5rem; min-height: 50px; }
    .btn-submit:hover:not(:disabled) { opacity: .88; }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
    .msg { border-radius: 8px; padding: .65rem .9rem; font-size: .85rem; margin-top: .75rem; display: none; }
    .msg-error   { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.25); color: #f87171; }
    .msg-success { background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.25); color: #34d399; }
    .login-link { text-align: center; font-size: .88rem; color: rgba(240,235,228,.55); margin-top: 1.25rem; }
    .login-link a { color: #e8735a; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
<div class="card">
  <a class="logo" href="/">Reelday ✦</a>
  <h1>Reset Password</h1>
  <p class="sub">Enter your new password below.</p>

  <form id="reset-form" novalidate>
    <div class="field">
      <label for="password">New Password</label>
      <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password" required />
    </div>
    <button class="btn-submit" id="btn-submit" type="submit">Set New Password</button>
    <div class="msg msg-error"   id="err-msg"></div>
    <div class="msg msg-success" id="ok-msg"></div>
  </form>

  <div class="login-link"><a href="/login">Back to login</a></div>
</div>

<script type="module">
  const token = new URLSearchParams(location.search).get('token');
  if (!token) {
    document.getElementById('err-msg').textContent = 'Missing reset token.';
    document.getElementById('err-msg').style.display = 'block';
  }

  document.getElementById('reset-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: document.getElementById('password').value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      document.getElementById('ok-msg').textContent  = 'Password updated! Redirecting to login…';
      document.getElementById('ok-msg').style.display = 'block';
      setTimeout(() => location.href = '/login', 2000);
    } catch (err) {
      document.getElementById('err-msg').textContent  = err.message;
      document.getElementById('err-msg').style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Set New Password';
    }
  });
</script>
</body>
</html>
