<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbf5ec" />
  <title>Reelday — Reset Password</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/shared.css" />
  <style>
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-card);
      padding: 2.5rem;
      width: 100%; max-width: 420px;
    }

    .auth-brand { display: block; text-align: center; margin-bottom: 2rem; }

    h1 { font-family: var(--display); font-size: 1.6rem; text-align: center; margin-bottom: .4rem; color: var(--ink); }

    .sub { text-align: center; color: var(--ink-soft); font-size: .9rem; margin-bottom: 2rem; }

    .field { margin-bottom: 1.1rem; }

    label { display: block; font-size: .82rem; font-weight: 600; color: var(--ink-soft); margin-bottom: .4rem; }

    input {
      width: 100%; padding: .75rem 1rem; background: #fff;
      border: 1.5px solid var(--line-2); border-radius: var(--r);
      color: var(--ink); font-family: inherit; font-size: .95rem;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196,90,58,.12);
    }

    .btn-submit {
      width: 100%; margin-top: .5rem; min-height: 50px;
    }

    .msg {
      border-radius: var(--r); padding: .65rem .9rem;
      font-size: .85rem; margin-top: .75rem; display: none;
    }
    .msg-error {
      background: rgba(196,90,58,.08);
      border: 1px solid rgba(196,90,58,.25);
      color: var(--accent-deep);
    }
    .msg-success {
      background: rgba(45,106,74,.08);
      border: 1px solid rgba(45,106,74,.25);
      color: #2d6a4a;
    }

    .login-link { text-align: center; font-size: .88rem; color: var(--ink-soft); margin-top: 1.25rem; }
    .login-link a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="auth-brand">
    <a class="brand" href="/">REELDAY<sup>★</sup></a>
  </div>
  <h1>Reset Password</h1>
  <p class="sub">Enter your new password below.</p>

  <form id="reset-form" novalidate>
    <div class="field">
      <label for="password">New Password</label>
      <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password" required />
    </div>
    <button class="btn btn-accent btn-submit" id="btn-submit" type="submit">Set New Password</button>
    <div class="msg msg-error"   id="err-msg"></div>
    <div class="msg msg-success" id="ok-msg"></div>
  </form>

  <div class="login-link"><a href="/login">Back to login</a></div>
</div>

<script type="module">
  const token = new URLSearchParams(location.search).get('token');
  if (!token) {
    document.getElementById('err-msg').textContent = 'Missing reset token.';
    document.getElementById('err-msg').style.display = 'block';
  }

  document.getElementById('reset-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: document.getElementById('password').value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      document.getElementById('ok-msg').textContent  = 'Password updated! Redirecting to login…';
      document.getElementById('ok-msg').style.display = 'block';
      setTimeout(() => location.href = '/login', 2000);
    } catch (err) {
      document.getElementById('err-msg').textContent  = err.message;
      document.getElementById('err-msg').style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Set New Password';
    }
  });
</script>
</body>
</html>
