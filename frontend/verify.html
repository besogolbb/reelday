<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbf5ec" />
  <title>Reelday — Verify Email</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
  <link rel="shortcut icon" href="/favicon.ico?v=2" />
  <link rel="stylesheet" href="/css/shared.css" />
  <style>
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-card);
      padding: 2.5rem;
      width: 100%; max-width: 420px;
      text-align: center;
    }

    .auth-brand { display: block; margin-bottom: 2rem; }

    .icon { font-size: 3rem; margin-bottom: 1rem; }

    h1 { font-family: var(--display); font-size: 1.6rem; margin-bottom: .5rem; color: var(--ink); }

    p { color: var(--ink-soft); font-size: .9rem; line-height: 1.6; }

    .btn-goto {
      display: inline-block;
      margin-top: 1.5rem;
    }

    .error-text { color: var(--accent-deep); }

    .loading-wrap { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="auth-brand">
    <a class="brand" href="/">REELDAY<sup>★</sup></a>
  </div>

  <div id="loading" class="loading-wrap">
    <div class="spinner"></div>
    <p>Verifying your email…</p>
  </div>

  <div id="success" style="display:none">
    <div class="icon">🎉</div>
    <h1>Email Verified!</h1>
    <p>Your account is now active. Welcome to Reelday!</p>
    <a class="btn btn-accent btn-goto" href="/my-events">Go to My Events</a>
  </div>

  <div id="error-state" style="display:none">
    <div class="icon">😔</div>
    <h1 class="error-text">Verification Failed</h1>
    <p id="error-msg">The link is invalid or has expired.</p>
    <a class="btn btn-accent btn-goto" href="/register">Sign up again</a>
  </div>
</div>

<script type="module">
  import { saveAuth } from '/js/auth.js';

  const token = new URLSearchParams(location.search).get('token');

  if (!token) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-state').style.display = 'block';
  } else {
    (async () => {
      try {
        const res  = await fetch('/api/auth/verify-email', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        saveAuth(data.token, data.user);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('success').style.display = 'block';
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-msg').textContent = err.message || 'Verification failed.';
        document.getElementById('error-state').style.display = 'block';
      }
    })();
  }
</script>
</body>
</html>
