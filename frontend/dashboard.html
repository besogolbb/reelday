<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2a1a14" />
  <title>Reelday — Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/shared.css" />
  <style>
    body { min-height: 100dvh; }

    /* ── Payment / mode banner ────────────────────────────── */
    .pay-banner {
      display: none; padding: .75rem 1.25rem; text-align: center;
      font-family: var(--sans); font-size: .875rem;
      align-items: center; justify-content: center; gap: .75rem;
      flex-wrap: wrap; position: sticky; top: 0; z-index: 999;
    }
    .pay-banner.banner-trial   { background: var(--accent); color: #fff; }
    .pay-banner.banner-pending { background: rgba(216,160,90,.15); border-bottom: 1px solid rgba(216,160,90,.3); color: #7a5a20; }
    .pay-banner a { color: inherit; font-weight: 700; text-decoration: underline; }

    /* ── Header ───────────────────────────────────────── */
    .dash-header {
      background: var(--ink);
      color: #fff;
      padding: 1.5rem 0 3.5rem;
      position: relative;
    }

    .header-inner {
      max-width: 1100px;
      margin-inline: auto;
      padding-inline: 1.5rem;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }

    .header-logo {
      font-family: var(--display);
      font-size: 1.1rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .75;
      color: #fff;
      text-decoration: none;
    }

    .header-body { display: flex; flex-direction: column; gap: .5rem; }

    .event-type-badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      padding: .25rem .85rem;
      font-family: var(--mono);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      width: fit-content;
      color: #fff;
    }

    .event-names {
      font-family: var(--display);
      font-size: clamp(1.8rem, 5vw, 3rem);
      line-height: 1.15;
      font-weight: 600;
      color: #fff;
    }

    .event-meta { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: .25rem; }
    .event-date { font-size: .9rem; opacity: .75; color: #fff; }

    .plan-badge {
      font-family: var(--mono);
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: .2rem .7rem;
      border-radius: 999px;
    }

    .plan-libre       { background: rgba(255,255,255,.12); color: rgba(255,255,255,.85); }
    .plan-pending     { background: rgba(216,160,90,.25);  color: #fbbf24; }
    .plan-selebrasyon { background: rgba(196,90,58,.3);    color: #fff; }
    .plan-pro         { background: rgba(216,160,90,.3);   color: #f5d090; }

    /* Nav links in header */
    .header-nav-link {
      color: rgba(255,255,255,.75);
      font-size: .82rem;
      text-decoration: none;
      padding: .35rem .7rem;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: var(--r-sm);
      transition: background .15s;
    }
    .header-nav-link:hover { background: rgba(255,255,255,.12); }

    /* Lang toggle in dark header */
    .lang-toggle {
      display: flex;
      background: rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
    }
    .lang-btn {
      padding: .22rem .6rem;
      border: none;
      border-radius: 16px;
      font-family: var(--sans);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .05em;
      cursor: pointer;
      background: transparent;
      color: rgba(255,255,255,.65);
      transition: background .15s, color .15s;
    }
    .lang-btn.active { background: rgba(255,255,255,.9); color: var(--ink); }

    /* Live wall button */
    .btn-live-wall {
      background: rgba(255,255,255,.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      padding: .55rem 1.1rem;
      font-family: var(--sans);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-live-wall:hover { background: rgba(255,255,255,.22); }

    .header-divider {
      position: absolute;
      bottom: -1px; left: 0; width: 100%; overflow: hidden; line-height: 0;
    }
    .header-divider svg { display: block; width: 100%; height: 48px; }

    /* ── Main layout ──────────────────────────────────── */
    .dash-main {
      max-width: 1100px;
      margin-inline: auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── Stats row ────────────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .stat-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 1.25rem 1rem;
      box-shadow: var(--shadow-soft);
      text-align: center;
      transition: transform .2s, box-shadow .2s;
    }

    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }

    .stat-icon { font-size: 1.75rem; margin-bottom: .35rem; line-height: 1; }

    .stat-number {
      font-family: var(--display);
      font-size: 2rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1;
      margin-bottom: .2rem;
    }

    .stat-label {
      font-family: var(--mono);
      font-size: .7rem; font-weight: 600; color: var(--ink-faint);
      text-transform: uppercase; letter-spacing: .1em;
    }

    /* ── Two-column layout (QR + gallery) ─────────────── */
    .dash-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    /* ── QR card ──────────────────────────────────────── */
    .qr-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-soft);
      padding: 1.75rem;
      position: sticky;
      top: 1.5rem;
    }

    .qr-card-title {
      font-family: var(--display);
      font-size: 1.05rem;
      color: var(--ink);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .qr-image-wrap {
      background: var(--paper-2);
      border-radius: var(--r);
      padding: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      min-height: 180px;
    }

    #qr-img { width: 100%; max-width: 200px; border-radius: 8px; }

    .qr-url {
      text-align: center;
      font-family: var(--mono);
      font-size: .75rem;
      color: var(--ink-soft);
      word-break: break-all;
      margin-bottom: 1.25rem;
      padding: .5rem .75rem;
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
    }

    .qr-actions { display: flex; flex-direction: column; gap: .65rem; }

    .btn-qr-action {
      width: 100%;
      padding: .7rem 1rem;
      border-radius: 999px;
      font-family: var(--sans);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      min-height: 44px;
    }

    .btn-qr-primary {
      background: var(--accent); color: #fff; border: none;
      box-shadow: 0 1px 2px rgba(196,90,58,.3);
    }
    .btn-qr-primary:hover { background: var(--accent-deep); }

    .btn-qr-outline {
      background: transparent; color: var(--accent);
      border: 1.5px solid var(--accent);
    }
    .btn-qr-outline:hover { background: var(--accent); color: #fff; }

    /* ── Gallery panel ────────────────────────────────── */
    .gallery-panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .gallery-header {
      padding: 1.25rem 1.5rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .gallery-title { font-family: var(--display); font-size: 1.05rem; color: var(--ink); }

    .gallery-tabs {
      display: flex; gap: .25rem;
      background: var(--paper-2);
      border-radius: var(--r);
      padding: 3px;
    }

    .g-tab {
      padding: .45rem 1rem;
      border: none;
      border-radius: calc(var(--r) - 2px);
      background: transparent;
      color: var(--ink-soft);
      font-family: var(--sans);
      font-weight: 600;
      font-size: .83rem;
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
    }

    .g-tab.active { background: #fff; color: var(--ink); box-shadow: var(--shadow-soft); }

    .gallery-body { padding: 1.25rem 1.5rem 1.5rem; }

    /* ── Photo/video grid ─────────────────────────────── */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .75rem;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: var(--r);
      overflow: hidden;
      cursor: pointer;
      background: var(--paper-2);
    }

    .gallery-item img,
    .gallery-item video {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform .3s;
    }

    .gallery-item:hover img,
    .gallery-item:hover video { transform: scale(1.04); }

    .gallery-item-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.65) 0%, transparent 50%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: .5rem .6rem;
      opacity: 0;
      transition: opacity .2s;
    }

    .gallery-item:hover .gallery-item-overlay { opacity: 1; }

    .btn-delete-item {
      position: absolute;
      top: .35rem; right: .35rem;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      border: none; color: #fff; font-size: .75rem;
      cursor: pointer;
      display: none; align-items: center; justify-content: center;
      line-height: 1; z-index: 10;
    }
    .gallery-item:hover .btn-delete-item { display: flex; }

    .btn-delete-vm {
      background: none;
      border: 1px solid rgba(196,90,58,.3);
      color: var(--accent);
      border-radius: 50%;
      width: 28px; height: 28px;
      font-size: .75rem;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      margin-left: .4rem;
    }
    .btn-delete-vm:hover { background: var(--accent); color: #fff; }

    .item-name { font-size: .72rem; font-weight: 600; color: #fff; max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-time { font-size: .65rem; color: rgba(255,255,255,.8); }

    .play-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.25);
    }

    .play-btn-circle {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; padding-left: 3px;
    }

    .vm-badge {
      position: absolute; top: .4rem; right: .4rem;
      background: var(--accent); color: #fff;
      border-radius: 999px;
      padding: .1rem .45rem; font-size: .65rem; font-weight: 700;
    }

    .gallery-empty { text-align: center; padding: 3rem 1rem; color: var(--ink-soft); }
    .gallery-empty-icon { font-size: 3rem; margin-bottom: .75rem; }
    .gallery-empty p { font-size: .9rem; }

    /* ── Video messages list ──────────────────────────── */
    .vm-list { display: flex; flex-direction: column; gap: .75rem; }

    .vm-item {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem;
      background: var(--paper);
      border-radius: var(--r);
      transition: background .15s;
    }
    .vm-item:hover { background: var(--paper-2); }

    .vm-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-soft), var(--accent));
      color: #fff;
      font-weight: 700; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .vm-info { flex: 1; min-width: 0; }
    .vm-name { font-weight: 600; font-size: .9rem; color: var(--ink); margin-bottom: .15rem; }
    .vm-meta { font-size: .75rem; color: var(--ink-soft); }

    .btn-play {
      padding: .45rem 1rem;
      background: var(--accent); color: #fff;
      border: none; border-radius: 999px;
      font-family: var(--sans); font-size: .8rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
      white-space: nowrap; flex-shrink: 0;
    }
    .btn-play:hover { background: var(--accent-deep); }

    /* ── Download bar ─────────────────────────────────── */
    .download-bar {
      margin-top: 1.25rem; padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: .75rem;
    }

    .download-count { font-size: .85rem; color: var(--ink-soft); }

    .btn-download-all {
      padding: .6rem 1.25rem;
      background: var(--ink); color: #fff;
      border: none; border-radius: 999px;
      font-family: var(--sans); font-size: .88rem; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
      display: flex; align-items: center; gap: .5rem;
    }
    .btn-download-all:hover { opacity: .85; }

    /* ── Refresh indicator ────────────────────────────── */
    .refresh-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent-soft);
      display: inline-block; margin-left: .4rem;
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── Lightbox ─────────────────────────────────────── */
    .lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.92); z-index: 1000;
      align-items: center; justify-content: center; padding: 1rem;
    }
    .lightbox.open { display: flex; }

    .lb-close {
      position: fixed; top: 1rem; right: 1rem;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,.15); border: none;
      color: #fff; font-size: 1.4rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 1001; transition: background .15s;
    }
    .lb-close:hover { background: rgba(255,255,255,.28); }

    .lb-nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,.12); border: none;
      color: #fff; font-size: 1.4rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s; z-index: 1001;
    }
    .lb-nav:hover { background: rgba(255,255,255,.25); }
    .lb-prev { left: .75rem; }
    .lb-next { right: .75rem; }

    .lb-body {
      max-width: 900px; width: 100%;
      display: flex; flex-direction: column;
      align-items: center; gap: 1rem;
    }

    #lb-media {
      width: 100%; max-height: 75vh;
      display: flex; align-items: center; justify-content: center;
    }

    #lb-media img, #lb-media video {
      max-width: 100%; max-height: 75vh;
      border-radius: 8px; object-fit: contain; display: block;
    }

    .lb-meta { text-align: center; color: #fff; }
    .lb-uploader { font-weight: 600; font-size: 1rem; margin-bottom: .25rem; }
    .lb-message  { font-size: .875rem; opacity: .7; max-width: 500px; line-height: 1.5; }
    .lb-counter  { font-size: .75rem; opacity: .5; margin-top: .25rem; }

    /* ── Loading + error states ───────────────────────── */
    .page-loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 60vh;
    }

    .page-error {
      display: none; text-align: center;
      padding: 6rem 2rem; color: var(--ink-soft);
    }
    .page-error-icon { font-size: 3rem; margin-bottom: 1rem; }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 900px) {
      .dash-grid { grid-template-columns: 1fr; }
      .qr-card { position: static; }
    }

    @media (max-width: 640px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      .header-inner { padding-inline: 1rem; }
      .dash-main { padding-inline: 1rem; }
    }

    @media (max-width: 380px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); gap: .6rem; }
      .stat-number { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<!-- ── Payment / mode banner ─────────────────────────────── -->
<div class="pay-banner" id="pay-banner">
  <span id="pay-banner-text"></span>
</div>

<!-- ── Header ────────────────────────────────────────────── -->
<header class="dash-header" id="dash-header" style="display:none">
  <div class="header-inner">
    <div class="header-top">
      <a href="/" class="header-logo">Reelday ✦</a>
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <div id="dash-nav-links" style="display:flex;gap:.5rem;align-items:center"></div>
        <div class="lang-toggle" id="lang-toggle">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="fil">FIL</button>
        </div>
        <button class="btn-live-wall" id="btn-live-wall"
          data-en="📺 Open Live Wall" data-fil="📺 Buksan ang Live Wall">📺 Open Live Wall</button>
      </div>
    </div>

    <div class="header-body">
      <div class="event-type-badge" id="event-type-badge">💍 Kasalan</div>
      <h1 class="event-names" id="event-names">—</h1>
      <div class="event-meta">
        <span class="event-date" id="event-date"></span>
        <span class="plan-badge" id="plan-badge">Libre</span>
      </div>
    </div>
  </div>

  <div class="header-divider">
    <svg viewBox="0 0 1200 48" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,48 C400,0 800,0 1200,48 L1200,48 L0,48 Z" style="fill:var(--paper)" />
    </svg>
  </div>
</header>

<!-- ── Page loading ──────────────────────────────────────── -->
<div class="page-loading" id="page-loading">
  <div class="spinner"></div>
</div>

<!-- ── Page error ────────────────────────────────────────── -->
<div class="page-error" id="page-error">
  <div class="page-error-icon">😔</div>
  <p id="page-error-msg" style="font-size:.95rem">Event not found.</p>
</div>

<!-- ── Main ──────────────────────────────────────────────── -->
<main class="dash-main" id="dash-main" style="display:none">

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon">📸</div>
      <div class="stat-number" id="stat-total">0</div>
      <div class="stat-label" data-en="Total" data-fil="Lahat">Total</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🖼️</div>
      <div class="stat-number" id="stat-photos">0</div>
      <div class="stat-label" data-en="Photos" data-fil="Litrato">Photos</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🎬</div>
      <div class="stat-number" id="stat-videos">0</div>
      <div class="stat-label" data-en="Videos" data-fil="Videos">Videos</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">💌</div>
      <div class="stat-number" id="stat-vms">0</div>
      <div class="stat-label" data-en="Messages" data-fil="Mensahe">Messages</div>
    </div>
  </div>

  <!-- Two-col grid -->
  <div class="dash-grid">

    <!-- QR card -->
    <div class="qr-card">
      <p class="qr-card-title" data-en="🔗 Guest Upload Link" data-fil="🔗 Link para sa Bisita">🔗 Guest Upload Link</p>

      <div class="qr-image-wrap" id="qr-wrap">
        <div class="spinner"></div>
      </div>

      <div class="qr-url" id="qr-url">—</div>

      <div class="qr-actions">
        <button class="btn-qr-action btn-qr-primary" id="btn-download-qr"
          data-en="📥 Download QR Code" data-fil="📥 I-download ang QR">
          📥 Download QR Code
        </button>
        <button class="btn-qr-action btn-qr-outline" id="btn-copy-link"
          data-en="🔗 Copy Guest Link" data-fil="🔗 Kopyahin ang Link">
          🔗 Copy Guest Link
        </button>
      </div>
    </div>

    <!-- Gallery panel -->
    <div class="gallery-panel">
      <div class="gallery-header">
        <div style="display:flex;align-items:center;gap:.5rem">
          <span class="gallery-title" data-en="Gallery" data-fil="Gallery">Gallery</span>
          <span class="refresh-dot" title="Auto-refreshes every 10s"></span>
        </div>
        <div class="gallery-tabs">
          <button class="g-tab active" data-tab="all" data-en="All" data-fil="Lahat">All</button>
          <button class="g-tab" data-tab="vm" data-en="Video Messages" data-fil="Video Messages">Video Messages</button>
        </div>
      </div>

      <div class="gallery-body">
        <!-- All uploads grid -->
        <div id="tab-all">
          <div class="gallery-grid" id="gallery-grid"></div>
          <div class="gallery-empty" id="gallery-empty" style="display:none">
            <div class="gallery-empty-icon">📭</div>
            <p data-en="No uploads yet. Share the QR code with your guests!" data-fil="Wala pang uploads. I-share ang QR code sa inyong mga bisita!">No uploads yet. Share the QR code with your guests!</p>
          </div>
        </div>

        <!-- Video messages list -->
        <div id="tab-vm" style="display:none">
          <div class="vm-list" id="vm-list"></div>
          <div class="gallery-empty" id="vm-empty" style="display:none">
            <div class="gallery-empty-icon">💌</div>
            <p data-en="No video messages yet." data-fil="Wala pang video messages.">No video messages yet.</p>
          </div>
        </div>

        <!-- Download bar -->
        <div class="download-bar">
          <span class="download-count" id="download-count">0 files</span>
          <button class="btn-download-all" id="btn-download-all"
            data-en="📥 Download All" data-fil="📥 I-download lahat">
            📥 Download All
          </button>
        </div>
      </div>
    </div>

  </div>
</main>

<!-- ── Lightbox ───────────────────────────────────────────── -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lb-close" id="lb-close" aria-label="Close">✕</button>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous">‹</button>
  <button class="lb-nav lb-next" id="lb-next" aria-label="Next">›</button>

  <div class="lb-body">
    <div id="lb-media"></div>
    <div class="lb-meta">
      <div class="lb-uploader" id="lb-uploader"></div>
      <div class="lb-message"  id="lb-message"></div>
      <div class="lb-counter"  id="lb-counter"></div>
    </div>
  </div>
</div>

<!-- ── Toast ─────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script type="module">
  // ── Nav ───────────────────────────────────────────────
  {
    let user = null;
    try { user = JSON.parse(localStorage.getItem('reelday_user')); } catch { /* */ }
    const navLinks = document.getElementById('dash-nav-links');
    if (user) {
      navLinks.innerHTML = `<a href="/my-events" class="header-nav-link">My Events</a>`;
    } else {
      navLinks.innerHTML = `<a href="/login" class="header-nav-link">Login</a>`;
    }
  }

  // ── Theme map ────────────────────────────────────────
  const THEME_MAP = {
    wedding:          { theme: 'wedding',          emoji: '💍', label: 'Kasalan' },
    debut:            { theme: 'debut',            emoji: '👑', label: 'Debut' },
    birthday:         { theme: 'birthday',         emoji: '🎂', label: 'Kaarawan' },
    seventh_birthday: { theme: 'seventh_birthday', emoji: '🌟', label: '7th Birthday' },
    baptism:          { theme: 'baptism',          emoji: '🕊️', label: 'Binyag' },
    reunion:          { theme: 'reunion',          emoji: '🎉', label: 'Reunion' },
    corporate:        { theme: 'corporate',        emoji: '🏢', label: 'Corporate Event' },
    memorial:         { theme: 'memorial',         emoji: '🕯️', label: 'Memorial' },
  };

  const FIL_MONTHS = ['Enero','Pebrero','Marso','Abril','Mayo','Hunyo',
                      'Hulyo','Agosto','Setyembre','Oktubre','Nobyembre','Disyembre'];

  // ── State ─────────────────────────────────────────────
  const params      = new URLSearchParams(location.search);
  const slug        = params.get('slug');
  const isTestMode  = params.get('test_mode') === 'true';
  const isTrial     = params.get('trial') === 'true';
  let allUploads    = [];
  let lbIndex       = 0;
  let lbItems       = [];   // items currently navigable in lightbox
  let qrDataUrl     = '';
  let activeTab     = 'all';

  // ── DOM refs ──────────────────────────────────────────
  const $ = id => document.getElementById(id);

  const dashHeader    = $('dash-header');
  const pageLoading   = $('page-loading');
  const pageError     = $('page-error');
  const dashMain      = $('dash-main');
  const eventNames    = $('event-names');
  const eventDate     = $('event-date');
  const eventTypeBadge = $('event-type-badge');
  const planBadge     = $('plan-badge');
  const qrWrap        = $('qr-wrap');
  const qrUrl         = $('qr-url');
  const galleryGrid   = $('gallery-grid');
  const galleryEmpty  = $('gallery-empty');
  const vmList        = $('vm-list');
  const vmEmpty       = $('vm-empty');
  const downloadCount = $('download-count');
  const lightbox      = $('lightbox');
  const lbMedia       = $('lb-media');
  const lbUploader    = $('lb-uploader');
  const lbMessage     = $('lb-message');
  const lbCounter     = $('lb-counter');
  const toast         = $('toast');

  // ── Helpers ───────────────────────────────────────────
  function timeAgo(dateStr) {
    const s = Math.floor((Date.now() - new Date(dateStr)) / 1000);
    if (s < 60)             return 'just now';
    const m = Math.floor(s / 60);
    if (m < 60)             return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24)             return `${h}h ago`;
    return `${Math.floor(h / 24)}d ago`;
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return `${FIL_MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`;
  }

  function initial(name) {
    return (name || '?').trim().charAt(0).toUpperCase();
  }

  let toastTimer;
  function showToast(msg, variant = '') {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className   = `toast${variant ? ' ' + variant : ''}`;
    requestAnimationFrame(() => toast.classList.add('show'));
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function applyTheme(eventType) {
    const meta = THEME_MAP[eventType] || THEME_MAP.wedding;
    document.body.setAttribute('data-theme', meta.theme);
    eventTypeBadge.textContent = `${meta.emoji} ${meta.label}`;
    return meta;
  }

  // ── Render header ─────────────────────────────────────
  function renderHeader(event) {
    eventNames.textContent = event.couple_names;
    document.title         = `Reelday — ${event.couple_names}`;

    if (event.event_date) {
      eventDate.textContent = formatDate(event.event_date);
    }

    const plan    = event.plan || 'libre';
    const isPaid  = event.is_paid;
    const isPending = !isPaid && plan !== 'libre';

    if (isPending) {
      planBadge.textContent = 'PENDING';
      planBadge.className   = 'plan-badge plan-pending';
    } else if (plan === 'selebrasyon' && isPaid) {
      planBadge.textContent = 'SELEBRASYON ✓';
      planBadge.className   = 'plan-badge plan-selebrasyon';
    } else if (plan === 'pro' && isPaid) {
      planBadge.textContent = 'PRO ✓';
      planBadge.className   = 'plan-badge plan-pro';
    } else {
      planBadge.textContent = 'LIBRE';
      planBadge.className   = 'plan-badge plan-libre';
    }

    $('btn-live-wall').onclick = () =>
      window.open(`/wall/${slug}`, '_blank');
  }

  // ── Render QR ─────────────────────────────────────────
  function renderQR(dataUrl) {
    qrDataUrl = dataUrl;
    const uploadUrl = `${location.protocol}//${location.host}/upload/${slug}`;

    qrWrap.innerHTML = `<img id="qr-img" src="${dataUrl}" alt="QR Code" />`;
    qrUrl.textContent = uploadUrl;

    $('btn-download-qr').onclick = () => {
      const a = document.createElement('a');
      a.href     = dataUrl;
      a.download = `reelday-qr-${slug}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    $('btn-copy-link').onclick = () => {
      navigator.clipboard.writeText(uploadUrl).then(() => {
        showToast('Link copied! 🔗', 'success');
      }).catch(() => {
        showToast('Copy failed — try manually.', 'error');
      });
    };
  }

  // ── Render stats ──────────────────────────────────────
  function renderStats(uploads) {
    const photos  = uploads.filter(u => !u.is_video_message && u.file_type === 'photo').length;
    const videos  = uploads.filter(u => !u.is_video_message && u.file_type === 'video').length;
    const vms     = uploads.filter(u => u.is_video_message).length;

    $('stat-total').textContent  = uploads.length;
    $('stat-photos').textContent = photos;
    $('stat-videos').textContent = videos;
    $('stat-vms').textContent    = vms;

    const n = uploads.length;
    downloadCount.textContent = `${n} file${n !== 1 ? 's' : ''}`;
  }

  // ── Delete upload ─────────────────────────────────────
  async function deleteUpload(id) {
    if (!confirm('Burahin ang file na ito?')) return;
    try {
      const res = await fetch(`/api/uploads/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('Delete failed');
      allUploads = allUploads.filter(u => u.id !== id);
      renderStats(allUploads);
      renderGallery(allUploads);
      showToast('File nabura na. 🗑️', 'success');
    } catch {
      showToast('Hindi nabura. Subukan ulit.', 'error');
    }
  }

  // ── Render gallery grid ───────────────────────────────
  function renderGallery(uploads) {
    allUploads = uploads;

    lbItems = uploads;

    if (!uploads.length) {
      galleryGrid.innerHTML = '';
      galleryEmpty.style.display = 'block';
    } else {
      galleryEmpty.style.display = 'none';
      galleryGrid.innerHTML = uploads.map((u, i) => {
        const isVideo = u.file_type === 'video';
        const name    = escHtml(u.uploader_name || 'Guest');
        const time    = timeAgo(u.created_at);
        const vmMark  = u.is_video_message ? '<div class="vm-badge">💌</div>' : '';

        const media = isVideo
          ? `<div class="play-overlay"><div class="play-btn-circle">▶</div></div>
             <video src="${escHtml(u.file_url)}" preload="none" style="width:100%;height:100%;object-fit:cover"></video>`
          : `<img src="${escHtml(u.file_url)}" alt="${name}" loading="lazy" />`;

        return `
          <div class="gallery-item" data-index="${i}" data-id="${escHtml(u.id)}">
            ${media}
            ${vmMark}
            <div class="gallery-item-overlay">
              <span class="item-name">${name}</span>
              <span class="item-time">${time}</span>
            </div>
            <button class="btn-delete-item" data-id="${escHtml(u.id)}" title="Burahin">✕</button>
          </div>`;
      }).join('');

      // Attach click via delegation
      galleryGrid.onclick = e => {
        const delBtn = e.target.closest('.btn-delete-item');
        if (delBtn) { deleteUpload(delBtn.dataset.id); return; }
        const item = e.target.closest('.gallery-item');
        if (item) openLightbox(Number(item.dataset.index));
      };
    }

    // Video messages tab
    const vms = uploads.filter(u => u.is_video_message);
    if (!vms.length) {
      vmList.innerHTML = '';
      vmEmpty.style.display = 'block';
    } else {
      vmEmpty.style.display = 'none';
      vmList.innerHTML = vms.map((u, i) => {
        const vmIndex = uploads.indexOf(u);
        return `
          <div class="vm-item">
            <div class="vm-avatar">${escHtml(initial(u.uploader_name))}</div>
            <div class="vm-info">
              <div class="vm-name">${escHtml(u.uploader_name || 'Guest')}</div>
              <div class="vm-meta">${timeAgo(u.created_at)}</div>
            </div>
            <button class="btn-play" data-index="${vmIndex}">▶ I-play</button>
            <button class="btn-delete-vm" data-id="${escHtml(u.id)}" title="Burahin">✕</button>
          </div>`;
      }).join('');

      vmList.onclick = e => {
        const delBtn = e.target.closest('.btn-delete-vm');
        if (delBtn) { deleteUpload(delBtn.dataset.id); return; }
        const btn = e.target.closest('.btn-play');
        if (btn) openLightbox(Number(btn.dataset.index));
      };
    }
  }

  function escHtml(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Tab switching ─────────────────────────────────────
  document.querySelectorAll('.g-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.g-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      $('tab-all').style.display = activeTab === 'all' ? 'block' : 'none';
      $('tab-vm').style.display  = activeTab === 'vm'  ? 'block' : 'none';
    });
  });

  // ── Lightbox ──────────────────────────────────────────
  function openLightbox(index) {
    lbIndex = Math.max(0, Math.min(index, allUploads.length - 1));
    renderLightboxSlide();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function renderLightboxSlide() {
    const u = allUploads[lbIndex];
    if (!u) return;

    // Stop any previous video
    const prevVideo = lbMedia.querySelector('video');
    if (prevVideo) prevVideo.pause();

    if (u.file_type === 'video') {
      lbMedia.innerHTML = `<video src="${escHtml(u.file_url)}" controls autoplay playsinline style="max-height:75vh;border-radius:8px;max-width:100%"></video>`;
    } else {
      lbMedia.innerHTML = `<img src="${escHtml(u.file_url)}" alt="${escHtml(u.uploader_name || '')}" style="max-height:75vh;border-radius:8px;max-width:100%;object-fit:contain" />`;
    }

    lbUploader.textContent = u.uploader_name || 'Anonymous';
    lbMessage.textContent  = u.message || '';
    lbCounter.textContent  = `${lbIndex + 1} of ${allUploads.length}`;
  }

  function closeLightbox() {
    const video = lbMedia.querySelector('video');
    if (video) video.pause();
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  $('lb-close').onclick = closeLightbox;

  $('lb-prev').onclick = () => {
    lbIndex = (lbIndex - 1 + allUploads.length) % allUploads.length;
    renderLightboxSlide();
  };

  $('lb-next').onclick = () => {
    lbIndex = (lbIndex + 1) % allUploads.length;
    renderLightboxSlide();
  };

  lightbox.addEventListener('click', e => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowLeft')  { lbIndex = (lbIndex - 1 + allUploads.length) % allUploads.length; renderLightboxSlide(); }
    if (e.key === 'ArrowRight') { lbIndex = (lbIndex + 1) % allUploads.length; renderLightboxSlide(); }
  });

  // ── Download all ──────────────────────────────────────
  $('btn-download-all').onclick = async () => {
    if (!allUploads.length) { showToast('No files to download.'); return; }
    try {
      const res  = await fetch(`/api/uploads/${slug}/download`);
      const data = await res.json();
      data.files.forEach((f, i) => {
        setTimeout(() => {
          const a = document.createElement('a');
          a.href     = f.url;
          a.target   = '_blank';
          a.rel      = 'noopener';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }, i * 300);
      });
      showToast(`Opening ${data.files.length} files… 📥`, 'success');
    } catch {
      showToast('Could not load files.', 'error');
    }
  };

  // ── Data loading ──────────────────────────────────────
  async function loadAll() {
    if (!slug) {
      pageLoading.style.display = 'none';
      $('page-error-msg').textContent = 'No event slug in URL. Add ?slug=your-slug';
      pageError.style.display = 'block';
      return;
    }

    try {
      const [eventRes, uploadsRes, qrRes] = await Promise.all([
        fetch(`/api/events/${slug}`),
        fetch(`/api/uploads/${slug}`),
        fetch(`/api/events/${slug}/qr`),
      ]);

      if (!eventRes.ok) throw new Error('Event not found');

      const { event }   = await eventRes.json();
      const { uploads } = await uploadsRes.json();
      const { qr_code } = await qrRes.json();

      applyTheme(event.event_type);
      renderHeader(event);
      renderQR(qr_code);
      renderStats(uploads);
      renderGallery(uploads);

      pageLoading.style.display  = 'none';
      dashHeader.style.display   = 'block';
      dashMain.style.display     = 'block';

      // ── Payment banner ────────────────────────────────
      const banner     = $('pay-banner');
      const bannerText = $('pay-banner-text');
      const plan       = event.plan || 'libre';

      if (isTrial || (plan === 'libre' && !event.is_paid)) {
        bannerText.innerHTML = '🆓 Trial mode — <a href="/create">Upgrade to unlock all features →</a>';
        banner.className = 'pay-banner banner-trial';
        banner.style.display = 'flex';
      } else if (!event.is_paid && plan !== 'libre') {
        bannerText.textContent = '⏳ Payment verification in progress. We\'ll activate your event within 1 hour via Viber.';
        banner.className = 'pay-banner banner-pending';
        banner.style.display = 'flex';
      }
    } catch (err) {
      pageLoading.style.display   = 'none';
      $('page-error-msg').textContent = err.message || 'Failed to load event.';
      pageError.style.display     = 'block';
    }
  }

  async function refreshUploads() {
    try {
      const res = await fetch(`/api/uploads/${slug}`);
      if (!res.ok) return;
      const { uploads } = await res.json();
      const currentIds  = new Set(allUploads.map(u => u.id));
      const hasChanges  = uploads.length !== allUploads.length ||
                          uploads.some(u => !currentIds.has(u.id));
      if (hasChanges) {
        renderStats(uploads);
        renderGallery(uploads);
      }
    } catch { /* silent */ }
  }

  // ── Language toggle ───────────────────────────────────
  let dashLang = localStorage.getItem('reelday_lang') || 'en';

  function applyDashLang() {
    document.documentElement.lang = dashLang;
    document.querySelectorAll('[data-en]').forEach(el => {
      if (el.children.length === 0) {
        el.textContent = el.dataset[dashLang] || el.dataset.en;
      }
    });
    document.querySelectorAll('[data-lang]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === dashLang);
    });
  }

  $('lang-toggle')?.addEventListener('click', e => {
    const btn = e.target.closest('[data-lang]');
    if (!btn) return;
    dashLang = btn.dataset.lang;
    localStorage.setItem('reelday_lang', dashLang);
    applyDashLang();
  });

  applyDashLang();

  // ── Init ──────────────────────────────────────────────
  loadAll();
  setInterval(refreshUploads, 10000);
</script>
</body>
</html>
