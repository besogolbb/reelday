<!DOCTYPE html>
<html lang="en" data-theme="wedding">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
  <link rel="shortcut icon" href="/favicon.ico?v=5" />
  <link rel="stylesheet" href="/css/shared.css" />
  <!--EVENT_SITE_HEAD-->
  <style>
    /* ─────────────────────────────────────────────────────────────────
       Event site — editorial magazine layout.
       Palette/typography from shared.css tokens (per-theme accent).
       Host content is rendered via textContent only; no innerHTML for
       host data ever reaches the DOM.
       ───────────────────────────────────────────────────────────────── */

    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    img { display: block; max-width: 100%; }

    /* ── Loading + state ───────────────────────────────── */
    .es-state {
      min-height: 70vh; display: flex; align-items: center;
      justify-content: center; text-align: center;
      color: var(--ink-faint); padding: 40px;
      font-family: var(--mono); font-size: 13px; letter-spacing: .12em;
      text-transform: uppercase;
    }

    /* ── Sticky nav (desktop: chip row, mobile: hamburger) ──
       Desktop keeps chip-based links inline. Mobile collapses to
       a glass top-bar with a hamburger button that opens a full-
       screen sheet (.es-menu) — same content, way better tap
       targets, no edge-clipping or horizontal-scroll confusion. */
    nav.es-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      display: flex; align-items: center; gap: 8px;
      padding: 14px 18px;
      background:
        linear-gradient(180deg, rgba(251,247,238,.96) 0%, rgba(244,234,217,.92) 100%);
      backdrop-filter: saturate(140%) blur(18px);
      -webkit-backdrop-filter: saturate(140%) blur(18px);
      border-bottom: 1px solid rgba(196,90,58,.22);
      box-shadow: 0 14px 32px -22px rgba(42,26,20,.30);
      transform: translateY(-110%); transition: transform .4s ease;
    }
    nav.es-nav.show { transform: translateY(0); }
    .es-nav-inline {
      display: flex; gap: 8px; flex: 1; justify-content: center;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .es-nav-inline::-webkit-scrollbar { display: none; }
    .es-nav-inline { scrollbar-width: none; }
    .es-nav-inline a {
      position: relative; flex: 0 0 auto;
      display: inline-flex; align-items: center;
      padding: 9px 16px;
      background: rgba(255,255,255,.6);
      border: 1px solid rgba(196,90,58,.18);
      border-radius: 999px;
      color: var(--ink); white-space: nowrap;
      font-family: var(--mono); font-size: 12px; font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase;
      transition: background .18s, color .18s, border-color .18s, transform .18s, box-shadow .18s;
    }
    .es-nav-inline a:hover,
    .es-nav-inline a:focus-visible {
      background: var(--accent); color: #fff;
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 8px 18px -6px rgba(196,90,58,.45);
      outline: none;
    }
    .es-nav-inline a:active { transform: translateY(0); }

    /* Hamburger button — visible on mobile only. */
    .es-nav-brand {
      font-family: var(--display); font-size: 17px; color: var(--ink);
      letter-spacing: -.005em; font-weight: 500;
      margin-right: auto; display: none;
      max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .es-burger {
      display: none;
      width: 44px; height: 44px;
      border-radius: 14px; border: 1px solid rgba(196,90,58,.25);
      background: linear-gradient(180deg, #fff 0%, var(--paper-2) 100%);
      box-shadow: 0 4px 12px -4px rgba(42,26,20,.20),
                  inset 0 1px 0 rgba(255,255,255,.7);
      cursor: pointer;
      align-items: center; justify-content: center;
      transition: transform .15s, box-shadow .15s;
    }
    .es-burger:hover { transform: translateY(-1px); box-shadow: 0 8px 18px -6px rgba(42,26,20,.25); }
    .es-burger:active { transform: translateY(0); }
    .es-burger svg { width: 20px; height: 20px; stroke: var(--ink); }

    @media (max-width: 720px) {
      .es-nav-inline { display: none; }
      .es-nav-brand  { display: block; }
      .es-burger     { display: inline-flex; }
      nav.es-nav { padding: 10px 14px; }
    }

    /* ── Full-screen menu sheet (mobile only) ──────────
       Slides in from the right. Paper background with a faint
       grain. Each row is a real button with display-serif label
       and a chevron — feels like a printed table of contents
       rather than a list of links. */
    .es-menu {
      position: fixed; inset: 0; z-index: 60;
      background:
        repeating-linear-gradient(135deg, rgba(196,90,58,.02) 0 1px, transparent 1px 14px),
        radial-gradient(140% 90% at 50% 0%, #fffaf0 0%, #fbf3e2 60%, #f5e9d1 100%);
      transform: translateX(100%);
      transition: transform .35s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column;
      padding: 22px 22px 32px;
      overflow-y: auto;
    }
    .es-menu.open { transform: translateX(0); }
    .es-menu-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .es-menu-eyebrow {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .32em;
      text-transform: uppercase; color: var(--accent);
    }
    .es-menu-close {
      width: 44px; height: 44px;
      border-radius: 14px; border: 1px solid rgba(196,90,58,.30);
      background: rgba(255,255,255,.7);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .es-menu-close svg { width: 18px; height: 18px; stroke: var(--ink); }
    .es-menu-list { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .es-menu-list a {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px;
      background: rgba(255,255,255,.7);
      border: 1px solid rgba(196,90,58,.18);
      border-radius: 18px;
      color: var(--ink);
      box-shadow: 0 6px 18px -10px rgba(42,26,20,.20),
                  inset 0 1px 0 rgba(255,255,255,.8);
      transition: transform .18s, background .18s, color .18s, border-color .18s;
      opacity: 0; transform: translateY(12px);
      animation: menuRowIn .45s ease forwards;
    }
    .es-menu-list a span.lbl {
      font-family: var(--display); font-size: 1.25rem; font-weight: 500;
      letter-spacing: -.005em;
    }
    .es-menu-list a span.arr {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-family: var(--mono); font-size: 14px; font-weight: 700;
    }
    .es-menu-list a:active,
    .es-menu-list a:focus-visible {
      background: var(--accent); color: #fff; border-color: var(--accent);
      transform: translateY(-1px);
      outline: none;
    }
    .es-menu-list a:active span.arr,
    .es-menu-list a:focus-visible span.arr {
      background: #fff; color: var(--accent);
    }
    @keyframes menuRowIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .es-menu-list a:nth-child(1) { animation-delay: .04s; }
    .es-menu-list a:nth-child(2) { animation-delay: .08s; }
    .es-menu-list a:nth-child(3) { animation-delay: .12s; }
    .es-menu-list a:nth-child(4) { animation-delay: .16s; }
    .es-menu-list a:nth-child(5) { animation-delay: .20s; }
    .es-menu-list a:nth-child(6) { animation-delay: .24s; }
    .es-menu-list a:nth-child(7) { animation-delay: .28s; }
    .es-menu-list a:nth-child(8) { animation-delay: .32s; }
    .es-menu-list a:nth-child(9) { animation-delay: .36s; }
    .es-menu-foot {
      margin-top: 22px;
      font-family: var(--mono); font-size: 10px; letter-spacing: .24em;
      text-transform: uppercase; color: var(--ink-faint);
      text-align: center;
    }
    body.menu-open { overflow: hidden; }

    /* ── Hero ──────────────────────────────────────────
       Full-bleed cover image with a slow Ken-Burns zoom and a
       generous bottom gradient so the lockup stays legible no
       matter what the host uploaded. Background-color placeholder
       paints instantly so the hero is never empty paper. */
    .es-hero {
      position: relative; min-height: 100dvh;
      display: grid; grid-template-rows: 1fr auto;
      /* Generous bottom padding reserves space for the absolute scroll
         cue beneath the countdown so the two never overlap on short
         viewports (was 60px → countdown ended up touching SCROLL). */
      padding: 80px 28px 130px;
      color: #fff;
      background:
        linear-gradient(180deg, rgba(20,12,8,.10) 0%, rgba(20,12,8,.18) 35%, rgba(20,12,8,.78) 100%),
        radial-gradient(120% 80% at 50% 40%, #2a1a14 0%, #120a08 100%);
      overflow: hidden;
      isolation: isolate;
    }
    /* Hero cover is now a real <img> element rather than a CSS
       background — lets us hand the browser srcset + sizes so it
       picks an appropriately-sized variant (mobile gets ~960w,
       desktop gets ~1920w) and adds fetchpriority="high" so the
       cover is requested ahead of the gallery and timeline images. */
    .es-hero-bg {
      position: absolute; inset: -3% -3% -3% -3%; z-index: -1;
      width: 106%; height: 106%; object-fit: cover; object-position: center;
      animation: heroZoom 24s ease-in-out infinite alternate;
      opacity: 0; transition: opacity 1.2s ease;
    }
    .es-hero-bg.loaded { opacity: 1; }
    @keyframes heroZoom {
      from { transform: scale(1.04) translateY(0); }
      to   { transform: scale(1.12) translateY(-2%); }
    }
    /* A vignette so the centre stays readable on busy photos. */
    .es-hero::before {
      content: ''; position: absolute; inset: 0; z-index: -1;
      background: radial-gradient(120% 70% at 50% 55%, transparent 0%, rgba(0,0,0,.45) 100%);
      pointer-events: none;
    }
    /* No-cover fallback: pure paper, ink text. */
    .es-hero.no-bg {
      background: var(--paper);
      color: var(--ink);
    }
    .es-hero.no-bg::before { display: none; }

    .es-hero-top {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center;
      gap: 22px;
    }
    .es-hero-kicker {
      display: inline-block; margin: 24px auto 0;
      font-family: var(--mono); font-size: 11px; letter-spacing: .42em;
      text-transform: uppercase; opacity: .82;
      padding: 8px 16px; border: 1px solid currentColor;
      border-radius: 999px;
      animation: fadeUp .9s .35s both;
    }
    .es-hero-lockup {
      animation: fadeUp 1s .25s both;
    }
    .es-hero-names {
      font-family: var(--display); font-weight: 400;
      font-size: clamp(3.2rem, 11vw, 7.5rem); line-height: 1;
      letter-spacing: -.02em; margin: 0;
    }
    .es-hero-names .amp {
      font-style: italic; font-weight: 300;
      color: var(--accent-soft);
      padding: 0 .1em;
    }
    .es-hero.no-bg .es-hero-names .amp { color: var(--accent); }
    .es-hero-date {
      font-family: var(--mono); font-size: 12px; letter-spacing: .32em;
      text-transform: uppercase; margin-top: 18px;
      opacity: .85;
    }
    /* Venue line — italic display serif, mirrors the typographic
       relationship between date and venue on a printed invitation
       (small all-caps date, italic place name beneath). */
    .es-hero-venue {
      margin-top: 10px;
      font-family: var(--display); font-style: italic;
      font-size: clamp(1rem, 1.4vw, 1.15rem);
      letter-spacing: .01em; opacity: .92;
      max-width: 92vw; margin-left: auto; margin-right: auto;
    }
    .es-hero-venue::before,
    .es-hero-venue::after {
      content: ''; display: inline-block;
      width: 18px; height: 1px; vertical-align: middle;
      background: currentColor; opacity: .35;
      margin: 0 12px;
    }
    .es-hero-rule {
      width: 60px; height: 1px; background: currentColor;
      opacity: .4; margin: 22px auto 0;
    }

    .es-hero-bottom {
      display: flex; flex-direction: column; align-items: center;
      gap: 22px; text-align: center;
      animation: fadeUp 1s .55s both;
    }
    .es-count {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    }
    /* Darker tile so the white numbers stay legible no matter what the
       host's cover photo looks like — relying on a translucent white
       wash leaves them invisible on bright photos. */
    .es-count > div {
      min-width: 78px; padding: 12px 10px 10px;
      background: rgba(20,12,8,.55);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    .es-hero.no-bg .es-count > div {
      background: var(--paper-2);
      border-color: var(--line);
      box-shadow: none;
    }
    .es-count b {
      display: block; font-family: var(--display);
      font-size: 2rem; font-weight: 500; line-height: 1;
      color: #fff; letter-spacing: -.01em;
    }
    .es-hero.no-bg .es-count b { color: var(--ink); }
    .es-count span {
      display: block; margin-top: 4px;
      font-family: var(--mono); font-size: 9.5px;
      text-transform: uppercase; letter-spacing: .26em;
      color: rgba(255,255,255,.78);
    }
    .es-hero.no-bg .es-count span { color: var(--ink-faint); }
    .es-cta {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 28px; border-radius: 999px;
      background: var(--accent); color: #fff;
      font-family: var(--mono); font-size: 12px; font-weight: 700;
      letter-spacing: .2em; text-transform: uppercase;
      box-shadow: 0 12px 32px rgba(196,90,58,.32);
      transition: transform .2s, box-shadow .2s;
    }
    .es-cta:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(196,90,58,.42); }
    .es-cta.live { background: #d12d2d; box-shadow: 0 12px 32px rgba(209,45,45,.45); }
    .es-cta.live::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: #fff; animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .4; transform: scale(.7); }
    }
    /* ── Scroll cue ─────────────────────────────────────
       Beefed up from a hairline + 9 px label to a visible chip:
       larger label, an outlined circle holding a chevron, both
       bouncing gently so the eye catches it on a busy cover. */
    .es-hero-scroll {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      font-family: var(--mono); font-size: 11px; letter-spacing: .4em;
      text-transform: uppercase; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.45);
      cursor: pointer;
      z-index: 2;
    }
    .es-hero-scroll-circle {
      width: 42px; height: 42px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.85);
      background: rgba(20,12,8,.35);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      animation: scrollBob 1.8s ease-in-out infinite;
      box-shadow: 0 6px 20px rgba(0,0,0,.30);
    }
    .es-hero-scroll-circle svg { width: 16px; height: 16px; stroke: #fff; }
    @keyframes scrollBob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(8px); }
    }
    .es-hero.no-bg .es-hero-scroll { color: var(--ink); text-shadow: none; }
    .es-hero.no-bg .es-hero-scroll-circle {
      border-color: var(--ink); background: var(--paper-2); box-shadow: none;
    }
    .es-hero.no-bg .es-hero-scroll-circle svg { stroke: var(--ink); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Section frame ─────────────────────────────────── */
    .es-section {
      max-width: 1080px; margin: 0 auto;
      padding: 110px 28px;
      opacity: 0; transform: translateY(30px);
      transition: opacity .9s ease, transform .9s ease;
    }
    .es-section.in { opacity: 1; transform: translateY(0); }
    .es-section + .es-section { border-top: 1px solid var(--line); }

    .es-eyebrow {
      font-family: var(--mono); font-size: 11px; letter-spacing: .32em;
      text-transform: uppercase; color: var(--accent);
      text-align: center; margin: 0 0 14px;
    }
    .es-heading {
      font-family: var(--display); font-weight: 400;
      font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.05;
      letter-spacing: -.01em; text-align: center;
      margin: 0 0 50px; color: var(--ink);
    }
    .es-heading-rule {
      display: block; width: 38px; height: 1px;
      background: var(--accent);
      margin: 22px auto 0;
    }

    /* ── Story (asymmetric two-column on desktop) ───── */
    .es-story-grid {
      display: grid; gap: 40px;
      grid-template-columns: 1fr;
      max-width: 760px; margin: 0 auto;
    }
    @media (min-width: 880px) {
      .es-story-grid { grid-template-columns: 1fr 2fr; gap: 56px; align-items: start; }
    }
    .es-story-side {
      font-family: var(--display); font-style: italic;
      font-size: 1.4rem; color: var(--accent);
      line-height: 1.4;
      border-left: 2px solid var(--accent);
      padding-left: 22px;
    }
    .es-story-body {
      font-family: var(--display); font-size: 1.15rem; line-height: 1.85;
      color: var(--ink-soft);
      white-space: pre-wrap;
    }
    .es-story-body p:first-child::first-letter {
      font-family: var(--display); font-size: 4.2rem; font-weight: 500;
      color: var(--accent); float: left; line-height: .85;
      margin: 6px 12px 0 0;
    }

    /* ── Timeline ──────────────────────────────────────── */
    .es-timeline {
      max-width: 580px; margin: 0 auto;
      position: relative;
    }
    .es-timeline::before {
      content: ''; position: absolute;
      left: 88px; top: 6px; bottom: 6px; width: 1px;
      background: var(--line-2);
    }
    .es-tl-row {
      display: grid; grid-template-columns: 88px 1fr; gap: 0;
      padding: 18px 0;
      position: relative;
    }
    .es-tl-row::after {
      content: ''; position: absolute;
      left: 84px; top: 26px; width: 9px; height: 9px;
      background: var(--paper); border: 2px solid var(--accent);
      border-radius: 50%;
    }
    .es-tl-time {
      font-family: var(--mono); font-size: 12px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--accent); font-weight: 700;
      padding-top: 4px;
    }
    .es-tl-body { padding-left: 26px; }
    .es-tl-title {
      font-family: var(--display); font-size: 1.15rem; color: var(--ink);
      margin: 0 0 2px;
    }
    .es-tl-sub {
      font-family: var(--display); font-style: italic; font-size: .95rem;
      color: var(--ink-faint); margin: 0;
    }

    /* ── Venue ─────────────────────────────────────────── */
    .es-venues { display: grid; gap: 26px; }
    @media (min-width: 760px) {
      .es-venues.two { grid-template-columns: 1fr 1fr; }
    }
    .es-venue {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px; overflow: hidden;
      box-shadow: 0 12px 36px rgba(42,26,20,.06);
    }
    .es-venue-head {
      padding: 22px 24px 18px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .es-venue-name {
      font-family: var(--display); font-size: 1.45rem; color: var(--ink);
      margin: 0; letter-spacing: -.005em;
    }
    .es-venue-addr {
      font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ink-faint); margin: 0;
    }
    .es-map {
      width: 100%; aspect-ratio: 16/9; border: 0;
      background: var(--paper-3);
    }

    /* ── Nearby stays ─────────────────────────────────
       Three deep-link cards under each venue map. Each is a real
       <a> that opens the booking site in a new tab, pre-filtered
       to the venue. No API, no host config — auto-built from the
       venue's address / name / mapQuery. */
    .es-stays {
      padding: 20px 24px 24px;
      border-top: 1px solid var(--line);
      background: linear-gradient(180deg, transparent 0%, rgba(244,234,217,.4) 100%);
    }
    .es-stays-title {
      font-family: var(--mono); font-size: 10px; letter-spacing: .3em;
      text-transform: uppercase; color: var(--accent);
      margin: 0 0 14px;
    }
    .es-stays-list {
      display: grid; gap: 10px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 520px) { .es-stays-list { grid-template-columns: 1fr 1fr 1fr; } }
    .es-stay {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .es-stay:hover {
      transform: translateY(-2px);
      border-color: rgba(196,90,58,.30);
      box-shadow: 0 10px 22px -12px rgba(42,26,20,.20);
    }
    .es-stay .brand {
      flex: 0 0 32px; width: 32px; height: 32px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--display); font-size: 14px; font-weight: 700;
      color: #fff;
    }
    .es-stay .brand.booking { background: #003580; }
    .es-stay .brand.agoda   { background: #ff385c; }
    .es-stay .brand.google  { background: #1a73e8; }
    .es-stay .body { flex: 1; min-width: 0; }
    .es-stay .name {
      font-family: var(--display); font-size: 1rem; color: var(--ink);
      line-height: 1.15; margin: 0;
    }
    .es-stay .sub {
      font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--ink-faint);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: block; margin-top: 2px;
    }
    .es-stay .chev { flex: 0 0 auto; color: var(--accent); font-family: var(--mono); font-weight: 700; }

    /* ── Dress code & parking strips ──────────────────── */
    .es-note-grid {
      display: grid; gap: 18px; margin-top: 32px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 760px) { .es-note-grid.two { grid-template-columns: 1fr 1fr; } }
    .es-note {
      background: var(--paper-2);
      border-radius: 18px;
      padding: 26px 26px 28px;
      border: 1px solid var(--line);
    }
    .es-note h3 {
      font-family: var(--mono); font-size: 11px; letter-spacing: .28em;
      text-transform: uppercase; color: var(--accent); margin: 0 0 10px;
    }
    .es-note p {
      font-family: var(--display); font-size: 1.05rem; line-height: 1.55;
      color: var(--ink-soft); margin: 0;
    }
    .es-swatches { display: flex; gap: 12px; margin-top: 16px; }
    .es-swatch {
      width: 44px; height: 44px; border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 0 1px var(--line), 0 6px 18px rgba(42,26,20,.12);
    }

    /* ── Gallery (varied-aspect masonry) ──────────────── */
    .es-gallery {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .es-gallery a {
      display: block; overflow: hidden; border-radius: 6px;
      background: var(--paper-2);
      position: relative;
    }
    .es-gallery img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .8s ease;
    }
    .es-gallery a:hover img { transform: scale(1.06); }
    /* Editorial pattern: 6-col grid with featured tiles. */
    .es-gallery a:nth-child(6n+1) { grid-column: span 3; aspect-ratio: 4/5; }
    .es-gallery a:nth-child(6n+2) { grid-column: span 3; aspect-ratio: 4/5; }
    .es-gallery a:nth-child(6n+3) { grid-column: span 2; aspect-ratio: 1; }
    .es-gallery a:nth-child(6n+4) { grid-column: span 2; aspect-ratio: 1; }
    .es-gallery a:nth-child(6n+5) { grid-column: span 2; aspect-ratio: 1; }
    .es-gallery a:nth-child(6n+6) { grid-column: span 6; aspect-ratio: 21/9; }
    @media (max-width: 720px) {
      .es-gallery { grid-template-columns: repeat(2, 1fr); }
      .es-gallery a:nth-child(n) {
        grid-column: span 1; aspect-ratio: 1;
      }
      .es-gallery a:nth-child(5n+1) { grid-column: span 2; aspect-ratio: 16/10; }
    }

    /* ── Forms (seat + RSVP) ──────────────────────────── */
    .es-form-wrap { max-width: 460px; margin: 0 auto; }
    .es-field {
      width: 100%; padding: 16px 18px;
      background: #fff;
      border: 1px solid var(--line-2);
      border-radius: 14px;
      font-family: var(--display); font-size: 1rem;
      color: var(--ink); outline: none;
      margin-bottom: 12px;
      transition: border-color .15s, box-shadow .15s;
      box-sizing: border-box;
    }
    .es-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(196,90,58,.14);
    }
    .es-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .es-field-row .es-field { margin-bottom: 12px; }
    .es-btn {
      width: 100%; padding: 16px 22px;
      background: var(--accent); color: #fff;
      border: 0; border-radius: 14px;
      font-family: var(--mono); font-size: 12px; font-weight: 700;
      letter-spacing: .22em; text-transform: uppercase;
      box-shadow: 0 10px 28px rgba(196,90,58,.28);
      transition: transform .15s, box-shadow .15s;
    }
    .es-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 36px rgba(196,90,58,.36); }
    .es-btn.ghost {
      background: transparent; color: var(--accent);
      border: 1.5px solid var(--accent); box-shadow: none;
    }
    .es-btn.ghost:hover { background: var(--accent); color: #fff; }
    .es-btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }

    .es-result { text-align: center; margin-top: 22px; min-height: 24px; }
    .es-result .seat-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      margin-top: 14px;
      box-shadow: 0 8px 24px rgba(42,26,20,.06);
    }
    .es-result .seat-name {
      font-family: var(--mono); font-size: 11px; letter-spacing: .26em;
      text-transform: uppercase; color: var(--ink-faint);
      margin: 0 0 10px;
    }
    .es-result .tbl {
      font-family: var(--display); font-weight: 500;
      font-size: 2.4rem; color: var(--accent);
      letter-spacing: -.01em;
      line-height: 1.1;
    }
    .es-result .seat-card p {
      font-family: var(--display); color: var(--ink-soft); margin: 6px 0 0;
      font-size: 1rem;
    }
    .es-note-line {
      font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--ink-faint); margin-top: 12px;
    }
    /* RSVP success — promoted from the dim mono caps note to a real
       confirmation card so the host can see at a glance that a guest
       was saved (and the guest gets a thank-you that feels earned). */
    .es-rsvp-success {
      display: flex; flex-direction: column; align-items: center;
      gap: 14px;
      margin-top: 18px; padding: 26px 22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(244,234,217,.7) 100%);
      border: 1px solid rgba(196,90,58,.30);
      border-radius: 18px;
      box-shadow: 0 12px 28px -16px rgba(196,90,58,.30);
      text-align: center;
      animation: rsvpSuccessIn .45s ease both;
    }
    @keyframes rsvpSuccessIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .es-rsvp-success .check {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 24px -8px rgba(196,90,58,.55);
    }
    .es-rsvp-success .check svg { width: 26px; height: 26px; stroke: #fff; }
    .es-rsvp-success .msg {
      font-family: var(--display); font-size: 1.4rem; line-height: 1.35;
      color: var(--ink); margin: 0;
    }
    .es-rsvp-success .sub {
      font-family: var(--mono); font-size: 11px; letter-spacing: .22em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    .es-rsvp-success .again {
      margin-top: 6px;
      padding: 10px 18px; border-radius: 999px;
      background: transparent; color: var(--accent);
      border: 1px solid var(--accent);
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase;
      cursor: pointer;
    }
    .es-rsvp-success .again:hover { background: var(--accent); color: #fff; }
    .es-rsvp-error {
      margin-top: 14px; padding: 12px 16px;
      background: rgba(176,48,34,.08);
      border: 1px solid rgba(176,48,34,.25);
      border-radius: 12px;
      font-family: var(--display); font-size: 1rem; color: #7a2418;
      text-align: center;
    }
    /* Deadline notice — small line under the RSVP form when one is set. */
    .es-rsvp-deadline {
      margin-top: 14px; text-align: center;
      font-family: var(--mono); font-size: 11px; letter-spacing: .22em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    .es-rsvp-deadline strong { color: var(--accent); font-weight: 700; }
    /* Closed state — replaces the form once the deadline has passed. */
    .es-rsvp-closed {
      margin: 0 auto; max-width: 460px;
      padding: 30px 26px; text-align: center;
      background:
        linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(244,234,217,.7) 100%);
      border: 1px solid rgba(196,90,58,.30);
      border-radius: 18px;
      box-shadow: 0 12px 28px -16px rgba(196,90,58,.30);
    }
    .es-rsvp-closed .lock {
      width: 48px; height: 48px; margin: 0 auto 14px;
      border-radius: 50%;
      background: var(--paper-2); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(196,90,58,.30);
    }
    .es-rsvp-closed .lock svg { width: 20px; height: 20px; stroke: currentColor; }
    .es-rsvp-closed .title {
      font-family: var(--display); font-size: 1.4rem; color: var(--ink); margin: 0 0 8px;
    }
    .es-rsvp-closed .sub {
      font-family: var(--display); font-size: 1rem; color: var(--ink-soft); margin: 0 0 10px;
      line-height: 1.45;
    }
    .es-rsvp-closed .when {
      font-family: var(--mono); font-size: 11px; letter-spacing: .22em;
      text-transform: uppercase; color: var(--ink-faint);
    }

    /* ── FAQ accordion ─────────────────────────────────── */
    .es-faq { max-width: 720px; margin: 0 auto; }
    .es-faq details {
      border-bottom: 1px solid var(--line);
      padding: 22px 4px;
    }
    .es-faq details summary {
      cursor: pointer; list-style: none;
      font-family: var(--display); font-size: 1.1rem; color: var(--ink);
      display: flex; align-items: center; gap: 14px;
    }
    .es-faq details summary::-webkit-details-marker { display: none; }
    .es-faq details summary::after {
      content: '+'; margin-left: auto;
      font-family: var(--mono); font-size: 1.4rem; color: var(--accent);
      transition: transform .25s;
    }
    .es-faq details[open] summary::after { content: '\2013'; }
    .es-faq details p {
      font-family: var(--display); color: var(--ink-soft);
      font-size: 1rem; line-height: 1.65; margin: 14px 0 0;
    }

    /* ── Registry / Gifts ──────────────────────────────
       Discreet by design: paper-tinted cards, tap-to-copy account
       numbers, optional QR thumbnails. Section reads as a small
       printed addendum rather than a wishlist. */
    .es-registry-msg {
      max-width: 580px; margin: 0 auto 36px;
      text-align: center;
      font-family: var(--display); font-style: italic;
      font-size: 1.15rem; line-height: 1.55;
      color: var(--ink-soft);
    }
    .es-registry-grid {
      display: grid; gap: 16px; max-width: 880px; margin: 0 auto;
      grid-template-columns: 1fr;
    }
    @media (min-width: 720px) { .es-registry-grid { grid-template-columns: 1fr 1fr; } }
    .es-reg-link, .es-reg-cash {
      position: relative;
      background:
        linear-gradient(180deg, rgba(255,255,255,.9) 0%, rgba(244,234,217,.7) 100%);
      border: 1px solid rgba(196,90,58,.20);
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 10px 26px -16px rgba(42,26,20,.20),
                  inset 0 1px 0 rgba(255,255,255,.7);
      transition: transform .18s, box-shadow .18s;
    }
    .es-reg-link:hover { transform: translateY(-2px); box-shadow: 0 14px 32px -16px rgba(196,90,58,.32); }
    .es-reg-link {
      display: flex; align-items: center; gap: 16px;
      text-decoration: none; color: var(--ink);
    }
    .es-reg-link .icon {
      flex: 0 0 44px; width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .es-reg-link .icon svg { width: 18px; height: 18px; stroke: #fff; }
    .es-reg-link .body { flex: 1; min-width: 0; }
    .es-reg-link .lbl {
      font-family: var(--display); font-size: 1.15rem; color: var(--ink);
      margin: 0 0 2px; line-height: 1.25;
    }
    .es-reg-link .url {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--ink-faint);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: block;
    }
    .es-reg-link .chev {
      flex: 0 0 auto; color: var(--accent);
      font-family: var(--mono); font-size: 1.2rem; font-weight: 700;
    }

    /* Cash fund card */
    .es-reg-cash .type-tag {
      display: inline-block;
      font-family: var(--mono); font-size: 10px; letter-spacing: .28em;
      text-transform: uppercase; color: var(--accent);
      padding: 4px 10px; border: 1px solid currentColor;
      border-radius: 999px; opacity: .9;
      margin-bottom: 12px;
    }
    .es-reg-cash .holder {
      font-family: var(--display); font-size: 1.15rem; color: var(--ink);
      margin: 0 0 8px;
    }
    .es-reg-cash .number-row {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border: 1px dashed rgba(196,90,58,.30);
      border-radius: 12px; padding: 12px 14px;
      margin-bottom: 12px;
    }
    .es-reg-cash .number {
      flex: 1; font-family: var(--mono); font-size: 1rem;
      letter-spacing: .04em; color: var(--ink);
      word-break: break-all;
    }
    .es-reg-cash .copy-btn {
      flex: 0 0 auto;
      padding: 8px 14px; border-radius: 999px; border: 0;
      background: var(--accent); color: #fff;
      font-family: var(--mono); font-size: 10.5px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase;
      cursor: pointer;
      transition: background .18s, transform .18s;
    }
    .es-reg-cash .copy-btn:hover { transform: translateY(-1px); }
    .es-reg-cash .copy-btn.done { background: #2d6a4a; }
    .es-reg-cash .qr {
      margin-top: 6px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px;
      display: inline-block;
    }
    .es-reg-cash .qr img {
      width: 120px; height: 120px;
      object-fit: contain; display: block;
      image-rendering: -webkit-optimize-contrast;
    }

    /* ── Good to know cards ────────────────────────────── */
    .es-gtk {
      display: grid; gap: 14px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 640px) { .es-gtk { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 960px) { .es-gtk { grid-template-columns: 1fr 1fr 1fr; } }
    .es-gtk-card {
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
    }
    .es-gtk-card h4 {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .22em;
      text-transform: uppercase; color: var(--accent);
      margin: 0 0 10px;
    }
    .es-gtk-card p {
      font-family: var(--display); font-size: .98rem; line-height: 1.55;
      color: var(--ink-soft); margin: 0;
    }

    /* ── Entourage (paper card) ───────────────────────
       Wrapped in a single textured "paper" card — soft cream tone,
       hairline rust border, faint diagonal grain, deckled drop
       shadow — so the role list reads as a printed wedding
       programme rather than naked body copy. Internal role blocks
       are laid out two-up on desktop with hairline separators. */
    .es-entourage-card {
      position: relative;
      max-width: 820px; margin: 0 auto;
      padding: 56px clamp(28px, 6vw, 64px);
      background:
        repeating-linear-gradient(
          135deg,
          rgba(196,90,58,.025) 0 1px,
          transparent 1px 14px
        ),
        radial-gradient(120% 80% at 50% 0%, #fffaf0 0%, #fbf3e2 60%, #f5e9d1 100%);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow:
        0 1px 0 rgba(255,255,255,.7) inset,
        0 30px 70px -30px rgba(42,26,20,.30),
        0 8px 24px -12px rgba(42,26,20,.18);
    }
    /* Decorative inner hairline frame — classic invitation lockup. */
    .es-entourage-card::before {
      content: '';
      position: absolute; inset: 14px;
      border: 1px solid rgba(196,90,58,.20);
      border-radius: 3px;
      pointer-events: none;
    }
    .es-entourage-title {
      position: relative;
      text-align: center;
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .32em;
      text-transform: uppercase; color: var(--accent);
      margin: 0 0 6px;
    }
    .es-entourage-flourish {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin: 0 0 38px;
      color: var(--accent);
    }
    .es-entourage-flourish::before,
    .es-entourage-flourish::after {
      content: ''; flex: 0 0 60px; height: 1px; background: currentColor; opacity: .35;
    }
    .es-entourage-flourish svg { width: 16px; height: 16px; opacity: .6; }

    .es-entourage {
      position: relative;
      display: grid; gap: 32px 56px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 720px) { .es-entourage { grid-template-columns: 1fr 1fr; } }
    .es-ent-group { text-align: center; padding: 8px 0; }
    .es-ent-group h4 {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .28em;
      text-transform: uppercase; color: var(--accent);
      margin: 0 0 14px;
      position: relative; display: inline-block;
      padding: 0 18px;
    }
    .es-ent-group h4::before,
    .es-ent-group h4::after {
      content: ''; position: absolute; top: 50%;
      width: 14px; height: 1px; background: currentColor; opacity: .4;
    }
    .es-ent-group h4::before { right: 100%; }
    .es-ent-group h4::after  { left: 100%; }
    .es-ent-group .person {
      font-family: var(--display); font-size: 1.1rem; color: var(--ink);
      margin: 4px 0; line-height: 1.45;
    }

    /* ── Footer ────────────────────────────────────────── */
    .es-foot {
      text-align: center; padding: 80px 28px 100px;
      background: #fff;
      border-top: 1px solid var(--line);
    }
    .es-foot-eyebrow {
      font-family: var(--mono); font-size: 11px; letter-spacing: .32em;
      text-transform: uppercase; color: var(--accent);
      margin-bottom: 12px;
    }
    .es-foot-title {
      font-family: var(--display); font-size: clamp(1.6rem, 4vw, 2.4rem);
      color: var(--ink); margin: 0 0 30px;
    }
    .es-foot-actions {
      display: flex; gap: 10px; flex-wrap: wrap;
      justify-content: center; max-width: 520px; margin: 0 auto 36px;
    }
    .es-foot-actions .es-btn { flex: 1 1 200px; }
    .es-foot-credit {
      font-family: var(--mono); font-size: 10px; letter-spacing: .24em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    .es-foot-credit a { color: var(--accent); }

    [hidden] { display: none !important; }
  </style>
