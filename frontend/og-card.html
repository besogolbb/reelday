<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex,nofollow" />
<title>Reelday OG Card — screenshot at 1200×630</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --paper:        #fbf5ec;
    --paper-2:      #f4ead9;
    --ink:          #2a1a14;
    --ink-soft:     #5a443a;
    --accent:       #c45a3a;
    --accent-soft:  #f0a37a;
    --display:      'Fraunces', 'Playfair Display', Georgia, serif;
    --sans:         'Inter', -apple-system, sans-serif;
  }

  html, body {
    width: 1200px;
    height: 630px;
    background: var(--ink);
    overflow: hidden;
    font-family: var(--sans);
  }

  /* The card is exactly 1200x630 so a viewport screenshot yields a
     pixel-perfect OG image with no cropping required. */
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--ink);
  }

  /* Background photo — warm, intimate wedding moment. Darkened with a
     gradient so the text overlay stays readable on any photo content. */
  .bg {
    position: absolute; inset: 0;
    background-image: url('/images/newlyweds.png');
    background-size: cover;
    background-position: center 35%;
    filter: brightness(.82) saturate(1.05);
  }
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(105deg,
        rgba(42,26,20,.92) 0%,
        rgba(42,26,20,.78) 38%,
        rgba(42,26,20,.55) 65%,
        rgba(42,26,20,.40) 100%);
  }

  /* Subtle film-grain warm tint so the card feels designed, not raw. */
  .warmth {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 18% 50%, rgba(196,90,58,.18), transparent 55%),
      radial-gradient(circle at 95% 100%, rgba(240,163,122,.10), transparent 50%);
    mix-blend-mode: screen;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    padding: 64px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: var(--paper);
  }

  /* Wordmark — small but unmistakable. Inverted to read on the dark scrim. */
  .logo-row { display: flex; align-items: center; gap: 14px; }
  .logo {
    height: 52px; width: auto;
    /* LOGO.png is dark-on-paper; invert so it reads white on the scrim. */
    filter: brightness(0) invert(1) drop-shadow(0 2px 8px rgba(0,0,0,.3));
  }

  /* Headline. Big serif, mixed roman + italic for editorial feel. */
  .body { max-width: 820px; }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 112px;
    line-height: .96;
    letter-spacing: -.025em;
    color: var(--paper);
    text-shadow: 0 2px 18px rgba(0,0,0,.35);
  }
  h1 em {
    font-style: italic;
    color: var(--accent-soft);
  }
  .sub {
    margin-top: 24px;
    font-size: 26px;
    font-weight: 400;
    line-height: 1.4;
    color: rgba(251,245,236,.86);
    letter-spacing: .005em;
    max-width: 760px;
    text-shadow: 0 1px 6px rgba(0,0,0,.4);
  }

  /* Footer: domain + a tag line. Domain in accent so it pops. */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 20px;
    color: rgba(251,245,236,.7);
    letter-spacing: .03em;
  }
  .url {
    font-family: var(--display);
    font-style: italic;
    font-size: 32px;
    color: var(--accent-soft);
    letter-spacing: 0;
  }
  .tagline {
    font-size: 18px;
    color: rgba(251,245,236,.55);
    text-transform: uppercase;
    letter-spacing: .14em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="scrim"></div>
  <div class="warmth"></div>
  <div class="content">
    <div class="logo-row">
      <img class="logo" src="/images/LOGO.png" alt="Reelday" />
    </div>
    <div class="body">
      <h1>Every shot.<br/>Every guest.<br/><em>One QR.</em></h1>
      <p class="sub">The cinematic photo-sharing platform for Filipino weddings, birthdays, and celebrations.</p>
    </div>
    <div class="footer">
      <span class="url">reelday.ph</span>
      <span class="tagline">Made in the Philippines</span>
    </div>
  </div>
</div>
</body>
</html>
