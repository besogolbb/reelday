<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__EVENT_TITLE__ - Reelday mobile album</title>
<style>
  :root {
    --paper: #fbf5ec;
    --paper-2: #f4ead9;
    --ink: #2a1a14;
    --ink-soft: #5a443a;
    --ink-faint: #8a7468;
    --line: rgba(63,35,24,.12);
    --accent: #c45a3a;
    --accent-deep: #7a3b2e;
    --accent-soft: #f0a37a;
    --display: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  header {
    padding: 28px 18px 18px;
    border-bottom: 1px solid var(--line);
    text-align: center;
    background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0));
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent-deep);
  }
  h1 {
    margin: 8px 0 6px;
    font-family: var(--display);
    font-size: 30px;
    font-style: italic;
    font-weight: 400;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 14px;
  }
  .help {
    margin: 14px auto 0;
    max-width: 34rem;
    padding: 10px 12px;
    border: 1px solid rgba(196,90,58,.18);
    border-radius: 12px;
    background: rgba(255,255,255,.55);
    color: var(--ink-soft);
    font-size: 12px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    padding: 14px 14px 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 8px 12px;
    cursor: pointer;
  }
  .tab.is-active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .tab .n {
    opacity: .7;
    margin-left: 6px;
    font-family: var(--sans);
  }
  main {
    padding: 10px 14px 36px;
    max-width: 760px;
    margin: 0 auto;
  }
  .empty {
    padding: 36px 18px;
    text-align: center;
    color: var(--ink-faint);
    font-style: italic;
  }
  .list {
    display: grid;
    gap: 14px;
  }
  .card {
    background: rgba(255,255,255,.78);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(63,35,24,.06);
  }
  .media {
    background: #eadcc9;
  }
  .media img,
  .media video {
    display: block;
    width: 100%;
    height: auto;
    max-height: 72vh;
    object-fit: contain;
    background: #eadcc9;
  }
  .audio-tile {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    padding: 28px 20px;
    background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    color: #fff;
    font-size: 68px;
  }
  .body {
    padding: 14px 14px 16px;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 10px;
    align-items: center;
    margin-bottom: 10px;
  }
  .name {
    font-family: var(--display);
    font-size: 24px;
    font-style: italic;
    color: var(--ink);
  }
  .stamp,
  .pill {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .pill {
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid rgba(63,35,24,.12);
    background: var(--paper-2);
  }
  .message {
    margin: 0 0 12px;
    font-family: var(--display);
    font-style: italic;
    font-size: 18px;
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .message::before { content: '"'; }
  .message::after { content: '"'; }
  .audio-wrap {
    margin-top: 12px;
  }
  audio {
    width: 100%;
  }
  .open-row {
    margin-top: 12px;
  }
  .open-link {
    color: var(--accent-deep);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    text-decoration: none;
  }
  footer {
    padding: 26px 18px 34px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 12px;
    border-top: 1px solid var(--line);
  }
  @media (min-width: 720px) {
    header { padding-top: 34px; }
    h1 { font-size: 34px; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Reelday Memories</div>
  <h1>__EVENT_NAMES__</h1>
  <div class="sub">__EVENT_SUB__</div>
  <div class="help">Mobile fallback: simpler inline browsing for phones and tablets. Media opens directly in-page with native controls.</div>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <div class="list" id="list"></div>
</main>

<footer>Open <b>viewer.html</b> on desktop for the richer gallery experience.</footer>

<script>
const MANIFEST = __MANIFEST_JSON__;

(function () {
  const items = Array.isArray(MANIFEST.items) ? MANIFEST.items : [];
  const tabsEl = document.getElementById('tabs');
  const listEl = document.getElementById('list');

  const buckets = {
    all: items,
    paired: items.filter(i => i.type === 'paired-photo' || i.type === 'paired-video'),
    messages: items.filter(i => i.message),
    photos: items.filter(i => i.type === 'photo' || i.type === 'paired-photo'),
    videos: items.filter(i => i.type === 'video' || i.type === 'paired-video'),
    audio: items.filter(i => i.type === 'audio'),
  };

  const tabs = [
    { id: 'all', label: 'All' },
    { id: 'paired', label: 'With audio' },
    { id: 'messages', label: 'With messages' },
    { id: 'photos', label: 'Photos' },
    { id: 'videos', label: 'Videos' },
    { id: 'audio', label: 'Voice notes' },
  ].filter(t => buckets[t.id] && buckets[t.id].length > 0);

  let activeTab = tabs[0] ? tabs[0].id : 'all';

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function formatDate(raw) {
    if (!raw) return '';
    const d = new Date(raw);
    if (isNaN(d.getTime())) return '';
    try {
      return d.toLocaleString('en-PH', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
      });
    } catch (_) {
      return d.toISOString().replace('T', ' ').slice(0, 16);
    }
  }

  function renderTabs() {
    tabsEl.innerHTML = tabs.map(function (t) {
      return '<button class="tab' + (t.id === activeTab ? ' is-active' : '') + '" data-tab="' + t.id + '">' +
        escapeHtml(t.label) + '<span class="n">' + buckets[t.id].length + '</span></button>';
    }).join('');
    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (btn) {
      btn.addEventListener('click', function () {
        activeTab = btn.getAttribute('data-tab') || 'all';
        renderTabs();
        renderList();
      });
    });
  }

  function renderList() {
    const currentList = buckets[activeTab] || [];
    if (!currentList.length) {
      listEl.innerHTML = '<div class="empty">No items in this category.</div>';
      return;
    }

    listEl.innerHTML = currentList.map(function (item) {
      const name = escapeHtml(item.name || 'guest');
      const created = formatDate(item.created);
      const pills = [];
      if (item.type === 'paired-photo' || item.type === 'paired-video') pills.push('With audio');
      if (item.type === 'video' || item.type === 'paired-video') pills.push('Video');
      if (item.type === 'audio') pills.push('Voice note');
      if (item.message) pills.push('Message');
      const pillHtml = pills.map(function (label) {
        return '<span class="pill">' + escapeHtml(label) + '</span>';
      }).join('');

      var mediaHtml = '';
      var openHref = null;
      if (item.type === 'audio') {
        mediaHtml = '<div class="audio-tile">♪</div>';
        openHref = item.audio || item.file || null;
      } else if (item.type === 'video' || item.type === 'paired-video') {
        mediaHtml = '<video controls playsinline preload="metadata" src="' + escapeHtml(item.video || '') + '"></video>';
        openHref = item.video || null;
      } else {
        mediaHtml = '<img src="' + escapeHtml(item.photo || '') + '" alt="' + name + '" loading="lazy" />';
        openHref = item.photo || null;
      }

      var messageHtml = item.message ? '<p class="message">' + escapeHtml(item.message) + '</p>' : '';
      var audioHtml = item.audio
        ? '<div class="audio-wrap"><audio controls preload="metadata" src="' + escapeHtml(item.audio) + '"></audio></div>'
        : '';
      if (item.type === 'audio' && (item.audio || item.file)) {
        audioHtml = '<div class="audio-wrap"><audio controls preload="metadata" src="' + escapeHtml(item.audio || item.file) + '"></audio></div>';
      }
      var openHtml = openHref
        ? '<div class="open-row"><a class="open-link" href="' + escapeHtml(openHref) + '" target="_blank" rel="noopener">Open file directly</a></div>'
        : '';

      return '<article class="card">' +
        '<div class="media">' + mediaHtml + '</div>' +
        '<div class="body">' +
          '<div class="meta">' +
            '<div class="name">' + name + '</div>' +
            (created ? '<div class="stamp">' + escapeHtml(created) + '</div>' : '') +
            pillHtml +
          '</div>' +
          messageHtml +
          audioHtml +
          openHtml +
        '</div>' +
      '</article>';
    }).join('');
  }

  renderTabs();
  renderList();
})();
</script>
</body>
</html>
