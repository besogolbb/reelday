<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__EVENT_TITLE__ — Reelday memories</title>
<style>
  :root {
    --paper:        #fbf5ec;
    --paper-2:      #f4ead9;
    --paper-3:      #ebdec6;
    --ink:          #2a1a14;
    --ink-soft:     #5a443a;
    --ink-faint:    #8a7468;
    --line:         rgba(63,35,24,.12);
    --accent:       #c45a3a;
    --accent-deep:  #7a3b2e;
    --accent-soft:  #f0a37a;
    --display:      Georgia, 'Times New Roman', serif;
    --sans:         -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono:         'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 40px 32px 24px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  header .eyebrow {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent-deep);
  }
  header h1 {
    font-family: var(--display); font-style: italic;
    font-size: 38px; font-weight: 400;
    color: var(--ink); margin: 8px 0 4px;
  }
  header .sub {
    font-size: 14px; color: var(--ink-soft);
  }

  .tabs {
    display: flex; justify-content: center; gap: 8px;
    padding: 18px 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase;
    padding: 7px 14px; border-radius: 999px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .tab.is-active {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  .tab .n {
    font-family: var(--sans); font-weight: 600;
    color: inherit; opacity: .7; margin-left: 6px;
  }

  main {
    max-width: 1200px; margin: 0 auto;
    padding: 28px 24px 64px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .empty {
    grid-column: 1 / -1;
    text-align: center; padding: 60px 20px;
    color: var(--ink-faint);
    font-style: italic;
  }

  .card {
    position: relative;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(63,35,24,.12); }
  .card img, .card video {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .card .audio-icon {
    position: absolute; bottom: 10px; right: 10px;
    width: 32px; height: 32px;
    background: rgba(0,0,0,.55);
    color: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .card .msg-icon {
    position: absolute; top: 10px; right: 10px;
    width: 32px; height: 32px;
    background: rgba(0,0,0,.55);
    color: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .card .video-icon {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,.55); color: #fff;
    font-family: var(--mono); font-size: 9px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .card .label {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 14px 12px 10px;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.65) 100%);
    color: #fff;
    font-size: 12px; font-weight: 600;
    letter-spacing: .01em;
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
  }

  /* Audio-only "card" uses a coloured tile instead of an image. */
  .card.is-audio {
    background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  .card.is-audio .audio-glyph {
    font-size: 60px; opacity: .85;
  }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(20,12,8,.92);
    display: none; align-items: center; justify-content: center;
    padding: 32px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .lightbox.is-open { display: flex; }
  .lightbox-inner {
    position: relative;
    max-width: 100%; max-height: 100%;
    display: flex; flex-direction: column;
    align-items: center; gap: 20px;
  }
  .lightbox-media {
    max-width: 100%; max-height: 70vh;
    border-radius: 12px; box-shadow: 0 30px 60px rgba(0,0,0,.5);
  }
  .lightbox-media img, .lightbox-media video {
    max-width: 100%; max-height: 70vh;
    border-radius: 12px; display: block;
  }
  .lightbox-audio {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px;
    padding: 8px 14px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .lightbox-audio audio { vertical-align: middle; }
  .lightbox-message {
    max-width: 540px;
    color: rgba(251,245,236,.92);
    font-family: var(--display); font-style: italic;
    font-size: 18px; line-height: 1.55; text-align: center;
  }
  .lightbox-message::before { content: '\201C'; }
  .lightbox-message::after  { content: '\201D'; }
  .lightbox-meta {
    color: rgba(251,245,236,.85);
    font-family: var(--display); font-style: italic;
    font-size: 22px; text-align: center;
  }
  .lightbox-meta .meta-sub {
    font-family: var(--sans); font-style: normal;
    font-size: 12px; color: rgba(251,245,236,.55);
    letter-spacing: .12em; text-transform: uppercase;
    margin-top: 4px;
  }
  .lightbox-close, .lightbox-nav {
    position: absolute; z-index: 1;
    background: rgba(255,255,255,.1);
    color: #fff; border: 1px solid rgba(255,255,255,.2);
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 22px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background .15s;
  }
  .lightbox-close:hover, .lightbox-nav:hover { background: rgba(255,255,255,.22); }
  .lightbox-close { top: 24px; right: 24px; }
  .lightbox-nav.prev { top: 50%; left: 24px; transform: translateY(-50%); }
  .lightbox-nav.next { top: 50%; right: 24px; transform: translateY(-50%); }

  footer {
    text-align: center; padding: 40px 24px;
    border-top: 1px solid var(--line);
    color: var(--ink-faint);
    font-size: 12px;
  }
  footer .brand {
    font-family: var(--display); font-style: italic;
    color: var(--accent-deep);
  }

  /* "Play slideshow" button — reminisce mode entry point */
  .play-all {
    margin: 18px auto 2px;
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff; border: none;
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    padding: 12px 24px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(196,90,58,.32);
    transition: background .15s, transform .15s;
  }
  .play-all:hover { background: var(--accent-deep); transform: translateY(-1px); }

  /* ── Slideshow overlay ── */
  .slideshow {
    position: fixed; inset: 0; z-index: 200;
    background: #0a0705;
    display: none;
  }
  .slideshow.is-open { display: block; }
  .ss-stage { position: absolute; inset: 0; overflow: hidden; }
  .ss-slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 1.1s ease;
  }
  .ss-slide.is-shown { opacity: 1; }
  .ss-slide img, .ss-slide video {
    max-width: 100%; max-height: 100%; object-fit: contain;
  }
  /* Photos get a gentle Ken Burns settle so stills feel alive. Uses
     `contain` (not `cover`) so tall portrait shots show in full —
     `cover` cropped their top/bottom to fill a landscape screen. */
  .ss-slide.kb img {
    width: 100%; height: 100%; object-fit: contain;
    animation: kenburns 7s ease-out forwards;
  }
  @keyframes kenburns {
    from { transform: scale(1.06); }
    to   { transform: scale(1); }
  }
  .ss-caption {
    position: absolute; left: 0; right: 0; bottom: 92px;
    text-align: center; padding: 0 40px;
    color: #fff; pointer-events: none;
    text-shadow: 0 2px 14px rgba(0,0,0,.85);
  }
  .ss-caption .ss-msg {
    font-family: var(--display); font-style: italic;
    font-size: 22px; line-height: 1.5;
    max-width: 680px; margin: 0 auto 8px;
  }
  .ss-caption .ss-name {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent-soft);
  }
  .ss-controls {
    position: absolute; left: 50%; bottom: 28px;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
  }
  .ss-controls button, .ss-close {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.22);
    color: #fff; border-radius: 50%;
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 20px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: background .15s;
  }
  .ss-controls button:hover, .ss-close:hover { background: rgba(255,255,255,.26); }
  .ss-close { position: absolute; top: 24px; right: 24px; }
  .ss-music {
    position: absolute; top: 28px; left: 28px;
    color: rgba(255,255,255,.82);
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: .1em;
  }
  .ss-progress {
    position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: rgba(255,255,255,.12); overflow: hidden;
  }
  .ss-progress > span {
    display: block; height: 100%; width: 0;
    background: var(--accent-soft);
  }

  @media (max-width: 600px) {
    header { padding: 28px 18px 18px; }
    header h1 { font-size: 28px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    main { padding: 18px 14px 40px; }
    .lightbox { padding: 12px; }
    .lightbox-nav { width: 36px; height: 36px; }
    .lightbox-nav.prev { left: 8px; }
    .lightbox-nav.next { right: 8px; }
    .ss-caption { bottom: 84px; }
    .ss-caption .ss-msg { font-size: 17px; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Reelday Memories</div>
  <h1>__EVENT_NAMES__</h1>
  <div class="sub">__EVENT_SUB__</div>
  <button class="play-all" id="play-all" style="display:none">▶&nbsp; Play slideshow</button>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <span class="brand">★ reelday.ph</span>
  &nbsp;·&nbsp; Browse this album offline in any browser
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lb-close" aria-label="Close">×</button>
    <button class="lightbox-nav prev" id="lb-prev" aria-label="Previous">‹</button>
    <button class="lightbox-nav next" id="lb-next" aria-label="Next">›</button>
    <div class="lightbox-media" id="lb-media"></div>
    <div class="lightbox-audio" id="lb-audio-wrap" style="display:none">
      <audio id="lb-audio" controls preload="auto"></audio>
    </div>
    <div class="lightbox-message" id="lb-message" style="display:none"></div>
    <div class="lightbox-meta" id="lb-meta"></div>
  </div>
</div>

<!-- Slideshow — auto-advancing "reminisce" playback with event music -->
<div class="slideshow" id="slideshow" aria-hidden="true">
  <div class="ss-progress"><span id="ss-bar"></span></div>
  <div class="ss-stage" id="ss-stage"></div>
  <div class="ss-music" id="ss-music" style="display:none">♪ <span id="ss-music-title"></span></div>
  <button class="ss-close" id="ss-close" aria-label="Close slideshow">×</button>
  <div class="ss-caption" id="ss-caption"></div>
  <div class="ss-controls">
    <button id="ss-prev" aria-label="Previous">‹</button>
    <button id="ss-toggle" aria-label="Pause">❚❚</button>
    <button id="ss-next" aria-label="Next">›</button>
  </div>
  <audio id="ss-audio" preload="auto"></audio>
</div>

<script>
// Manifest injected by backend. See backend/routes/uploads.js — the
// streaming-ZIP endpoint substitutes __MANIFEST_JSON__ with a JSON
// object listing every item in the archive. Inlined here (not fetched)
// so the viewer works when the host opens this file via file:// after
// extracting the ZIP — Chrome and Firefox block fetch() on file://.
const MANIFEST = __MANIFEST_JSON__;

(function () {
  const items = MANIFEST.items || [];
  const grid  = document.getElementById('grid');
  const tabsEl = document.getElementById('tabs');

  // Filter buckets — counted once up front so the tabs can show totals.
  const buckets = {
    all:      items,
    paired:   items.filter(i => i.type === 'paired-photo' || i.type === 'paired-video'),
    messages: items.filter(i => i.message),
    photos:   items.filter(i => i.type === 'photo' || i.type === 'paired-photo'),
    videos:   items.filter(i => i.type === 'video' || i.type === 'paired-video'),
    audio:    items.filter(i => i.type === 'audio'),
  };

  const tabs = [
    { id: 'all',      label: 'All'           },
    { id: 'paired',   label: 'With audio'    },
    { id: 'messages', label: 'With messages' },
    { id: 'photos',   label: 'Photos'        },
    { id: 'videos',   label: 'Videos'        },
    { id: 'audio',    label: 'Voice notes'   },
  ].filter(t => buckets[t.id].length > 0);

  let activeTab = tabs[0]?.id || 'all';
  let currentList = buckets[activeTab];

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"]/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
    ));
  }

  function renderTabs() {
    tabsEl.innerHTML = tabs.map(t => (
      `<button class="tab${t.id === activeTab ? ' is-active' : ''}" data-tab="${t.id}">` +
        `${t.label}<span class="n">${buckets[t.id].length}</span>` +
      `</button>`
    )).join('');
    tabsEl.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        currentList = buckets[activeTab];
        renderTabs();
        renderGrid();
      });
    });
  }

  function renderGrid() {
    if (!currentList.length) {
      grid.innerHTML = '<div class="empty">No items in this category.</div>';
      return;
    }
    grid.innerHTML = currentList.map((item, i) => {
      const name = escapeHtml(item.name || 'guest');
      const msgBadge = item.message ? `<span class="msg-icon" title="Message attached">💬</span>` : '';
      if (item.type === 'audio') {
        return (
          `<div class="card is-audio" data-idx="${i}">` +
            `<div class="audio-glyph">🎙️</div>` +
            msgBadge +
            `<div class="label">${name}</div>` +
          `</div>`
        );
      }
      const isVideo = item.type === 'video' || item.type === 'paired-video';
      const mediaSrc = isVideo ? item.video : item.photo;
      const mediaTag = isVideo
        ? `<video src="${escapeHtml(mediaSrc)}" muted playsinline preload="metadata"></video>`
        : `<img src="${escapeHtml(mediaSrc)}" alt="${name}" loading="lazy" />`;
      const videoBadge = isVideo ? `<span class="video-icon">Video</span>` : '';
      const audioBadge = item.audio ? `<span class="audio-icon" title="Voice note attached">🎙️</span>` : '';
      return (
        `<div class="card" data-idx="${i}">` +
          mediaTag +
          videoBadge +
          audioBadge +
          msgBadge +
          `<div class="label">${name}</div>` +
        `</div>`
      );
    }).join('');
    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openLightbox(Number(card.dataset.idx)));
    });
  }

  // ── Lightbox ─────────────────────────────────────────────
  const lightbox    = document.getElementById('lightbox');
  const lbMedia     = document.getElementById('lb-media');
  const lbAudio     = document.getElementById('lb-audio');
  const lbAudioWrap = document.getElementById('lb-audio-wrap');
  const lbMessage   = document.getElementById('lb-message');
  const lbMeta      = document.getElementById('lb-meta');
  let   lbIndex     = 0;

  function openLightbox(idx) {
    lbIndex = idx;
    paintLightbox();
    lightbox.classList.add('is-open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lightbox.classList.remove('is-open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    // Stop any playing media when closing
    lbMedia.innerHTML = '';
    try { lbAudio.pause(); lbAudio.removeAttribute('src'); lbAudio.load(); } catch {}
  }
  function paintLightbox() {
    const item = currentList[lbIndex];
    if (!item) return;
    const safeName = escapeHtml(item.name || 'guest');
    const safeDate = item.created
      ? new Date(item.created).toLocaleString('en-PH', { dateStyle: 'long', timeStyle: 'short' })
      : '';

    // Media area
    if (item.type === 'video' || item.type === 'paired-video') {
      lbMedia.innerHTML =
        `<video src="${escapeHtml(item.video)}" controls autoplay playsinline></video>`;
    } else if (item.type === 'audio') {
      lbMedia.innerHTML =
        `<div style="width:60vw;max-width:480px;aspect-ratio:1/1;` +
        `background:linear-gradient(135deg,#f0a37a,#c45a3a);border-radius:12px;` +
        `display:flex;align-items:center;justify-content:center;font-size:120px;color:#fff">🎙️</div>`;
    } else {
      lbMedia.innerHTML = `<img src="${escapeHtml(item.photo)}" alt="${safeName}" />`;
    }

    // Audio overlay — paired-photo / paired-video have a separate audio
    // file; pure-audio items load the audio inline as the "media"
    // because there's no other content to display.
    if (item.audio || item.type === 'audio') {
      const audioSrc = item.audio || item.audioFile || (item.type === 'audio' ? item.file : null);
      lbAudio.src = escapeHtml(audioSrc || item.audio || '');
      lbAudio.play().catch(() => {/* autoplay blocked is OK */});
      lbAudioWrap.style.display = '';
    } else {
      lbAudioWrap.style.display = 'none';
      try { lbAudio.pause(); lbAudio.removeAttribute('src'); } catch {}
    }

    // Guest's typed message — companion text, shown above the byline.
    // textContent (not innerHTML) so the message can't inject markup.
    if (item.message) {
      lbMessage.textContent = item.message;
      lbMessage.style.display = '';
    } else {
      lbMessage.textContent = '';
      lbMessage.style.display = 'none';
    }

    lbMeta.innerHTML =
      `${safeName}` +
      (safeDate ? `<div class="meta-sub">${safeDate}</div>` : '');
  }
  function nav(dir) {
    if (!currentList.length) return;
    lbIndex = (lbIndex + dir + currentList.length) % currentList.length;
    paintLightbox();
  }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', () => nav(-1));
  document.getElementById('lb-next').addEventListener('click', () => nav(+1));
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('is-open')) return;
    if (e.key === 'Escape')     closeLightbox();
    else if (e.key === 'ArrowLeft')  nav(-1);
    else if (e.key === 'ArrowRight') nav(+1);
  });

  // ── Slideshow — "reminisce" mode ──────────────────────────
  // Auto-advancing fullscreen playback of every photo/video with the
  // event's music underneath. Always started from a user click (the
  // Play button) so browsers permit audio + video autoplay through
  // the gesture chain. Music files + track list ship in MANIFEST.music
  // (bundled into the ZIP by backend/routes/uploads.js).
  const PHOTO_MS     = 6500;    // a photo holds this long on screen
  const VIDEO_CAP_MS = 20000;   // hard cap so one long clip can't stall the show
  const slideItems = items.filter(i =>
    i.type === 'photo' || i.type === 'video' ||
    i.type === 'paired-photo' || i.type === 'paired-video');
  const musicList = MANIFEST.music || [];

  const ssEl         = document.getElementById('slideshow');
  const ssStage      = document.getElementById('ss-stage');
  const ssCaption    = document.getElementById('ss-caption');
  const ssBar        = document.getElementById('ss-bar');
  const ssAudio      = document.getElementById('ss-audio');
  const ssMusic      = document.getElementById('ss-music');
  const ssMusicTitle = document.getElementById('ss-music-title');
  const ssToggle     = document.getElementById('ss-toggle');
  const playAllBtn   = document.getElementById('play-all');

  let ssIndex     = 0;
  let ssGen       = 0;       // generation guard — stale video 'ended' events ignored
  let ssPaused    = false;
  let musicIndex  = 0;
  let advanceTimer = null;
  let barStart    = 0;       // performance.now() when current slide's timer began
  let barLeft     = 0;       // ms remaining on the current slide
  let curVideo    = null;    // <video> of the current slide, if any

  if (slideItems.length) playAllBtn.style.display = '';

  function clearAdvance() {
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  }

  // Drive both the auto-advance timeout and the top progress bar for `ms`.
  function startTimer(ms) {
    clearAdvance();
    barStart = performance.now();
    barLeft  = ms;
    advanceTimer = setTimeout(nextSlide, ms);
    ssBar.style.transition = 'none';
    ssBar.style.width = '0%';
    void ssBar.offsetWidth;               // reflow so the next line animates
    ssBar.style.transition = 'width ' + ms + 'ms linear';
    ssBar.style.width = '100%';
  }

  function paintSlide() {
    clearAdvance();
    const gen  = ++ssGen;
    const item = slideItems[ssIndex];
    if (!item) return;
    const isVideo = item.type === 'video' || item.type === 'paired-video';

    // New slide layered over the old one; old slides trimmed once the
    // 1.1s cross-fade has finished.
    const slide = document.createElement('div');
    slide.className = 'ss-slide' + (isVideo ? '' : ' kb');
    if (isVideo) {
      const v = document.createElement('video');
      v.src = item.video; v.muted = true; v.playsInline = true;
      v.setAttribute('playsinline', '');
      v.addEventListener('ended', () => { if (gen === ssGen) nextSlide(); });
      slide.appendChild(v);
      curVideo = v;
    } else {
      const img = document.createElement('img');
      img.src = item.photo; img.alt = '';
      slide.appendChild(img);
      curVideo = null;
    }
    ssStage.appendChild(slide);
    requestAnimationFrame(() => slide.classList.add('is-shown'));
    setTimeout(() => {
      while (ssStage.children.length > 1) ssStage.removeChild(ssStage.firstChild);
    }, 1200);

    // Caption — guest name + their typed message, the keepsake voice.
    const name = escapeHtml(item.name || 'guest');
    const msg  = item.message ? `<div class="ss-msg">${escapeHtml(item.message)}</div>` : '';
    ssCaption.innerHTML = msg + `<div class="ss-name">${name}</div>`;

    if (isVideo) {
      curVideo.play().catch(() => {/* will resume on toggle */});
      startTimer(VIDEO_CAP_MS);           // 'ended' usually fires first
    } else {
      startTimer(PHOTO_MS);
    }
  }

  function nextSlide() {
    if (!slideItems.length) return;
    ssIndex = (ssIndex + 1) % slideItems.length;
    paintSlide();
  }
  function prevSlide() {
    if (!slideItems.length) return;
    ssIndex = (ssIndex - 1 + slideItems.length) % slideItems.length;
    paintSlide();
  }

  function ssSetPaused(p) {
    ssPaused = p;
    ssToggle.textContent = p ? '▶' : '❚❚';
    ssToggle.setAttribute('aria-label', p ? 'Play' : 'Pause');
    if (p) {
      barLeft = Math.max(0, barLeft - (performance.now() - barStart));
      clearAdvance();
      ssBar.style.transition = 'none';
      ssBar.style.width = getComputedStyle(ssBar).width;   // freeze where it is
      if (curVideo) { try { curVideo.pause(); } catch {} }
      try { ssAudio.pause(); } catch {}
    } else {
      startTimer(barLeft);
      if (curVideo) curVideo.play().catch(() => {});
      try { ssAudio.play().catch(() => {}); } catch {}
    }
  }

  // Music — play tracks in order, loop the set under the whole show.
  function playTrack(i) {
    const t = musicList[i];
    if (!t) return;
    musicIndex = i;
    ssAudio.src = t.file;
    ssAudio.volume = 0.85;
    ssAudio.play().catch(() => {/* autoplay blocked — controls still work */});
    ssMusicTitle.textContent = t.title + (t.artist ? ' — ' + t.artist : '');
  }
  ssAudio.addEventListener('ended', () => {
    if (!musicList.length) return;
    playTrack((musicIndex + 1) % musicList.length);
  });

  function openSlideshow() {
    if (!slideItems.length) return;
    ssIndex = 0;
    ssPaused = false;
    ssToggle.textContent = '❚❚';
    ssToggle.setAttribute('aria-label', 'Pause');
    ssEl.classList.add('is-open');
    ssEl.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    if (musicList.length) { ssMusic.style.display = ''; playTrack(0); }
    paintSlide();
  }
  function closeSlideshow() {
    clearAdvance();
    ssGen++;                              // invalidate any pending video 'ended'
    ssEl.classList.remove('is-open');
    ssEl.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    ssStage.innerHTML = '';
    ssCaption.innerHTML = '';
    curVideo = null;
    try { ssAudio.pause(); ssAudio.removeAttribute('src'); ssAudio.load(); } catch {}
  }

  playAllBtn.addEventListener('click', openSlideshow);
  document.getElementById('ss-close').addEventListener('click', closeSlideshow);
  document.getElementById('ss-prev').addEventListener('click', prevSlide);
  document.getElementById('ss-next').addEventListener('click', nextSlide);
  ssToggle.addEventListener('click', () => ssSetPaused(!ssPaused));
  document.addEventListener('keydown', e => {
    if (!ssEl.classList.contains('is-open')) return;
    if (e.key === 'Escape')          closeSlideshow();
    else if (e.key === 'ArrowLeft')  prevSlide();
    else if (e.key === 'ArrowRight') nextSlide();
    else if (e.key === ' ')          { e.preventDefault(); ssSetPaused(!ssPaused); }
  });

  // ── Init ──────────────────────────────────────────────────
  renderTabs();
  renderGrid();
})();
</script>
</body>
</html>
